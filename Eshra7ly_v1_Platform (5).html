<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eshra7ly — Whatever the question</title>
<style>
:root{--navy:#1B2C3B;--navy2:#27394B;--orange:#DD6540;--oranged:#B84E2E;--sage:#6E7C6B;--saged:#59685A;
--cream:#FDF9F6;--sand:#F3EAE0;--sand2:#F8F2EB;--border:#E6D9CC;--muted:#77695C;--ink:#1B2C3B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--cream);color:var(--ink);height:100vh;display:flex;flex-direction:column}
header{background:var(--cream);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wm{font-family:Georgia,serif;font-size:24px;font-weight:700;letter-spacing:-.3px;color:var(--navy)}
.wm b{color:var(--orange)}
.tag{font-size:12.5px;color:var(--muted);font-style:italic}
.tag .ar{font-style:normal;color:var(--saged)}
nav{margin-inline-start:auto;display:flex;gap:4px;background:var(--sand2);border:1px solid var(--border);border-radius:12px;padding:4px}
nav button{border:none;background:transparent;padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
nav button.on{background:var(--navy);color:var(--cream)}
#langBtn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--saged);cursor:pointer}
main{flex:1;overflow-y:auto}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px}
.page{display:none}.page.on{display:block}
/* chat */
.msg{margin-bottom:16px;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.bubble{max-width:88%;padding:12px 16px;border-radius:14px;line-height:1.6;font-size:14.5px;white-space:pre-wrap}
.user .bubble{background:var(--navy);color:var(--cream);border-bottom-right-radius:5px}
.bot .bubble{background:var(--sand2);border:1px solid var(--border);border-bottom-left-radius:5px}
.cite{background:#F5DFD4;border:1px solid #EAC7B6;border-radius:6px;padding:0 5px;font-size:12px;color:var(--oranged);font-weight:600;white-space:nowrap}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-width:88%}
.srcs .lbl{font-size:10.5px;letter-spacing:1.5px;color:var(--muted);font-weight:700;width:100%}
.chip{background:var(--sand);border:1px solid var(--border);color:var(--saged);font-size:11.5px;padding:4px 10px;border-radius:20px}
.hello h1{font-family:Georgia,serif;font-size:24px;margin-bottom:6px}
.hello h1 span{color:var(--orange)}
.hello p{color:var(--muted);font-size:14px;line-height:1.55}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}
.starter{background:#fff;border:1.5px solid var(--border);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.starter:hover{border-color:var(--orange);color:var(--orange)}
.think{display:flex;gap:5px;padding:13px 16px}
.think i{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:b 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}
.err{color:#9B3B22;font-size:13.5px}
footer{border-top:1px solid var(--border);background:var(--cream);padding:12px 18px 8px}
.inrow{max-width:820px;margin:0 auto;display:flex;gap:10px}
#q{flex:1;border:1.5px solid var(--border);border-radius:12px;padding:12px 15px;font-size:14.5px;font-family:inherit;resize:none;background:#fff;outline:none;min-height:48px;max-height:130px}
#q:focus{border-color:var(--orange)}
#send{background:var(--orange);color:#fff;border:none;border-radius:12px;padding:0 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#send:disabled{background:#E8B4A2}
.disc{max-width:820px;margin:7px auto 0;font-size:10.5px;color:var(--muted);text-align:center}
/* guides */
.gGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;margin-top:14px}
.gCard{background:var(--sand2);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.15s}
.gCard:hover{border-color:var(--orange)}
.gCard h3{font-family:Georgia,serif;font-size:15.5px;margin-bottom:6px;color:var(--navy)}
.gCard p{font-size:12.5px;color:var(--muted);line-height:1.45}
.h2{font-family:Georgia,serif;font-size:22px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:6px;line-height:1.5}
/* checklist */
.ck{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:10px;display:flex;gap:12px;align-items:flex-start}
.ck input{margin-top:4px;width:17px;height:17px;accent-color:var(--orange);cursor:pointer;flex-shrink:0}
.ck b{font-size:14px;display:block;margin-bottom:3px}
.ck span{font-size:12.5px;color:var(--muted);line-height:1.45}
.ck.done{background:var(--sand2)}
.ck.done b{color:var(--saged);text-decoration:line-through}
.prog{height:9px;background:var(--sand);border-radius:6px;margin:12px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sage);border-radius:6px;transition:width .3s}
.pnote{font-size:12px;color:var(--saged);font-weight:600}
.ckask{font-size:12px;color:var(--orange);cursor:pointer;font-weight:600;background:none;border:none;font-family:inherit;padding:0;margin-top:5px}
/* fees */
.fbox{background:var(--sand2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:14px}
.fbox label{font-size:13px;font-weight:600;display:block;margin:10px 0 5px}
.fbox input[type=number]{width:100%;max-width:280px;border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-size:15px;font-family:inherit;outline:none}
.fbox input[type=number]:focus{border-color:var(--orange)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;margin-top:2px}
.seg button{border:none;background:transparent;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--sage);color:#fff}
.fres{margin-top:16px;background:var(--navy);color:var(--cream);border-radius:12px;padding:16px 18px}
.fres .amt{font-family:Georgia,serif;font-size:30px;font-weight:700;color:#F5C9B6}
.fres .exp{color:#8FD4A8}
.fres p{font-size:12.5px;color:#A8B4BE;margin-top:6px;line-height:1.5}
@media(max-width:640px){nav{width:100%;order:3}.tag{display:none}}
</style>
</head>

<header>
  <svg width="40" height="40" viewBox="0 0 60 62" aria-hidden="true">

    <path d="M38 5 l12 12 h-9 a3 3 0 0 1 -3 -3 z" fill="#DD6540" stroke="#DD6540" stroke-width="3" stroke-linejoin="round"/>
    <rect x="17" y="22" width="24" height="4" rx="2" fill="#6E7C6B"/>

    <rect x="17" y="38" width="12" height="4" rx="2" fill="#6E7C6B"/>

  <div>
    <div class="wm">Eshra<b>7</b>ly</div>
    <div class="tag"><span data-i18n="tagEn">Whatever the question.</span> · <span class="ar">مهما كان سؤالك</span></div>

  <nav>
    <button data-p="ask" class="on"></button>

</header>

<main id="main">
  <!-- ASK -->
  <div class="page on" id="p-ask"><div class="wrap" id="feed">
    <div class="hello">
      <h1 id="helloT"></h1>
      <p id="helloP"></p>
      <div class="starters" id="starters"></div>
    </div>
  </div></div>

  <!-- GUIDES -->
  <div class="page" id="p-guides"><div class="wrap">
    <div class="h2" id="gT"></div><div class="sub" id="gS"></div>

  <!-- FEES -->
  <div class="page" id="p-fees"><div class="wrap">

</main>

<footer id="askFoot">
  <div class="inrow">
    <textarea id="q" rows="1"></textarea>
    <button id="send">Ask</button>

</footer>

e data subject is no longer identifiable.\n\nA security measure involving the transformation of data into an\n Data Encryption unintelligible form, so that it can be restored to a readable form\n only with the appropriate decryption key.\n\nSecuring personal data against unlawful or unauthorised\nData Security (principle) processing, access, alteration, damage, loss, or destruction,\n throughout the data’s lifecycle.\n\nAny unauthorised or unlawful access to personal data, or any\n Personal Data Breach unlawful processing to copy, send, distribute, exchange,\n transfer, or use aiming to expose, disclose, destroy, or alter\n personal data during storage, transfer, or processing.\n\nBreach of Any unauthorised or accidental disclosure of, or access to,\n Confidentiality personal data.\n\nBreach of Integrity Any unauthorised or accidental alteration of personal data.\n\nAny unauthorised or accidental loss of access to, or destruction\n Breach of Availability\n of, personal data.\n\nAn incident that poses a risk to the confidentiality, integrity, or\n Security Incident\n availability of personal data, without materialising into a breach.\n\nA register documenting all personal data breaches that occurred,\n Data Breach Register by registering information on each breach, covering the causes\n and effects of the breach, as well as the remedial and the\n corrective measures taken.\n\nA documented and actionable framework designed to ensure\n Breach Response Plan that personal data breaches are managed promptly, effectively,\n and lawfully.\n\nAccountability Ensuring personal data is processed in compliance with all data\n protection principles and obligations and being able to\n (principle)\n demonstrate such compliance through documentation.\n\nTechnical and Safeguards adopted by a natural or juridical person to manage\n Organisational privacy risks, protect personal data and demonstrate compliance\n Measures (TOMs) with PDPL.\n\nRecord of Processing A structured record capturing key information on all personal\n Activities (RoPA) data processing activities conducted by data users."}, {"id": "guide-key-terms-004", "ref": "Key Terms — PDPL Glossary Guidelines — KEY TERMS", "text": "An assessment conducted when a processing activity is likely to\nData Protection Impact result in a high risk to the individual’s rights and freedoms, used\n Assessment (DPIA) to identify, assess, and mitigate the potential risks of that\n processing.\n\nData Subject Rights A set of rights granted to data subjects under the PDPL.\n\nThe right allowing data subjects to be proactively and effectively\n Right to be Informed provided with adequate information about the processing of\n their personal data.\n\nA transparency tool informing data subjects about the\n Privacy Notice\n processing of their personal data.\n\nRight to be Notified in The right allowing data subjects to be notified in a timely\ncase of a Personal Data manner of any data breach affecting their personal data.\n Breach\n\nThe right allowing data subjects to obtain confirmation as to\n Right of Access whether their personal data is being processed, and, where\n applicable, to receive a copy of such data and of the requested\n information about the processing activity.\n\nThe right allowing data subjects to freely revoke their previous\n Right to Withdraw consent to the processing of personal data at any time in the\n Consent processing lifecycle, through a clear, simple, accessible and\n cost-free mechanism.\n\nRight to Erasure (or The right allowing data subjects to request the erasure of their\n right to be forgotten) personal data from data users’ records.\n\nThe right allowing data subjects to request the correction or\n Right to Rectification\n update of inaccurate personal data held by data users.\n\nThe right allowing data subjects to object and request cessation\n Right to Object\n of the processing of their personal data.\n\nRight to Restriction of The right allowing data subjects to request the temporary\n Processing restriction of the processing of their personal data.\n\nThe right allowing data subjects to transfer their personal data\nRight to Data Portability from a data user to another one, in a structured, commonly used,\n and machine-readable format.\n\nSending any message, statement, advertisement, or marketing\n content, by any technical means and in any form, intended\n Electronic Marketing directly or indirectly to promote goods, services, solicitations, or\n requests of a commercial, political, social, or charitable nature,\n and directed to specific people."}, {"id": "guide-key-terms-005", "ref": "Key Terms — PDPL Glossary Guidelines — KEY TERMS", "text": "Electronic Direct Electronic marketing addressed to a specific individual or a\n defined category of individuals, relying on personal data such as\n Marketing (EDM)\n names, contact details, or online identifiers.\n\nElectronic Direct The means through which EDM is carried out, which\n Marketing encompasses all forms of electronic communication.\n Communication\n (EDMC)\n\nA natural or juridical person who determines the purposes and\n Creator\n means of processing personal data for EDM purposes.\n\nA natural or juridical person who transmits or delivers an EDMC\n Sender\n to the data subject on behalf of the creator.\n\nThe mechanism allowing data subjects to provide consent to\n Opt in\n receiving EDMCs.\n\nThe mechanism allowing data subjects to withdraw consent or\n Opt out\n object to receiving EDMCs.\n\nAny disclosure, recording, storage, trading, publishing, usage,\nCross-Border Data display, transmit, receiving, recovering, or processing of\n Transfer personal data flowing from the Arab Republic of Egypt to a\n foreign country, territory, or international organisation.\n\nAny natural or juridical person subject to the PDPL—acting as\n Data Exporter\n a data user—who transfers personal data to a data importer\n outside the Arab Republic of Egypt.\n\nAny natural or juridical person established outside the Arab\n Data Importer Republic of Egypt—acting as a data user—who receives\n personal data from a data exporter.\n\nA decision issued by the PDPC enlisting the foreign countries,\n Whitelist territories, or international organisations that ensure a level of\n data protection equivalent to that provided under the PDPL.\n\nSmall text files placed onto a user’s device when they visit a\n Cookies website or an application, either by the website or application\n operator, or by a third party, to store information on the user’s\n visit.\n\n@pdpceg info@pdpc.gov. eg"}, {"id": "guide-lawful-basis-001", "ref": "Lawful Bases of Processing Guidelines — LAWFUL BASES OF", "text": "LAWFUL BASES OF\n PROCESSING\n GUIDELINES\n\nVersion 1.1. - 26 January 2026\n\nIntroduction ........................................................................................................................... 2\n1. Data Subject’s Consent .................................................................................................... 3\n 1.1. General Conditions ................................................................................................... 3\n 1.2. Additional Conditions for Sensitive Personal Data ............................................... 3\n2. Fulfilment of a Contractual Obligation .......................................................................... 4\n3. Fulfilment of a Legal Obligation ..................................................................................... 5\n4. Legitimate Interest ........................................................................................................... 5\n5. Claim or Defence of a Legal Right .................................................................................. 6\n6. Execution of Court Judgments or Orders from Competent Investigative Authorities .........6\n\nIntroduction\nThe lawfulness principle stands at the core of the Personal Data Protection Law (PDPL),\nensuring that personal data is collected, processed, retained, and disclosed only when justified\nby valid legal reasons. As such, the lawfulness principle maintains a fair balance between\nenabling business needs and safeguarding data subjects against any unjustified interference with\ntheir privacy.\n\nTo this end, all processing activities must rely on at least one of the six lawful bases enumerated\nunder Article 6 of the PDPL. Data Users must—prior to initiating any processing activity—\ndetermine the applicable lawful basis, conduct the necessary assessments to ensure the validity\nof the basis, and maintain appropriate documentation demonstrating compliance.\n\nThis guideline sets out the lawful bases of processing personal data:\n\n1. Data subject’s consent;\n 2. Fulfilment of a contractual obligation;\n 3. Fulfilment of a legal obligation;\n 4. Legitimate interest;\n 5. Claim or defence of a legal right; or\n 6. Execution of court judgments or orders from competent investigative authorities.\n\n1. Data Subject’s Consent\nTo be considered valid, the data subject’s consent must always be personal, explicit, informed,\nspecific, and freely given.\n\nMoreover, processing sensitive personal data based on consent must meet stricter additional\nconditions.\n\n1.1. General Conditions\n● Personal: Consent must be provided directly by the data subject or by their authorised\n legal representative.\n● Explicit: Consent must be clear and unequivocal, leaving no doubt as to the data subject’s\n intention to authorise the processing of their personal data.\n● Informed: The data subject must be adequately informed about the processing of their\n personal data, including at least:\n 1. The controller’s identity;\n 2. The purpose(s) of the processing;\n 3. The categories of data that will be processed; and\n 4. The right to withdraw consent at any time.\n● Specific: The information provided to the data subject regarding the processing activity must\n be clearly defined, and neither vague nor bundled. Moreover, the consent remains valid only\n for the specific information communicated to the data subject.\n● Freely given: The data subject must have a genuine choice to accept or refuse the processing\n of their data without feeling coerced or compelled to do so."}, {"id": "guide-lawful-basis-002", "ref": "Lawful Bases of Processing Guidelines — LAWFUL BASES OF", "text": "1.2. Additional Conditions for Sensitive Personal Data\nAs the processing of sensitive personal data may present high risks to data subjects’ rights and\nfreedoms, additional conditions must be satisfied for the consent to be considered valid.\n\nNote:\n Sensitive data, as defined under Article 1 of the PDPL, consists of the following:\n • Genetic data;\n • Biometric data;\n • Health data;\n • Financial data;\n • Religious beliefs;\n • Political opinions;\n • Security data; and\n • Children’s data.\n\n● Written: Consent for all categories of sensitive personal data must be in writing, whether\n in paper form or through electronic means.\n● Legal Guardian’s Consent: The processing of children’s personal data requires\n consent from the child’s legal guardian, considering the following:\n o For children under the age of 15, consent must be provided only by the guardian.\n o For children over the age of 15, the consent can be provided by either the child or the\n guardian, as long as the guardian is aware of the child’s consent.\n\nFor more information on the data subject’s consent, please refer to the Data Subject’s Consent\nGuideline.\n\n2. Fulfilment of a Contractual Obligation\nThis lawful basis applies where the processing of personal data is required for the performance\nof a contract to which the data subject is a party, or to take steps to enter into such a contract\n(e.g., filling in forms, requesting quotations, etc…).\n\nFor reliance on this basis to be valid, the processing must be strictly necessary to execute or\nconclude the contract, in a manner that the contract could not reasonably be performed without\nthe required personal data.\n\nExample 1:\n A social media platform (SMP) collects users’ data, including browsing behaviour on\n their own- and third-party platforms to personalise the content displayed. The SMP\n claims to rely on fulfilment of contractual obligation as a lawful basis, asserting that users\n accept their general terms of use mandated to access their services.\n This processing activity is not lawful, as the collection of such data and personalising the\n content is not objectively necessary to fulfil the contract’s main subject-matter\n (providing the social networking service) which could be delivered without such\n processing."}, {"id": "guide-lawful-basis-003", "ref": "Lawful Bases of Processing Guidelines — LAWFUL BASES OF", "text": "Example 2:\n An online retailer collects gender data to personalise order confirmation emails by\n addressing customers as “Dear Sir” or “Dear Madam”. The retailer claims to rely on\n fulfilment of contractual obligation as a lawful basis, asserting that personalised greetings\n are part of their brand and show respect to customers.\n This collection is not lawful, as personalising emails by gender is not objectively\n necessary to fulfil the contract’s main subject-matter (selling products and confirming\n orders), particularly when less data-driven alternatives, such as “Dear Customer,” could\n achieve the same purpose.\n\nExample 3:\n An insurance company collects a strict amount of personal data from prospective\n customers to assess eligibility and determine policy terms before entering into a contract.\n This processing activity is lawful, as the data collection is strictly necessary to take steps\n at the request of the data subject for issuing an appropriate insurance policy.\n\n3. Fulfilment of a Legal Obligation\nTo be considered valid, the processing activity must be strictly necessary to comply with a legal\nobligation imposed by applicable laws and regulations.\n\nExample 1:\n A financial institution retains customers’ personal data for five years from the date of\n account closure to comply with the obligation prescribed under Article 9 of the Anti-\n Money Laundering Law, as enacted by Law No. 80 of the year 2002. Such processing\n activity is deemed lawful under the fulfilment of legal obligation basis.\n\nExample 2:\n A hotel is collecting customers’ personal data, such as their names and nationalities, to\n comply with the obligation prescribed under Article 13 of Prime Minister’s Decree No.\n 705 of the year 2023. Such processing activity is deemed lawful under the fulfilment of\n legal obligation basis.\n\n4. Legitimate Interest\nLegitimate interest can be perceived as a flexible lawful basis for processing personal data—\ncovering a broad range of cases (e.g., maintaining the proper functioning of websites, securing\npremises, or improving products or services).\n\nHowever, when choosing to rely on this lawful basis, the data user must conduct a legitimate\ninterest assessment (LIA) to ensure that the processing activity meets the following cumulative\nconditions:\n ● Legitimacy: The interest pursued by the data user must be legitimate;\n ● Necessity: The processing activity must be strictly necessary to achieve the\n pursued interest; and\n ● Proportionality: The processing activity must be proportionate, ensuring that the\n pursued interest does not override the data subject’s rights and freedoms."}, {"id": "guide-lawful-basis-004", "ref": "Lawful Bases of Processing Guidelines — LAWFUL BASES OF", "text": "Example:\n A sports club sought to generate revenues by selling member data, such as names and\n contact details, to external sponsors, relying on legitimate interest as their lawful basis.\n Such processing activity is not lawful as the data subjects’ rights and freedoms override\n the club’s interests to generate revenues.\n\n5. Claim or Defence of a Legal Right\nFor the processing activity to be considered valid, it must be strictly necessary to claim or\ndefend a legal right.\n\nExample:\n A service provider stores client files invoking the exercise or defence of legal claims as\n their lawful basis. However, since the statute of limitations for initiating such claims had\n already run out, such retention is unlawful.\n\n6. Execution of Court Judgments or Orders from Competent Investigative\n Authorities\nTo be considered valid, the processing activity must be strictly necessary to abide by court\njudgments or to execute orders given by competent investigative authorities.\n\nExample:\n A court issues a judgment requiring a non-banking financial institution to provide\n financial records of an individual as part of legal proceedings. Such processing activity\n may be deemed lawful under the basis of execution of court judgments.\n\nFor all lawful bases requiring the necessity condition:\n The necessity condition prescribed in multiple lawful bases must be strictly assessed in\n accordance with the data minimisation principle, requiring the data user to ensure that the\n processing activity is relevant, adequate, and necessary in relation to the intended\n purpose.\n ● Relevant: The personal data maintains a logical link and functional connection to\n the intended purpose.\n ● Adequate: The personal data is sufficient, in amount and nature, to effectively\n fulfil the intended purpose.\n ● Necessary: The personal data is strictly limited to the minimum required to achieve\n the purpose, with no less intrusive alternatives available.\n\n@pdpceg info@pdpc.gov. eg"}, {"id": "guide-consent-001", "ref": "Data Subject Consent Guidelines — DATA SUBJECT", "text": "DATA SUBJECT\n CONSENT\n GUIDELINES\n\nVersion 1.1. - 26 January 2026\n\nIntroduction .............................................................................................................................. 2\n1. Appropriateness of Consent as a Lawful Basis............................................................... 3\n2. Conditions for Valid Consent........................................................................................... 3\n 2.1. General Conditions........................................................................................................ 3\n 2.2. Additional Conditions for Sensitive Personal Data .................................................... 4\n3. Requirements of Consent Requests ................................................................................. 4\n 3.1. Content of Consent Requests ........................................................................................ 4\n 3.2. Design of Consent Requests .......................................................................................... 4\n 3.3. Additional Design Requirements for Sensitive Personal Data................................... 9\n4. Management of Consent ................................................................................................... 9\n 4.1. Preference Management Tools ..................................................................................... 9\n 4.2. Refreshing Consent ....................................................................................................... 9\n5. The Right to Withdraw Consent.................................................................................... 10\n 5.1. Ensuring Effective Withdrawal.................................................................................. 10\n 5.2. Post-Withdrawal Responsibilities .............................................................................. 11\n6. Consent Records.............................................................................................................. 11\n\nIntroduction\n\nPursuant to the Personal Data Protection Law (PDPL), all processing activities of personal data\nmust be lawful (Article 3), meaning they must rely on at least one of the six lawful bases\nenumerated under Article 6, namely:\n 1. The data subject’s consent;\n 2. Fulfilment of a contractual obligation;\n 3. Fulfilment of a legal obligation;\n 4. Legitimate interest;\n 5. Claim or defence of a legal right; or\n 6. Execution of court judgments or orders from competent investigative authorities.\n\nConsent requires a clear and affirmative action from the data subject, showing that they agree\nto the use of their personal data for specific and clearly defined purposes. Given the nature of\nconsent, relying on this lawful basis can be challenging in practice and requires strict\nconditions. Accordingly, data users must ensure that consent is the appropriate lawful basis for\nthe processing activity in question, that it is obtained in a valid manner, managed responsibly\nthroughout the entire processing lifecycle, and properly documented to demonstrate\ncompliance when required.\n\nThis guideline sets out:\n 1. Appropriateness of consent as a lawful basis;\n 2. Conditions for valid consent;\n 3. Structure of consent requests;\n 4. Management of consent;\n 5. Right to withdraw consent; and\n 6. Consent records.\n\nFor more information on the lawful bases of processing, please refer to the Lawful Bases\nGuideline.\n\n1. Appropriateness of Consent as a Lawful Basis\n\nThe validity conditions for data subject consent are stringent. Accordingly, before relying on\nconsent, data users are advised to assess whether it is an appropriate lawful basis for the\nintended processing activity."}, {"id": "guide-consent-002", "ref": "Data Subject Consent Guidelines — DATA SUBJECT", "text": "Consent is generally appropriate where data users can provide data subjects with a genuine\nchoice to accept, refuse, or withdraw consent for the processing of their personal data. If such\ngenuine choice and control cannot be offered, another lawful basis may be more appropriate.\nNotably, the selection of the lawful basis must always be determined on a case-by-case basis,\ntaking into account the specific processing activity, the purpose, and context.\n\nFor instance, consent may not be the most appropriate in the following situations:\n\n● Power imbalance: Where there is a clear power imbalance between the data user and\n the data subject (e.g., employment relationship), the data subject may feel pressure to\n consent to the processing of their personal data, making it difficult for data users to\n demonstrate that such consent was freely given.\n\n● Processing regardless of consent: A data user must not rely on consent where the\n processing will occur irrespective of whether consent is refused or withdrawn, as this\n renders the choice afforded to data subjects illusory (e.g., requesting data subjects’\n consent for CCTV installed in a mall where recording occurs regardless of their choice).\n\nAccordingly, assessing the appropriateness of the lawful basis at the outset helps to reduce the\nrisk of future compliance issues.\n\n2. Conditions for Valid Consent\n\nTo be deemed valid, consent must, at all times, meet a set of general validity conditions.\nMoreover, the processing of sensitive personal data requires the fulfilment of additional\nconditions.\n\n2.1. General Conditions\n\nTo be deemed valid, consent must be:\n ▪ Personal: Consent must be provided directly by the data subject or by their authorised\n legal representative.\n ▪ Explicit: Consent must be clear and unequivocal, leaving no doubt as to the data\n subject’s intention to authorise the processing of their personal data.\n ▪ Informed: The data subject must be adequately informed about the processing of their\n personal data.\n\n▪ Specific: The information provided to the data subject regarding the processing\n activity must be clearly defined, and neither vague nor bundled. Moreover, the consent\n remains valid only for the specific information communicated to the data subject.\n ▪ Freely given: The data subject must have a genuine choice to accept or refuse the\n processing of their data without feeling coerced or compelled to do so."}, {"id": "guide-consent-003", "ref": "Data Subject Consent Guidelines — DATA SUBJECT", "text": "2.2. Additional Conditions for Sensitive Personal Data\n\nAs the processing of sensitive personal data—including children’s data—may present high\nrisks to data subjects’ rights and freedoms, additional conditions must be satisfied for the\nconsent to be considered valid.\n ● Written: Consent for all categories of sensitive personal data must be in writing,\n whether in paper form or through electronic means.\n ● Legal Guardian’s Consent: The processing of children’s personal data requires\n consent from the child’s legal guardian, considering the following:\n ○ For children under the age of 15, consent must be provided only by the guardian.\n ○ For children over the age of 15, consent can be provided by either the child or\n the guardian, as long as the guardian is aware of the child’s consent.\n\n3. Requirements of Consent Requests\n\nA consent request is the mechanism through which data users seek and obtain data subjects’\nacceptance to the processing of their personal data. To ensure compliance, consent requests\nmust be designed in a manner that ensures that the consent obtained allows the fulfilment of\nthe above-mentioned validity conditions.\n\n3.1. Content of Consent Requests\n\nConsent requests must clearly cover, at minimum, the following information:\n ● The identity of the data user;\n ● The purpose(s) of processing;\n ● The categories of personal data that will be processed; and\n ● The right to withdraw consent at any time.\n\n3.2. Design of Consent Requests\n\nConsent requests must be designed to meet the following requirements:\n ● In Arabic;\n ● Intelligible;\n\n● Concise;\n ● Requesting affirmative action;\n ● Granular;\n ● Separate; and\n ● Visible and prominent.\n\na. In Arabic\n\nConsent requests must be provided in Arabic as the primary language. Data users remain free\nto add other languages depending on their business needs.\n\nb. Intelligible\n\nWording must be plain, clear, and free from complex legal or technical jargon, vagueness,\nambiguity, double negatives, or inconsistencies.\n\nc. Concise\n\nThe information provided must be precise and straightforward, using short sentences and\norganised paragraphs.\n\nd. Requesting Affirmative Action\n\nConsent requests cannot rely on implicit or presumed consent, default mechanisms such as pre-\nchecked boxes.\n\ne. Granular\n\nWhere relevant, separate consent should be obtained for distinct purposes or processing\nactivities."}, {"id": "guide-consent-004", "ref": "Data Subject Consent Guidelines — DATA SUBJECT", "text": "f. Separate\n\nConsent requests must be standalone, i.e., kept separate from general terms and conditions,\nprivacy notices, etc.\n\nNote:\n Consent requests and privacy notices serve two different purposes. The privacy notice\n ensures that the data subject is informed about the processing of their personal data\n regardless of the lawful basis relied upon, whereas the consent requests focus on obtaining\n the data subject’s valid consent.\n\ng. Visible and Prominent\n\nData subjects must be offered a clear and prominent choice to accept or refuse consent. Data\nusers must avoid the use of dark patterns, which are deceptive design features that manipulate\nusers into consenting (e.g., hiding or obscuring the “refuse” option, or visually emphasising the\n“accept” option).\n\nExample:\n A school introduces facial-recognition technology for cashless canteen payments. In\n terms of consent, they relied on an opt-out slip sent to parents. Parents were deemed to\n have consented unless they returned the slip to refuse participation. This method of\n obtaining consent is invalid as data users cannot rely on presumed consent to process data\n subjects’ personal data.\n\n3.3. Additional Design Requirements for Sensitive Personal Data\n\nData users relying on consent to process sensitive data, including children’s data, must ensure\nthat the consent requests meet the following additional conditions:\n ● Written Consent: Implementing mechanisms to record and retain written consent\n when processing sensitive data; and\n ● Age Verification Measures: Establishing proportionate verification processes to\n determine whether the data subject meets the required age threshold or whether\n guardian consent is necessary.\n\n4. Management of Consent\n\nOnce consent has been obtained, data users must ensure that it is properly managed by\nproviding data subjects with preference-management tools and ensuring consent is refreshed.\n\n4.1. Preference Management Tools\n\nData subjects must be provided with ongoing choice and control over their consent. This may\nbe ensured through accessible and user-friendly preference management tools (e.g., privacy\ndashboards), which enable data subjects to access, manage, and update their consent settings\nat any time.\n\n4.2. Refreshing Consent\n\nData users must ensure that consent remains valid and up-to-date, and reflects the processing\nactivity. Accordingly, data users are advised to refresh consent at appropriate intervals,\nparticularly where relying on the original consent may no longer be sufficient. This is especially\nnecessary when parental consent was obtained for a child who has since reached the age of\nconsent, in which case the data user must obtain the individual’s own consent."}, {"id": "guide-consent-005", "ref": "Data Subject Consent Guidelines — DATA SUBJECT", "text": "Consent must also be refreshed whenever the processing activity or the purposes substantially\nchange, as the original consent will no longer constitute a valid lawful basis. In such cases, the\ndata user must obtain new consent that accurately reflects the updated processing activity or\npurpose.\n\n5. The Right to Withdraw Consent\n\nData users must ensure that data subjects can effectively exercise their right to withdraw\nconsent throughout the processing activity lifecycle.\n\n5.1. Ensuring Effective Withdrawal\n\nFor consent to remain freely given, it must also be freely revocable, meaning data users must:\n\na) Inform data subjects, prior to or at the time of obtaining consent, of their right to\n withdraw consent at any time and the manner in which it may be exercised;\n\nb) Provide a withdrawal mechanism that is clear, simple, accessible, user-friendly, and\n free from any hidden settings or unnecessary requirements, and ideally through the\n same method by which consent was given;\n\nExample:\n A marketing agency implements a withdrawal mechanism requiring data subjects to first\n click an “unsubscribe” link in emails and then send a separate email explaining the reasons\n for withdrawal.\n This withdrawal mechanism is not valid, as it creates unnecessary obstacles for data\n subjects and prevents them from easily withdrawing their consent.\n\nc) Ensure withdrawal of consent is free of charge;\n\nd) Enable withdrawal of consent at any time; and\n\ne) Ensure that withdrawal of consent is without adverse consequences to data subjects,\n meaning it does not result in any penalty, limitation, or loss of services to the withdrawn\n consent.\n\nExample:\n An email service provider designs their platform so that data subjects must consent to\n marketing cookies to continue using their email services. If they attempt to withdraw\n consent, data subjects are warned that such withdrawal will result in the loss of access to\n their email accounts. No alternative options are provided, thereby compelling users to\n either accept these non-essential cookies or abandon the service entirely.\n This practice is unlawful as the right to withdraw consent must be free and cannot be tied\n to abandoning irrelevant services.\n\n5.2. Post-Withdrawal Responsibilities\n\nUpon data subjects’ withdrawal of consent, data users shall:"}, {"id": "guide-consent-006", "ref": "Data Subject Consent Guidelines — DATA SUBJECT", "text": "● Cease all processing activities based on the withdrawn consent without undue delay;\n ● Synchronise withdrawal across all relevant systems, if applicable;\n ● Notify any data recipients of the consent withdrawal, if applicable; and\n ● Record the withdrawal, including its time and date.\n\nNote:\n Withdrawal of consent does not affect the lawfulness of processing activities carried out\n prior to the withdrawal, provided that the initial consent was valid.\n\n6. Consent Records\n\nMaintaining records of consent is a key element of accountability. It enables data users to\ndemonstrate at any time that valid consent was obtained under the proper conditions. Such\nrecords must be accurate, regularly updated, and made available to the PDPC upon request.\n\nConsent records must contain, at minimum, the following information:\n\n● Who consented: the data subject’s name or unique identifier;\n\n● When consent was obtained: the date and time (e.g., digital timestamp);\n\n● Information provided: details of the information provided to the data subject in the\n consent request;\n\n● How consent was given: the affirmative action taken by the data subject to authorise\n the processing; and\n\n● Withdrawal of consent: whether the data subject has exercised their right to withdraw\n consent, and if so, the date and time of withdrawal.\n\n@pdpceg info@pdpc.gov. eg"}, {"id": "guide-dpo-001", "ref": "Data Protection Officer (DPO) Guidelines — DATA PROTECTION", "text": "DATA PROTECTION\n OFFICER\n GUIDELINES\n\nVersion 1.1. - 26 January 2026\n\nIntroduction .................................................................................................................................... 2\n\n1. The Key Responsibilities of the DPO ....................................................................................... 3\n\n1.1. Overseeing the Data User’s Compliance with Personal Data Protection Obligations\n ........................................................................................................................................... 3\n\n1.2. Point of Contact for Data Subjects’ Requests and Complaints ................................... 3\n\n1.3. Point of Contact with the PDPC ..................................................................................... 4\n\n2. The Registration of the DPO .................................................................................................... 4\n\n2.1. Qualification Criteria....................................................................................................... 4\n\n2.2. Registration Application .................................................................................................. 5\n\n2.3. PDPC Assessment of Application ................................................................................... 5\n\n3. The Appointment of the DPO................................................................................................... 5\n\n3.1. Appointment Obligation .................................................................................................. 5\n\n3.2. The DPO Position in the Organisational Chart ............................................................ 6\n\n4. Data Users’ Obligations Towards the DPO ............................................................................ 6\n\n5. Termination of Appointment and Replacement ..................................................................... 7\n\n5.1. Termination by the Data User or the DPO .................................................................... 7\n\n5.2. Termination by the PDPC ............................................................................................... 7\n\nIntroduction\n\nThe data protection officer (DPO) is a function newly established by the Personal Data Protection\nLaw (PDPL). A DPO is a natural person responsible for assisting and overseeing data users in\ncomplying with the data protection regulatory framework.\n\nJuridical persons acting as data users must appoint a DPO irrespective of the scale of their\nprocessing activities. Natural persons acting as data users may either appoint a DPO or personally\nassume the obligations associated with this role.\n\nThis guideline sets out:\n 1. The DPO’s key responsibilities;\n 2. The DPO’s registration;\n 3. The DPO’s appointment;\n 4. Data users’ obligations towards the DPO; and\n 5. The DPO’s termination of appointment and replacement.\n\n1. The Key Responsibilities of the DPO\n\nThe DPO has three main responsibilities:\n ● Overseeing the data user’s compliance with personal data protection obligations;\n ● Being a point of contact for data subjects’ requests and complaints; and\n ● Being a point of contact with the Personal Data Protection Centre (PDPC).\n\n1.1. Overseeing the Data User’s Compliance with Personal Data\n Protection Obligations\n\nA DPO has the obligation of overseeing and ensuring the data user’s compliance with personal\ndata protection obligations.\n\nSuch a role includes:\n ● Assisting data users in the development and implementation of a privacy program;\n ● Ensuring the effective implementation of PDPC decisions and guidelines;\n ● Advising the data user on how to comply with personal data protection obligations;\n ● Overseeing the maintenance, accuracy, and regular updating of the record of processing\n activities (ROPA);\n ● Reviewing and advising on the organisation’s privacy policies;\n ● Supporting the delivery of data protection training and awareness programs to the data\n user’s employees;\n ● Reviewing data protection risk assessments (e.g., DPIAs, LIAs);\n ● Advising the data user on the determination of appropriate technical and organisational data\n protection measures;\n ● Advising the data user on appropriate personal data breach management measures; and\n ● Ensuring effective procedures and measures are in place to enable data subject rights, and\n that data subject complaints are duly received, managed, and addressed."}, {"id": "guide-dpo-002", "ref": "Data Protection Officer (DPO) Guidelines — DATA PROTECTION", "text": "For more information on personal data protection obligations, please refer to the Data Users\nGuideline.\n\n1.2. Point of Contact for Data Subjects’ Requests and Complaints\n\nThe DPO acts as the primary contact point for all data subjects’ requests and complaints. The DPO\nmust ensure that there are appropriate processes in place to handle any inquiry, request, or\n\ncomplaint regarding the processing of personal data, and must oversee that they are addressed\nwithin the timeframe determined by the PDPL.\n\nThis does not imply that the DPO must personally execute data subject requests themselves, but\nrather ensure the process is properly handled and managed (e.g., ensuring the request is forwarded\nto the relevant department and that appropriate actions are taken to fulfil it).\n\nThe DPO’s contact details must be made available, both publicly and internally within the entity,\nto ensure both internal and external data subjects can easily and directly contact them.\n\n1.3. Point of Contact with the PDPC\n\nThe DPO serves as the designated point of contact for all communications to the PDPC concerning\nthe data user’s processing activities. Additionally, the DPO must:\n ● Notify the PDPC of personal data breaches within the legally required timeframe;\n ● Submit annual reports to the PDPC on the personal data protection compliance status of\n the data user, and upon the request of the PDPC; and\n ● In the case of DPO replacement, submit reports to the PDPC on the data user’s personal data\n protection compliance status within 15 days of the replacement. This is to be done by the\n newly appointed DPO.\n\n2. The Registration of the DPO\n\nThe PDPC has established an electronic registry, known as the DPO Registry, in which DPOs must\nbe registered in order to be recognised as such.\n\n2.1. Qualification Criteria\n\nWhile no specific professional background is required, the DPO must meet the following\nqualification criteria to be eligible for registration:\n ● Possession of an academic degree or professional credentials:\n ○ An academic degree, preferably in law, computer science, or a related field.\n ○ Professional credentials in the field of data protection (e.g., IAPP certifications).\n ● Successful completion of the PDPC exam. For more information on DPO exams, please\n refer to the DPO Categories Guideline.\n ● Having no convictions involving dishonesty or breach of trust."}, {"id": "guide-dpo-003", "ref": "Data Protection Officer (DPO) Guidelines — DATA PROTECTION", "text": "2.2. Registration Application\n\nThe registration application shall be submitted personally by the DPO applicant through the\nPDPC’s electronic portal.\n\nApplications to register require submitting the following:\n ● A copy of the national ID for Egyptians or passport for foreigners;\n ● A recent personal photo of the applicant;\n ● Evidence of meeting the qualification criteria;\n ● A copy of the applicant’s criminal record. For foreign applicants, the record must be\n duly certified by the relevant authorities; and\n ● Payment of application fees.\n\n2.3. PDPC Assessment of Application\n\nThe PDPC will assess applications and conduct DPO registration in accordance with the\nfollowing process:\n ● If all required information and documents are submitted in the initial application, the PDPC\n will determine the application within thirty (30) working days from the date of submission.\n ● If the PDPC considers that additional documents, information, or actions are required, the\n PDPC will formally notify the applicant and specify a deadline for completing the\n application. Once the application is completed, the PDPC will determine the application\n within fifteen (15) days from the completion date.\n ● Where the application is accepted, the applicant must pay the registration fee to be listed\n on the DPO Registry.\n ● Upon registration, the DPO will receive a unique identification number referred to as the\n “DPO Code”.\n\nFor more information on DPO qualification criteria, DPO registration, as well as reassessment\nand renewal of DPO certification, please refer to the DPO Categories Guideline.\n\n3. The Appointment of the DPO\n\n3.1. Appointment Obligation\n\nJuridical persons acting as data users must appoint a DPO irrespective of the scale of their\nprocessing activities. Natural persons acting as data users may either appoint a DPO or personally\n\nassume the obligations associated with this role. In all cases, such appointment must be in\naccordance with the following conditions:\n ● The DPO must be registered on the PDPC’s DPO Registry;\n ● The DPO’s category must correspond to the data user’s processing activities; and\n ● A declaration of appointment signed by both parties must be submitted to the PDPC.\n\nFor more information on DPO categories, please refer to the DPO Categories Guideline."}, {"id": "guide-dpo-004", "ref": "Data Protection Officer (DPO) Guidelines — DATA PROTECTION", "text": "3.2. The DPO Position in the Organisational Chart\n\nThe DPO may either be an internal employee or an external service provider.\n\nFurthermore, the same DPO may be appointed by two or more data users, and is referred to as a\n“shared DPO”. Such appointment may be made by unrelated or intra-group entities, provided that\nthe following conditions are met:\n ● The appointment complies with the conditions set out in Section 3.1.;\n ● Only in case of unrelated entities, each data user has formally authorised the DPO to\n undertake such responsibilities through the PDPC electronic portal;\n ● No conflict of interest arises from the shared DPO appointments. Any conflict of\n interest— whether existing at the time of appointment or arising thereafter—must be\n promptly reported to the PDPC, which will assess the situation and either approve or\n reject the appointments; and\n ● The PDPC has approved the shared DPO appointments.\n\nNote:\n The shared DPO must ensure that their record-keeping is appropriately segregated and\n organised for each data user. This is essential for them to perform their duties independently\n and to enable the PDPC to conduct proper reviews as may be needed.\n\n4. Data Users’ Obligations Towards the DPO\n\nTo ensure the DPO can perform their duties effectively, data users must:\n ● Ensure the timely and appropriate involvement of the DPO in all matters related to personal\n data protection.\n ● Allow the DPO to exercise their role with full independence and refrain from any undue\n influence. This means a DPO can neither be instructed, penalised, nor threatened for\n performing their duties. Such an obligation must be included in the contract governing the\n DPO-data user relationship.\n\n● Provide necessary support for the DPO. This includes providing the DPO with all required\n resources, as well as complete and accurate information, within a reasonable timeframe\n that enables the DPO to perform their duties effectively.\n ● Ensure the existence of appropriate communication channels that enable the DPO to\n perform their duties effectively and to report to management and relevant stakeholders.\n ● Ensure that no conflict of interest affects the DPO’s independence. If the DPO occupies\n another role within the same entity, the data user must ensure that the exercise of any such\n function does not compromise the DPO’s independence or ability to perform their duties\n in full neutrality."}, {"id": "guide-dpo-005", "ref": "Data Protection Officer (DPO) Guidelines — DATA PROTECTION", "text": "5. Termination of Appointment and Replacement\n\n5.1. Termination by the Data User or the DPO\n\nBefore the effective date of a DPO termination, the legal representative of the data user must ensure\nDPO replacement is done in accordance with the aforementioned appointment conditions and\nprocess.\n\nFurthermore, the legal representative must notify the PDPC via the electronic portal at least fifteen\n(15) days prior to the termination’s effective date, specifying:\n ● The reason for termination (e.g., end of contract without renewal, resignation,\n dismissal, incapacitation, or death);\n ● The registration code of the newly appointed DPO; and\n ● The duration of the mandate of the newly appointed DPO, in case such mandate is\n temporary.\n\n5.2. Termination by the PDPC\n\nIf the PDPC discovers a DPO has breached any of the registration requirements, (e.g., forging a\ndocument) such DPO will be removed from the DPO Registry. The PDPC will then notify the data\nuser of the DPO’s removal and require the data user to dismiss the DPO immediately.\n\nNote:\n Where there are unforeseen circumstances preventing the legal representative from\n complying with the aforementioned obligations related to the DPO replacement (e.g., due to\n the death of the DPO), they must:\n • Promptly notify the PDPC, providing a detailed justification and supporting\n documentation;\n\n• Promptly appoint a new DPO—whether a temporary DPO or a regular-term DPO—\n in accordance with the aforementioned appointment conditions and process; and\n • Where a temporary DPO is appointed, appoint a regular-term DPO and notify the\n PDPC, in accordance with the appointment conditions, within thirty (30) days from\n the awareness of the unforeseen circumstances.\n\nTip: It is more practical to create generic contact details for DPOs (such as a generic email\nlike dpo@company.com) to ensure uninterrupted communication in case of DPO\nreplacement.\n\n@pdpceg info@pdpc.gov. eg"}, {"id": "guide-dpo-competencies-001", "ref": "DPO Competencies Guidelines — Introduction", "text": "Establishing a Professional Hierarchy for Data Protection Officers in Egypt\n\nThis document outlines the structured hierarchy for Data Protection Officers (DPOs) in Egypt, categorized into\nthree distinct levels: Category A, Category B, and Category C. It details the qualifications, experience,\ncertifications, and examination requirements for each category, ensuring a clear progression path and maintaining\nhigh standards in data protection practices. This framework aims to support the development of skilled DPOs and\nenhance data protection compliance across various sectors.\n\nTable of Contents\n\nI. General and Specific Requirements for DPO Categories ................................................................................................................... 4\n\nII. Shared Data Protection Officer (DPO) ............................................................................................................................................... 8\n\nIII. Reassessment and Renewal of DPO Accreditation ............................................................................................................................ 8\n\nIV. Voluntary Category Change During Accreditation Cycle ............................................................................................................... 11\n\nI. General and Specific Requirements for DPO Categories\n\nGeneral Requirements (Applicable to All Categories)\n\ni. Qualifications and Relevant Experience: The applicant must possess appropriate academic qualifications or recognized professional certifications, in\n addition to having practical experience in fields relevant to personal data protection, in accordance with the standards approved by the Board of\n Directors of PDPC.\n ii. Successful Completion of Official Examinations: The applicant must successfully pass the official examinations administered or accredited by PDPC,\n commensurate with the nature and scale of personal data processing activities for which registration is sought.\n iii. Good Standing and Integrity: The applicant must not have been previously convicted of any offence involving moral turpitude or dishonesty.\n\nSpecific Requirements by Category Sector Examples\n\nCategory A – Lead DPO\n More than 2,000,000 records (no maximum limit)\nA candidate must meet the following two criteria: - Telecom companies and mobile network\n operators\n 1. Professional Experience Pathway: - Major private hospitals, healthcare\n o A minimum of 3 to 5 years of proven experience in the field of data networks, and diagnostic centers\n - Technology companies with large user\n protection, privacy management, or a closely related discipline.\n platforms and cloud services\nAND - Ride-hailing and transportation apps (e.g.,\n Careem, Uber)\n 2. Certification Pathway: - Digital wallets, fintech startups, and\n payment processing platforms (non-bank)\n o The applicant shall hold at least two (2) certifications issued by recognised\n - Large e-commerce platforms and\n international organisations in relevant fields, including personal data\n marketplaces (e.g., Jumia)\n protection, information security, or cybersecurity. Recognised organisations\n - Data analytics firms managing big data and\n include, but are not limited to:\n advanced consumer profiling\n - Cloud service providers and data centers\n • International Association of Privacy Professionals (IAPP)\n - Social media platforms, content-sharing, and\n • ISC2\n community apps"}, {"id": "guide-dpo-competencies-002", "ref": "DPO Competencies Guidelines — Introduction", "text": "• PECB - National and multinational retail chain\n • ISO-accredited or equivalently recognized certification bodies stores with CRM and loyalty programs\n - Large insurance companies\n o Where the applicant does not hold such certifications, the applicant must - Large travel and hospitality aggregators\n demonstrate completion of no less than fifty (50) documented training credit (online booking, ticketing)\n hours in areas touching upon, supporting, or intersecting with data - Telecommunications infrastructure\n protection, information security, cybersecurity, risk management, providers and ISPs\n governance, compliance, or related digital, legal, or technical domains, issued - Online education platforms with extensive\n or accredited by recognized professional bodies, academic institutions, or user databases\n accredited training providers. - Large-scale logistics and supply chain\n companies\nIn both cases, the candidate must successfully pass PDPC’s customised Lead DPO exam with - Financial technology platforms offering\na score of more than 80%. credit scoring, loans, or insurance products\n - Healthtech companies managing patient\n records and telemedicine platforms\n - Large hospitality chains and hotel groups\n with extensive guest data\n - Energy sector companies managing\n consumer data\n - Large-scale marketing technology platforms\n and ad tech companies\n - Major entertainment event organizers and\n ticketing platforms\n - Customer service centers (call centers,\n support desks)\n Category B – Advanced DPO\n Up to 2,000,000 records\nA candidate must meet one of the following two criteria: - Large private clinics, diagnostic labs, and\n specialized medical centers\n 1. Professional Experience Pathway: - Private schools and universities\n o A minimum of 2 to 3 years of experience in data protection or a relevant - HR and recruitment firms handling\n field, such as legal compliance, information security, IT governance, or employee records\n internal audit. - Medium-sized e-commerce platforms\n\nOR - Delivery & logistics companies operating at\n city or municipal level\n 2. Certification Pathway: - Property management firms overseeing\n o The applicant shall hold at least one (1) certification issued by a recognised large residential/commercial complexes\n international organisation in a relevant field, including personal data - Medium-scale fintech firms (non-banking\n protection, information security, or cybersecurity. Recognised organisations digital wallets, payment gateways)\n include, but are not limited to: - Private transportation companies (bus\n operators, shuttle services)\n • International Association of Privacy Professionals (IAPP) - Medium to large travel agencies and tourism\n • ISC2 operators\n • PECB - Private universities and language schools\n • ISO-accredited or equivalently recognized certification bodies - Hospitality chains (small hotel groups, guest\n houses)\n - Insurance companies\n o In the absence of such certification, the applicant must demonstrate\n - Data analytics firms handling aggregated\n completion of no less than thirty (30) documented training credit hours in\n personal data\n areas touching upon, supporting, or intersecting with data protection,\n - Private security companies managing access\n information security, cybersecurity, risk management, governance,\n control and surveillance data\n compliance, or related digital, legal, or technical domains, issued or accredited\n - Medium-sized tech startups with user data\n by recognized professional bodies, academic institutions, or accredited\n platforms\n training providers.\n - Fitness chains and sports clubs with member\n health data\nIn both cases, the candidate must pass the PDPC’s customised Advanced DPO exam with a\nscore of more than 70%."}, {"id": "guide-dpo-competencies-003", "ref": "DPO Competencies Guidelines — Introduction", "text": "Category C – Entry-Level DPO\n Up to 100,000 records\nA candidate must meet all of the following criteria: - Retail stores (non-chain)\n o Experience: - Cafés & restaurants\n • Between 0 to 1 year of experience in data protection or a related field. - Real estate agencies\n - Small e-commerce shops\n o Certification: - Salons & spas\n • Not required at this level. - Fitness centers & gyms\n - Photography studios\n o Exam Requirement:\n\n• Must pass the PDPC’s customised Entry-Level DPO exam with a score of - Tutoring centers / training institutes/\n more than 60%. language institutes\n - Event planning companies\n - Home services (cleaning, maintenance)\n - Small travel agencies\n - Local courier and delivery services\n - Local car repair shops and garages\n - Small-scale NGO offices or community\n groups (non-sensitive data)\n - Small manufacturing workshops\n - Local printing and publishing houses\n - Small-scale agricultural businesses and\n cooperatives\n - Local retail pharmacies (that do not\n save/retain sensitive health data)\n - Community sports clubs and associations\n - Small-scale import-export traders\n - Daycare centers and nurseries\n - Event equipment rental services\n - Independent consultancy firms (design, IT,\n marketing) managing customer databases\n - Small retail markets (e.g., textile, hardware)\n\nImportant Note:\nFinal categorisation of DPOs shall be subject to the discretion of PDPC, based on a comprehensive evaluation of the applicant’s qualifications,\nprofessional background, documented training, certifications, and practical experience. For this purpose, the PDPC may conduct a formal\nassessment interview to evaluate the applicant’s technical competence, legal understanding, applied knowledge, and professional judgment\nrelevant to the assigned category.\n\nPDPC reserves the right to assign or reassign applicants to the appropriate category where justified, and to approve justified exceptions to the\nstandard criteria on a case-by-case basis, in line with the overarching objective of ensuring effective and responsible data protection oversight.\n\nII. Shared Data Protection Officer (DPO)\nWithout prejudice to the provisions of the Personal Data Protection Law No. 151 of 2020 and its Executive Regulation, an organisation may appoint\na shared DPO, provided that such arrangement is established through a clear and binding contractual agreement defining the scope of services,\nresponsibilities, and accountability of the DPO. In all cases, the shared DPO shall perform their duties with full independence, shall not receive\ninstructions regarding the exercise of their statutory functions, and shall report directly to the highest administrative or executive level within\neach concerned organisation. The appointment of a shared DPO shall be subject to the prior review and acceptance of PDPC, which retains the\nright to assess the adequacy of the arrangement and to reject or require modification thereof where necessary to ensure effective and independent\ndata protection oversight."}, {"id": "guide-dpo-competencies-004", "ref": "DPO Competencies Guidelines — Introduction", "text": "III. Reassessment and Renewal of DPO Accreditation\nTo ensure sustained alignment with national data protection objectives, the PDPC adopts a strategic reassessment framework applicable to all\nregistered DPOs. This framework reinforces accountability, promotes continuous professional development, and enables PDPC to proactively\nrespond to emerging risks and evolving sectoral demands.\n\nA. Purpose of Reassessment\n\nThe periodic reassessment process is designed to:\n\n• Ensure that accredited DPOs continue to demonstrate competence, integrity, and readiness in managing data protection obligations.\n\n• Adapt to technological developments, sectoral changes, and updates in regulatory and legislative frameworks.\n\n• Promote a culture of continuous learning and professional excellence in the field of data protection.\n\n• Strengthen the alignment between DPO capabilities and the scale, complexity, and sensitivity of data processing operations.\n\nB. Reassessment Cycle\n\nAll accredited DPOs shall undergo a comprehensive reassessment every three (3) years from the date of initial accreditation or last renewal. PDPC\nmay also initiate reassessment at any time based on sectoral developments, individual performance concerns, or organisational changes.\n\nC. Components of Reassessment\n\n1. Capability Review\n\n• Evaluation of the DPO’s continued effectiveness in fulfilling regulatory and organisational responsibilities.\n• Alignment of the DPO’s role and scope with the category assigned (A, B, or C).\n\n2. Professional Development and Learning\n\n• The reassessment process prioritizes demonstrable professional experience in data protection roles during the accreditation period.\n• Where relevant experience is insufficient, interrupted, or not clearly verifiable, the DPO must demonstrate active engagement in\n professional development, including:\n - Participation in PDPC-accredited or recognized training programs\n - Continuing education relevant to data protection law, or data governance\n - Familiarity with emerging regulatory and technological issues, such as\n ü AI and automated decision-making\n ü Cross-border data transfers\n ü Data breach response and incident management\n ü Privacy-by-design and accountability models\n\n3. Regulatory Engagement and Conduct\n\n• PDPC shall conduct an internal review of the DPO’s file maintained by PDPC, which includes records of the DPO’s regulatory performance\n throughout the accreditation period.\n\n• This assessment shall cover:\n – The DPO’s compliance history and adherence to data protection obligations.\n – Responsiveness and cooperation with PDPC communications, requests, or supervisory inquiries.\n – The DPO’s level of proactive engagement with regulatory updates, guidance documents, and capacity-building initiatives issued by\n PDPC.\n – Any complaints, breach notifications, or formal enforcement actions that have involved or implicated the DPO."}, {"id": "guide-dpo-competencies-005", "ref": "DPO Competencies Guidelines — Introduction", "text": "4. Sectoral Relevance and Role Evolution\n\n• Review of changes in the DPO’s industry context, organisation size, and nature of data handled.\n\n• Revalidation of the category assignment to ensure strategic fit with the entity’s data risk profile.\n\n5. Ethical and Legal Standing\n\n• Confirmation that the DPO remains in good standing, with no disqualifying legal, ethical, or disciplinary findings.\n\nD. Reassessment Outcomes\n\nBased on the reassessment, PDPC may take one or more of the following actions:\n\n• Renew accreditation for a further three-year term.\n\n• Recommend upskilling or targeted training where gaps are identified.\n\n• Adjust the DPO’s category assignment based on updated privacy management responsibilities or risk exposure.\n\n• Revoke or suspend accreditation in cases of significant non-compliance or loss of eligibility.\n\nImportant Note: The final decision regarding category placement, reassignment, or exceptions shall remain at the sole discretion of PDPC, based\non a holistic review of the DPO’s profile and the broader regulatory priorities and shall be issued within a period not exceeding fifteen (15)\nworking days from the date of receipt of the complete reassessment submission.\n\nIV. Voluntary Category Change During Accreditation Cycle\n\nA DPO may submit a request to upgrade or change their assigned category at any time during the three-year accreditation period. Such requests\nshall be reviewed by PDPC based on the following principles:\n\n1. Eligibility for Re-Categorisation\n\n• A DPO may be considered for re-categorisation during the active accreditation cycle upon submission of a formal request and subject to\n the approval of PDPC. To be eligible, the DPO must demonstrate clear and verifiable evidence of alignment with the criteria of the target\n category, as set forth in the official accreditation framework, including:\n\nü Demonstrated expansion in the scale, complexity, or sensitivity of personal data processing activities under the DPO’s\n responsibility;\n ü Acquisition of relevant professional certifications, academic qualifications, or completion of recognized specialized training;\n ü Documented practical experience in data protection that meets or exceeds the threshold defined for the target category;\n ü Maintenance of a compliance record free of major violations, with a proven track record of professional integrity and effective\n regulatory engagement."}, {"id": "guide-dpo-competencies-006", "ref": "DPO Competencies Guidelines — Introduction", "text": "2. Documentation and Supporting Evidence\n\n• The DPO must submit a formal request for re-categorisation, accompanied by comprehensive documentation that clearly substantiates\n their eligibility for the higher category. The submission must include, at a minimum:\n\nü An updated professional dossier detailing current responsibilities, role evolution, and scope of data processing activities;\n\nü Verified copies of any new academic qualifications, professional certifications, or training programs completed since initial\n accreditation (if requested by PDPC);\n\nü Official evidence from the employing entity confirming the volume, nature, and sensitivity of personal data currently handled by the\n DPO;\n\nü Any additional supporting material that may assist PDPC in conducting a holistic evaluation of the DPO’s qualifications and readiness\n for category advancement.\n\nPDPC retains full discretion to assess the sufficiency of the submitted evidence and may request additional information as part of the\n evaluation process.\n\n3. Assessment Process\n\n• Upon receipt of a re-categorisation request, PDPC shall initiate a comprehensive review to evaluate the applicant’s suitability for the\n proposed category. This process includes, but is not limited to, the following steps:\n\nü Verification of Submitted Documentation: PDPC will rigorously examine all supporting materials submitted to substantiate\n eligibility, ensuring their authenticity, relevance, and completeness.\n\nü Competency Evaluation: The applicant may be required to undergo additional assessments, including PDPC’s customised\n examination relevant to the requested category, to validate their knowledge and capabilities.\n\nü Review of Regulatory Compliance: PDPC will assess the DPO’s historical compliance record, including responsiveness to regulatory\n inquiries, involvement in any breaches or complaints, and overall adherence to data protection standards.\n\nü Final Determination: Based on the outcomes of the above steps, PDPC will render a decision regarding the re-categorisation\n request. The decision will be communicated in writing to the applicant, with the effective date of any category change clearly\n specified.\n\n4. Decision and Notification\n\n• The final decision will rest with PDPC based on merit and documented qualifications, and shall be issued within a period not exceeding\n fifteen (15) working days from the date of receipt of the complete submission.\n\n• If approved, the new category assignment will take effect immediately, with the three-year cycle resetting from the date of\n reclassification."}, {"id": "guide-dpo-competencies-007", "ref": "DPO Competencies Guidelines — Introduction", "text": "Important Note: PDPC reserves the right to deny re-categorisation requests if the DPO fails to meet the full requirements, or if there are pending\ncompliance concerns."}, {"id": "guide-privacy-principles-001", "ref": "Data Protection Principles Guidelines — DATA PROTECTION", "text": "DATA PROTECTION\n PRINCIPLES\n GUIDELINES\n\nVersion 1.1. - 26 January 2026\n\nIntroduction ......................................................................................................................................... 2\n\n1. Lawfulness....................................................................................................................................... 3\n\n2. Fairness ........................................................................................................................................... 3\n\n3. Transparency .................................................................................................................................. 4\n\n4. Purpose Limitation ......................................................................................................................... 5\n\n5. Data Minimisation .......................................................................................................................... 6\n\n6. Data Accuracy................................................................................................................................. 6\n\n7. Storage Limitation .......................................................................................................................... 7\n\n8. Data Security................................................................................................................................... 8\n\n9. Accountability ................................................................................................................................. 8\n\nIntroduction\n\nThe Personal Data Protection Law (PDPL) sets out fundamental principles governing the\nprocessing of personal data. Adhering to these principles is essential for compliance with data\nprotection obligations, safeguarding the rights and freedoms of data subjects, and mitigating\nlegal, financial, and reputational risks. These principles are:\n 1. Lawfulness;\n 2. Fairness;\n 3. Transparency;\n 4. Purpose limitation;\n 5. Data minimisation;\n 6. Data accuracy;\n 7. Storage limitation;\n 8. Data security; and\n 9. Accountability.\n\n1. Lawfulness\n\nTo lawfully process personal data, data users must rely on at least one of the following lawful\nbases enumerated under Article 6 of the PDPL:\n 1. The data subject’s consent;\n 2. Fulfilment of a legal obligation;\n 3. Fulfilment of a contractual obligation;\n 4. Legitimate interest;\n 5. Claim or defence of a legal right; or\n 6. Execution of court judgments or orders issued by competent investigative authorities.\n\nThe lawful basis must be identified before initiating the processing activity, properly\ndocumented, and, where applicable, communicated to the data subject.\n\nFor more information on each of the lawful bases of processing, please refer to the Lawful\nBases Guideline.\n\n2. Fairness\n\nPersonal data shall be processed in a manner that aligns with data subjects’ reasonable\nexpectations and ensures that data subjects do not suffer any unjustifiable harm.\n\nTherefore, before initiating a processing activity, and throughout the entire lifecycle of personal\ndata, data users must assess whether the processing is fair, proportionate, and respectful of the\ndata subjects’ rights and freedoms.\n\nThe following factors may be considered when assessing the fairness of a processing activity:\n\n● The transparency of the information provided to the data subject: whether the data\n subject is effectively provided with sufficient information in a clear and plain language\n (e.g., using vague or generic statements such as “we may use your data for various\n purposes” without identifying the actual purposes or categories of processing is not\n considered as transparent information).\n For more information on transparency, please refer to section 3.\n For more information on privacy notices, please refer to the Privacy Notice Guideline.\n ● The reasonable expectations of data subjects: whether the data subject could\n reasonably anticipate the processing activities (e.g., a data subject would not reasonably\n expect the presence of CCTV inside fitting rooms).\n ● The risks to data subjects’ rights and freedoms: whether the processing may\n result in harm to the data subject, such as discrimination, bias, or any other significant"}, {"id": "guide-privacy-principles-002", "ref": "Data Protection Principles Guidelines — DATA PROTECTION", "text": "impacts (e.g., an online retailer charging different prices to users for the same product\n based on inferred personal data).\n ● The collection source of personal data: whether the data was collected directly from\n the data subject or obtained indirectly via a third party (e.g., a data subject would not\n reasonably expect to receive marketing communications from a controller with whom\n they have had no prior interaction or relationship).\n ● The vulnerability of the data subject: whether the processing involves individuals\n who may have a reduced ability to understand the processing or
