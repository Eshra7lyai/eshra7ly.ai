ew or amended national laws or regulations. Such amendment ensures the\nalignment of personal data processing activities with the applicable legal and regulatory\nframework. This includes updating any technical, regulatory, or security requirements imposed by\nsuch frameworks in a manner that enhances the level of personal data protection and keeps pace\nwith legislative developments."}, {"id": "guide-licenses-006", "ref": "Licenses and Permits Guidelines — LICENSES AND", "text": "5.2. At the Request of the Licensee or Permit Holder\nThe licensee or permit holder may submit a request to amend their license or permit, if changes\noccur to the nature of their activities, the scope of processing, the volume of data records, or any\nother element of the processing operations that, under the PDPL and its regulations, requires\namendment. In such case, the PDPC shall review the request and issue a decision of approval or\nrejection.\n\n5.3. In the Case of Mergers Where the Data User Merges With Another\n Entity, Whether Within or Outside Egypt\nIf any merger results in a change to the controlling or processing entity, the license or permit shall\nbe amended to reflect the new entity, whether the merger occurs within or outside the Arab\n\nRepublic of Egypt. Without prejudice to the foregoing, any merger must be carried out in full\ncompliance with all applicable Egyptian or foreign laws and regulations governing companies,\ninvestment, competition, and foreign ownership, as well as any required regulatory approvals. An\namendment to the license or permit shall not be recognised, deemed effective, or produce any legal\neffect unless the underlying corporate transaction constituting the merger has been lawfully\ncompleted and all applicable legal and regulatory procedures and approvals have been duly\nfulfilled.\n\n5.4. Whenever the Amendment is Deemed Essential by the PDPC to Fulfil\n the Objectives of the PDPL and Safeguard the Rights of Data Subjects\n\nThe PDPC shall have the right to introduce amendments to the license or permit where it determines\nthat such amendments are necessary to enhance the protection of personal data, to prevent existing\nor potential risks to the rights and freedoms of the data subjects, or to achieve the public objectives\nset forth in the PDPL. This includes cases requiring the upgrading of controls, modification of\nprocedures, or enhancement of security measures to ensure a higher level of compliance and\nprotection.\n\n6. Penalties for Violating the Provisions of the Data Protection Regulations\n\nUnder the PDPL and the ER, the PDPC performs regulatory monitoring to ensure compliance with\ndata protection requirements, without prejudice to civil or criminal liability. The PDPC may issue\nwarnings to non-compliant data users and instruct them to cease the violation and remedy the\ncauses and consequences of such violation within a specified period."}, {"id": "guide-licenses-007", "ref": "Licenses and Permits Guidelines — LICENSES AND", "text": "Where the violation is not rectified, the PDPC may impose disciplinary measures, including the\npartial or complete suspension of the license or permit for a specified period. In addition, the PDPC\nhas the authority to revoke a license or permit in any of the following cases:\n ● Failure to meet the licensing or permit requirements;\n ● Failure to pay renewal fees;\n ● Repeated violations of the PDPC’s decisions;\n ● Transferring the license or permit to a third party without the PDPC’s authorisation; or\n ● A court judgment declaring the data user’s bankruptcy.\n\nThe PDPC may also publish proven violations through the media at the expense of the violator, or\nplace the data user under technical supervision to ensure the protection of personal data, with the\nviolator bearing all related costs. These measures shall be applied proportionately to the severity\nof the violation and shall aim at safeguarding the integrity of the data protection framework in the\nArab Republic of Egypt.\n\n7. Transitional Provisions: The One-Year Compliance Grace Period\n\nAll data users, whether natural or juridical persons, must apply for the necessary licenses or permits\nwithin the one-year grace period, as stipulated by the PDPL. If entities fail to obtain the required\nlicenses or permits within this period, any processing of personal data thereafter shall constitute a\nviolation of the provisions of the PDPL and the ER. Accordingly, the PDPC may apply the\npenalties and disciplinary measures prescribed under the PDPL and the ER in such cases.\n\n@pdpceg info@pdpc.gov. eg"}, {"id": "guide-breach-pdpc-001", "ref": "Data Breach Notification to the PDPC Guidelines — Introduction", "text": "Table of Contents\n 1. Identification of the Notifying Party and Contact Details ........................................................... 2\n a) Notification Prepared and Submitted By ................................................................................ 2\n b) Data Protection Officer Contact Details .................................................................................. 2\n 2. Particulars of the Personal Data Breach...................................................................................... 3\n a. Notification Status ................................................................................................................... 3\n b. Key Dates and Timeline ........................................................................................................... 3\n c. Detection by a third party (if applicable) ................................................................................ 4\n d. Information about the source of the data breach .................................................................. 4\n e. Security criteria affected from the data breach ...................................................................... 5\n f. Method of Detection ............................................................................................................... 5\n g. Categories of personal data affected by the data breach ....................................................... 5\n h. Number of data subjects and records affected by the data breach ....................................... 6\n i. Data subject groups affected by the data breach and the effects on them ........................... 6\n 3. Particulars of the Personal Data Breach...................................................................................... 7\n a. Timeliness of Notification........................................................................................................ 7\n b. Communication with Data Subjects ........................................................................................ 7\n c. Date of Communication to Data Subjects ............................................................................... 7\n d. Method of Communication ..................................................................................................... 7\n e. Channels for Data Subject Inquiries ........................................................................................ 8\n f. Notification of Other Domestic Authorities or Institutions..................................................... 8\n g. Notification of Foreign Authorities or Institutions (if applicable) ........................................... 8\n 4. Potential Consequences of the Data Breach ............................................................................... 8\n a. Potential Impact on Data Subjects .......................................................................................... 8\n b. Potential Impact on the Organization ..................................................................................... 9\n 5. Measures Taken and Planned ................................................................................................... 11\n 6. National Security Considerations .............................................................................................. 12\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 1\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\n1. Identification of the Notifying Party and Contact Details\n\nName of Entity /\n Individual [Company / Organization / Individual Name]\n\nSector ☐ Public Sector ☐ Private Sector\n ☐ Non-Profit Organization (NPO)\n\nOfficial\n Correspondence [Official Email Address]\n Email Address\n\na) Notification Prepared and Submitted By\n (Select and complete as applicable)\n ☐ Controller/ Processor\n ☐ Processor\n ➢ Notification Submission Contact Details\n\n• Name: [Name and Surname]\n • Position / Title:\n ☐ Data Protection Officer (DPO)\n ☐ Other Position/Title (please specify): _______________________\n • Email Address: [Email]\n • Phone Number: [Phone]"}, {"id": "guide-breach-pdpc-002", "ref": "Data Breach Notification to the PDPC Guidelines — Introduction", "text": "b) Data Protection Officer Contact Details\n (To be completed only where the Data Protection Officer is not the contact person identified\n above)\n • Name: [Name and Surname]\n\n• Email Address: [Email]\n\n• Phone Number: [Phone]\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 2\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\n2. Particulars of the Personal Data Breach\n\na. Notification Status\n • Notification Type:\n ☐ Initial Notification ☐ Follow-Up / Updated Notification\n • Reference Number (if applicable): _______________________\n\nb. Key Dates and Timeline\n • Date and Time of Occurrence of the Breach (if known):\n DD / MM / YYYY – HH:MM\n (If the exact time is unknown, provide the estimated period.)\n\n• Date and Time the Breach Was Detected:\n DD / MM / YYYY – HH:MM\n • Date and Time the Controller-Processor/ Processor/ Data Protection\n Officer Became Aware of the Breach:\n DD / MM / YYYY – HH:MM\n\nNote:\n\nFor the purposes of breach notification, the following distinctions apply:\n\n➢ Occurrence: refers to the incident itself, including what happened and the date and\n time at which it occurred, where known.\n\n➢ Detection (factual/technical event): refers to the point at which the incident was\n first identified, flagged, or suspected through technical controls, staff reports, or\n third-party notifications/ It can be preliminary, partial, or unconfirmed.\n\n➢ Awareness (legal threshold): refers to the point at which the controller or\n processor has sufficient information to reasonably determine that a personal data\n breach has occurred. The statutory notification period of seventy-two (72) hours\n commences from this point, in accordance with the PDPL and its Executive\n Regulation.\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 3\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\nc. Detection by a third party (if applicable)\n\n• Was the breach detected by a third party? ☐ Yes ☐ No"}, {"id": "guide-breach-pdpc-003", "ref": "Data Breach Notification to the PDPC Guidelines — Introduction", "text": "If yes, kindly provide the following details and attach supporting documentation\n (e.g. notification email, report):\n\n• Name of the Third Party:\n\n• Email of the Third Party:\n\n• Date and Time the Third Party Detected the Breach: DD / MM / YYYY –\n HH:MM\n\n• Date and Time the Third Party Notified the Controller: DD / MM / YYYY\n – HH:MM\n\nd. Information about the source of the data breach\n\n(Tick as many boxes as maybe applicable)\n Physical / Organizational Causes Cyber / Technical Causes\n\n☐ Loss or theft of documents or devices ☐ Cyber Attack\n ☐ Insecure storage or improper disposal ☐ Malware\n ☐ Accident or human error ☐ Social engineering\n ☐ Negligence ☐ Denial of Service (DoS-DDoS)\n ☐ Sabotage ☐ Ransomware\n ☐ Other (specify): ☐ Brute-Force Attack\n _______________________\n ☐ Other (specify):\n _______________________\n\nElaborate your answer:\n\n(Example for guidance purposes only)\n\nThe breach resulted from a phishing attack in which an employee received a fraudulent\n email impersonating a trusted service provider. The employee inadvertently disclosed login\n credentials, which were subsequently used by an unauthorized third party to access an\n internal system. The access was limited to a specific user account and did not involve\n system-wide compromise. The breach was detected through abnormal login activity\n identified by security monitoring tools, after which access was immediately restricted and\n credentials were reset.\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 4\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\ne. Security criteria affected from the data breach\n (Tick as many boxes as maybe applicable)\n\n☐ Data confidentiality ☐ Data integrity ☐Data availability /\n accessibility\n Elaborate your answer:\n\nf. Method of Detection\n\nDescribe how the breach was detected, including monitoring systems, internal controls, or\n third-party notifications: _______________________\n\n(Supporting documents may be annexed)\n\ng. Categories of personal data affected by the data breach\n (Tick as many boxes as maybe applicable)\n\nPersonal Data Sensitive Personal Data\n\n☐ Contact Data ☐ Health data\n\n☐ Location Data ☐ Biometric Data"}, {"id": "guide-breach-pdpc-004", "ref": "Data Breach Notification to the PDPC Guidelines — Introduction", "text": "☐ Customer Transaction ☐ Children's Data\n\n☐ Professional or employment data ☐ Financial Data\n\n☐ Other (specify): ☐ Other (specify):\n _______________________ _______________________\n\nElaborate your answer:\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 5\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\nh. Number of data subjects and records affected by the data breach\n Number of Data Subjects/ Personal Data Records Affected: __________\n\n(If the numbers provided are estimates, please indicate this and briefly explain why exact\n figures are not available at the time of notification.)\n\nElaborate your answer:\n\ni. Data subject groups affected by the data breach and the effects on\n them\n\n(Tick as many boxes as may be applicable)\n\nAffected Data Subject Groups Potential Impact on Data Subjects\n\n☐ Staff ☐ Loss of control over personal data\n\n☐ Users ☐ Identity misuse or fraud\n\n☐ Subscribers / Members ☐ Discrimination\n\n☐ Students ☐ Restriction of rights\n\n☐ Customers and potential clients ☐ Fraud\n\n☐ Patients ☐ Financial loss\n\n☐ Children ☐ Reputational harm\n\n☐ Vulnerable individuals ☐ Compromise of personal data security / not\n clear for me – because security is already\n ☐ Not yet determined compromised\n\n☐ Other (Specify): ☐ Other (Specify):\n _______________________ _______________________\n\nElaborate your answer:\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 6\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\n3. Particulars of the Personal Data Breach\n\na. Timeliness of Notification\n If more than seventy-two (72) hours have elapsed between the date and time of awareness of\n the breach and the submission of this notification, please provide a detailed explanation for the\n delay.\n\n(Applicable to initial notifications only.)\n\nExplanation:\n\nb. Communication with Data Subjects\n\nIn accordance with the PDPL & its Executive Regulation, data subjects shall be notified within\n three (3) working days from the date of notifying the PDPC of the breach or violation, and of\n the security measures taken, using the communication method agreed upon at the time of data\n collection."}, {"id": "guide-breach-pdpc-005", "ref": "Data Breach Notification to the PDPC Guidelines — Introduction", "text": "Has the personal data breach been communicated to the affected data subjects?\n\n☐ Yes, notification has been completed.\n\n☐ Notification is currently in progress.\n\n☐ No, notification has not yet been made.\n If not completed, please explain the reason and the expected timeframe for\n communication: _______________________\n\nc. Date of Communication to Data Subjects\n\nDate of communication made or scheduled:"}, {"id": "guide-breach-pdpc-006", "ref": "Data Breach Notification to the PDPC Guidelines — DD / MM / YYYY", "text": "DD / MM / YYYY\n\nd. Method of Communication\n Provide details of the communication method(s) used or planned to notify data subjects\n (e.g. SMS, email, telephone call, secure electronic link), in accordance with the method\n designated for data processing purposes.\n\n(Where applicable, attach a sample copy of the communication.)\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 7\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\ne. Channels for Data Subject Inquiries\n Indicate the communication channels made available to enable data subjects to obtain further\n information about the breach (e.g. dedicated webpage, hotline, email address, call center).\n\nExplanation:\n\nf. Notification of Other Domestic Authorities or Institutions\n Have any domestic authorities or institutions been informed of the breach, or is there an\n intention to inform them?\n\n(e.g. supervisory or inspection bodies)\n\n☐ Yes ☐ No\n\nIf yes, please specify the authority or institution, the reason for notification, and the date of\n communication.\n (Attach supporting documents, where applicable)\n\ng. Notification of Foreign Authorities or Institutions (if applicable)\n Have any foreign data protection authorities or relevant institutions been informed of the\n breach, or is there an intention to inform them?\n\n☐ Yes ☐ No\n\nIf yes, please provide details of the authority or institution, the legal basis for notification, and\n the date of communication.\n\n(Attach supporting documents, where applicable.)\n\n4. Potential Consequences of the Data Breach\n\na. Potential Impact on Data Subjects\n This section assesses the likelihood and severity of adverse effects on data subjects\n resulting from the personal data breach.\n\nIn determining the level of potential impact, the following factors should be taken into\n account, as applicable:\n\n• The nature and type of the breach;\n • The cause and circumstances of the breach;\n • The categories and sensitivity of the personal data affected;\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 8\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025."}, {"id": "guide-breach-pdpc-007", "ref": "Data Breach Notification to the PDPC Guidelines — DD / MM / YYYY", "text": "• The categories of data subjects concerned; and\n • The mitigation measures implemented or planned to reduce adverse effects.\n\nPlease indicate the overall severity of the potential impact on data subjects:\n\nSeverity Level Description\n\n☐ Very High Data subjects may suffer severe and irreversible consequences\n or impacts that cannot reasonably be mitigated (e.g. inability\n to work, long-term psychological or physical harm).\n\n☐ High Data subjects may face serious consequences that require\n significant effort to overcome (e.g. financial loss,\n employment impact, legal proceedings, deterioration of\n health).\n\n☐ Medium Data subjects may experience negative effects that can be\n mitigated with reasonable effort or cost (e.g. stress, additional\n expenses, inconvenience, minor physical effects).\n\n☐ Low Data subjects may experience limited or minor adverse effects\n that are easily manageable (e.g. temporary distress or\n inconvenience).\n\n☐ Not yet known The potential impact cannot yet be determined at the time of\n notification.\n\nb. Potential Impact on the Organization\n Please assess the impact of the breach on the organization’s operations, services,\n and ability to function:\n\nSeverity Level Description\n\n☐ Very High Complete inability to provide services or perform core\n operational functions.\n\n☐ High Inability to provide critical or essential services.\n\n☐ Medium Reduced efficiency, operational disruption, or loss of control\n in certain activities or services.\n\n☐ Low No material impact on service delivery or operational control.\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 9\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\n☐ Not yet known The impact cannot yet be fully assessed.\n\n5. Measures Taken and Planned\n a) Preventive Measures in Place Prior to the Breach\n\nPlease indicate the technical and organizational measures that were implemented\n before the occurrence of the breach to prevent or reduce the likelihood of such\n incidents.\n\nTechnical Measures Organizational Measures\n\n•… •…\n\n•… •…\n\n•… •…\n\nExplanation: Explanation:\n\n(Supporting documents may be annexed, where applicable)\n\nb) Remedial and Corrective Measures Taken or Planned After the\n Breach\n Please describe the technical and organizational measures taken or planned in\n response to the breach, including measures aimed at:"}, {"id": "guide-breach-pdpc-008", "ref": "Data Breach Notification to the PDPC Guidelines — DD / MM / YYYY", "text": "• Containing the incident;\n • Eliminating or mitigating adverse effects; and\n • Preventing recurrence.\n\nWhere applicable, indicate the expected completion timeline.\n\nTechnical Measures Organizational Measures\n\n•… •…\n\n•… •…\n\n•… •…\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 10\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\nExplanation: Explanation:\n\n(Supporting documents may be annexed, where applicable)\n\n6. National Security Considerations\n Is the personal data breach or violation associated, whether directly or indirectly, with national\n security considerations or with entities entrusted with national security responsibilities?\n\n☐ Yes ☐ No\n\nIf yes, please provide the following information:\n\nI. Describe the connection between the breach or violation and national security\n considerations _______________________\n II. Specify the volume of personal data affected and provide an assessment of the resulting\n or potential damage _______________________\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 11\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 11\n Compliance shall be determined exclusively based on the information required under Personal Data\n Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025."}, {"id": "guide-breach-subject-001", "ref": "Data Breach Notification to the Data Subject Guidelines — Introduction", "text": "This document provides the following two templates regarding the notification of personal data\n breaches to data subjects. These two templates are based on the provisions of the Personal Data\n Protection Law No. 151 of 2020 (“PDPL”) and its Executive Regulation No. 816 of 2025 and are\n provided for guidance. Both templates must be provided in Arabic; data users can provide them\n in additional languages depending on their business needs. The templates are:\n\n1) Initial communication to data subjects informing them of the occurrence of a data breach.\n Notification to the data subject shall be made using the communication method designated\n at the time of personal data collection, including SMS, email, or telephone call, as the case\n may be.\n 2) Detailed breach notification that will be provided in the form of a link in the initial\n communication to data subjects, which provides further information on the nature and\n impact of the personal data breach with regular updates on how it was maintained and\n mitigated.\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 1\n Compliance shall be determined exclusively based on the information required under Personal\n Data Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\nTable of Contents\n Template (1): Initial communication to data subjects informing them of the occurrence of a\n personal data breach..................................................................................................................... 4\n Template (2): Detailed Breach Notification ................................................................................ 5\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 2\n Compliance shall be determined exclusively based on the information required under Personal\n Data Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\nTemplate (1): Initial communication to data subjects informing them of the\n occurrence of a personal data breach\n We are writing to notify you that [name of the organisation] became aware of a personal data\n breach on [date and time]. This breach consists of the following: [concise and accurate\n description of the breach, e.g. unauthorized access, unlawful disclosure, loss, or destruction\n of personal data].\n\nWe took appropriate measures to address the matter and implemented appropriate technical and\n organisational security measures to contain the breach and mitigate its impact, including [brief\n description of the security measures taken]."}, {"id": "guide-breach-subject-002", "ref": "Data Breach Notification to the Data Subject Guidelines — Introduction", "text": "[Include any urgent measures that must be implemented by the data subject, such as changing\n passwords.\n\nFor further details regarding the breach, including your rights under the Personal Data Protection\n Law no 151 of 2020 & its Executive Regulation, kindly refer to the detailed notification available\n at [link to detailed notification].\n\nShould you require any clarification, kindly contact [official contact/hotline].\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 3\n Compliance shall be determined exclusively based on the information required under Personal\n Data Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\nTemplate (2): Detailed Breach Notification\n This notice provides information regarding a personal data breach that has occurred on [date and\n time]. It sets out the circumstances of the breach, the categories of personal data concerned, and\n the measures taken in response. This notice will be updated regularly. [please insert dates of\n updates]\n\n1. Description of the Incident\n On [date and time the controller/processor or processor], we became aware of a personal data\n breach involving [brief description of the nature of the breach, e.g. unauthorised\n access/disclosure/loss/alteration].\n\nUpon identification of the incident, we initiated an internal investigation to determine the nature,\n scope, and impact of the incident. The investigation concluded that the incident constitutes a\n personal data breach, as it resulted in the [e.g. unauthorised access to / disclosure of / loss of /\n alteration of] personal data.\n\nThe breach occurred on [specific date and time] or during the period [date–date] and involved\n [brief explanation of how the breach occurred], including [whether a third party was involved\n and the nature of that involvement, where applicable].\n\nThis information is provided to ensure transparency regarding the circumstances of the breach and\n to present the relevant facts in a clear and non-technical manner.\n\n2. Categories and Scope of Personal Data Affected\n Based on the investigation conducted to date, the personal data affected may include, without\n limitation, the following categories:\n\n• [e.g., Full name]\n • [e.g., Contact details (email address, phone number)]\n\n• [e.g., Residential address]\n\n• [e.g., Account or customer reference information]"}, {"id": "guide-breach-subject-003", "ref": "Data Breach Notification to the Data Subject Guidelines — Introduction", "text": "• [e.g., Financial or payment-related data, if applicable]\n • [e.g., Other relevant data categories]\n\nIf the data involved is extensive or complex, an appendix or extract of the affected personal data\n may be provided separately, where appropriate.\n This information is provided to enable you understand the nature of the breach, assess any potential\n implications, and take precautionary measures you consider appropriate.\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 4\n Compliance shall be determined exclusively based on the information required under Personal\n Data Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\n3. Potential Consequences of the Breach\n This section should describe the potential consequences and expected scope of impact resulting\n from the breach or violation, taking into account the nature, sensitivity, and volume of the personal\n data affected.\n\n4. Measures Taken by [Organisation Name]\n Upon identification of the breach, we implemented prompt and proportionate measures aimed at\n containing the breach and limiting any potential adverse impact, including:\n e.g.:\n\n• Securing and isolating the affected systems or databases to prevent further unauthorised\n access;\n • Conducting a detailed technical, operational, and forensic investigation to determine the\n root cause, scope, and impact of the breach;\n • Resetting credentials, disabling compromised accounts, or revoking access rights, where\n applicable;\n • Implementing additional technical and organisational security controls, such as\n enhanced monitoring, logging, or access restrictions;\n • Engaging external cybersecurity, digital forensics, or data protection specialists to\n support the investigation and remediation process; and\n • Notifying relevant regulatory or supervisory authorities, where required under\n applicable data protection laws.\n\nIn addition, we are reviewing and strengthening our internal policies, procedures, and safeguards\n to reduce the likelihood of similar breaches occurring in the future. [These measures may include\n system upgrades, process improvements, enhanced staff awareness and training, and ongoing\n security assessments.]\n\n5. Information for the Affected Data Subject\n This section should explain, clearly and neutrally, the potential implications of the breach for the\n affected data subject, taking into account the nature of the personal data involved.\n The wording should avoid speculation, alarmist language, or legal conclusions, and should be\n proportionate to the level of risk identified."}, {"id": "guide-breach-subject-004", "ref": "Data Breach Notification to the Data Subject Guidelines — Introduction", "text": "Where relevant, this section may include illustrative guidance, such as:\n\nIf the breach involves data that could be misused for identity-related purposes\n\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 5\n Compliance shall be determined exclusively based on the information required under Personal\n Data Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025.\n\n• A general reminder to remain cautious with unsolicited communications requesting\n personal information;\n • An indication that affected individuals may choose to update relevant account\n credentials.\n If the breach involves financial or payment-related information\n • A reference to monitoring financial account activity;\n • An indication that affected individuals may contact their financial service provider if\n irregular activity is identified.\n\nIf the breach involves contact information\n • A reference to potential phishing or scam communications;\n • An indication that affected individuals may wish to exercise caution with unexpected\n messages.\n Any suggested actions should be presented as general, non-exhaustive examples, allowing affected\n individuals to make their own assessment based on their circumstances.\n\n6. Rights of the Data Subject\n In accordance with Personal Data Protection Law No. 151 of 2020 and its Executive Regulation,\n you have rights in relation to your personal data, including the right to be informed of its\n processing, to access it, and to request its correction or deletion, in accordance with the conditions\n set out in the Law.\n\nFurther information on these rights is available in our Privacy Notice at: [Insert link to Privacy\n Notice]\n\n7. Contact Information (DPO contact details)\n For any inquiries or requests for further information in relation to this breach, you may contact:\n [Name / Department] [Email Address] [Phone Number]\n The designated contact point will handle requests and provide clarification, as appropriate.\n\n8. Complaints\n If you have any concerns regarding the handling of this breach, you may submit a complaint by\n contacting us at [Data Protection Officer Email Address]. Kindly include a brief description of\n your concern and the outcome you are seeking.\n\nIn the event that further concerns remain, a complaint may be submitted to the Personal Data\n Protection Center, in accordance with Personal Data Protection Law No. 151 of 2020 and its\n Executive Regulation No. 816 of 2025. Further information on the complaint submission process\n is available at pdpc.gov.eg.\nDisclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 6\n Compliance shall be determined exclusively based on the information required under Personal\n Data Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025."}, {"id": "guide-breach-subject-005", "ref": "Data Breach Notification to the Data Subject Guidelines — Introduction", "text": "Disclaimer: This document is issued for illustrative purposes only and has no binding or prescriptive effect. 6\n Compliance shall be determined exclusively based on the information required under Personal\n Data Protection Law No. 151 of 2020 and its Executive Regulation No. 816 of 2025."}, {"id": "guide-compliance-plan-001", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "Data Protection Compliance Plan Checklist\n Personal Data Protection Law (“PDPL”) No 151 of 2020\n\nTable of Contents\nI. PDPL Material & Territorial Scope ....................................................................................................... 2\nII. Data Protection Principles and Legal Basis Alignment under Art. 3 and Art. 6 of the PDPL ............. 2\n 1. Lawfulness of Processing .................................................................................................................. 2\n 2. Fairness ............................................................................................................................................. 5\n 3. Transparency ..................................................................................................................................... 5\n 4. Purpose Limitation ............................................................................................................................ 6\n 5. Data Minimization ............................................................................................................................. 6\n 6. Storage Limitation ............................................................................................................................. 6\n 7. Data Accuracy ................................................................................................................................... 7\n 8. Data Security ..................................................................................................................................... 7\n 9. Accountability ................................................................................................................................... 9\n a. Record of Processing Activities (“ROPA”) ..................................................................................... 9\nIII. Responding to Data Subject Requests ........................................................................................... 12\nIV. Data Protection Officer .................................................................................................................. 12\nV. Licenses and Permits Readiness ........................................................................................................ 15\nVI. Cross-Border Data Transfer – Readiness Compliance Assessment .............................................. 16\nVII. Electronic Direct Marketing ........................................................................................................... 16\nVIII. Visual Surveillance Tools in Public Places ...................................................................................... 17\nIX. Vendor and Third-Party Risk Management ................................................................................... 18\nX. Data Breach Response Plan Compliance ........................................................................................... 19\nXI. Website/App-Specific Compliance ................................................................................................ 21\n\n1|Page\n\nI. PDPL Material & Territorial Scope\n\nPDPL Material Scope\n Yes No Partial NA\n\n1. Is personal data processed through fully or partially\n automated means (e.g., using electronic systems for\n collection, storage, use, or transfer)?\n 2. Is any personal data maintained solely in manual or\n paper-based formats, without being subject to any\n electronic or automated processing?\n Note: If the answer to the question is “Yes” and there is no\n associated electronic processing, the PDPL does not apply to this\n data.\n\nPDPL Territorial Scope\n Yes No Partial NA\n\n3. Are you an Egyptian controller or processor established\n or operating inside Egypt?\n 4. Are you an Egyptian controller or processor established\n or operating outside Egypt?\n 5. Are you a foreign controller or processor located within\n the Arab Republic of Egypt? (Regardless of the data\n subject’s nationality or residence)\n 6. Do you process personal data of Egyptian citizens\n residing inside or outside Egypt?\n 7. Do you process personal data of foreign nationals\n residing within the Arab Republic of Egypt?\n\nII. Data Protection Principles and Legal Basis Alignment under Art. 3 and Art.\n 6 of the PDPL\n 1. Lawfulness of Processing\n\nYes No Partial NA\n 8. Do you determine and document a valid lawful basis\n (e.g., consent, contract, legal obligation, legitimate\n interest) for each processing activity?"}, {"id": "guide-compliance-plan-002", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "2|Page\n\n- If the consent is relied upon as the lawful basis:\n\nGeneral Consent Requirements\n Consent must be explicit, freely given, specific, informed, and Yes No Partial NA\n unambiguous, and obtained through a clear affirmative action.\n a. Is the consent explicit, freely given, specific to a\n declared and legitimate purpose, informed, and\n unambiguous?\n b. Is the consent request presented clearly and separately\n from general terms and conditions, in plain, intelligible,\n and accessible language? (consent is not bundled with\n other terms and conditions)\n c. Do individuals need to take a positive action to indicate\n their agreement (i.e., opt-in)?\n d. Are separate consents obtained for distinct processing\n activities or purposes, with each request clearly\n explaining the type of processing and its corresponding\n purpose?\n e. Are individuals clearly informed of their right to refuse\n or withdraw consent at any time, without detriment?\n f. Are effective, simple mechanisms provided for\n individuals to withdraw consent at any time?\n g. Are individuals able to continue receiving the service\n even if they decline to provide consent for optional\n processing? (i.e., consent is not a condition of service)\n h. Are records of consent obtained documented and\n securely maintained?\n i. Are consent practices regularly reviewed and updated?\n\nNote: Consent Practices refers to the set of policies,\nprocedures, and operational measures an organization puts in\nplace to obtain, manage, and demonstrate valid consent from\ndata subjects.\n Consent for Sensitive Personal Data\n Where the processing concerns sensitive personal data, Yes No Partial NA\n additional conditions must be assessed\n a. Is the consent explicit, written, and obtained directly\n from the data subject or their authorized\n representative? (Consent may be obtained in physical or\n electronic format.)\n Consent for Children’s Data\n Additional safeguards apply when processing data of children Yes No Partial NA\n under 18. The following conditions must be assessed\n\n3|Page\n\na. For children under the age of 15:\n - Is explicit consent obtained from the parent or legal\n guardian specifying the purpose and duration of the\n processing?\n b. For children aged 15 to 18:\n - Has the child (or their guardian, as applicable)\n submitted the guardian’s explicit consent for collection\n and processing?"}, {"id": "guide-compliance-plan-003", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "- If the contractual obligation is relied upon as the lawful basis:\n\nYes No Partial NA\n a. Is there a contract or pre-contractual obligation with\n the data subject?\n b. Is the processing necessary to perform the contract or\n enter into a contract?\n c. Is the processing limited to what is strictly required to\n fulfill the contract or pre-contractual obligation?\n\n- If the legal obligation is relied upon as the lawful basis:\n\nYes No Partial NA\n a. Is the processing necessary to comply with a specific\n legal obligation imposed by applicable legislation?\n b. Has the relevant legal provision or regulatory\n requirement been clearly identified and documented?\n c. Is the processing proportionate and limited to what is\n required to fulfil the identified legal obligation?\n\n- If the legitimate interest is relied upon as the lawful basis:\n\nYes No Partial NA\n a. Has a specific and legitimate interest been clearly\n identified and documented for the processing activity?\n b. Is the processing necessary to achieve that interest, and\n is there no less intrusive, reasonable alternative?\n c. Would the data subject reasonably expect this\n processing, given the nature of the relationship and\n context?\n d. Can the processing be stopped if the data subject\n objects, unless compelling legitimate grounds are\n demonstrated?\n\n4|Page\n\ne. Can you demonstrate accountability for this legal basis\n through internal documentation and review\n procedures?\n\n2. Fairness\n\nYes No Partial NA\n a. Have you evaluated whether your data processing\n could lead to any unjustified harm to individuals?\n b. Are individuals’ expectations taken into account when\n collecting and using their data?\n c. Have you conducted risk assessments for any high-\n impact processing that could negatively affect data\n subjects?\n\n3. Transparency\n\nTransparency Information\n Yes No Partial NA\n a. Have you ensured that all required information relating\n to the purposes, legal basis, and methods of personal\n data processing is provided to data subjects in a clear,\n concise, and intelligible format?\n b. Is the transparency information provided to data\n subjects prior to or at the time of personal data\n collection?\n c. Is the transparency information made easily accessible\n through appropriate communication channels (e.g.,\n website, mobile application, or physical form)?\n d. Do you clearly inform data subjects of their rights (e.g.,\n right of access, correction, erasure, objection, and\n withdrawal of consent)?\n Accessibility and Maintenance of Privacy Notices &Privacy Policies\n Yes No Partial NA\n a. Do you maintain a public-facing privacy notice that\n clearly outlines the purposes, lawful basis, and methods\n of all personal data processing activities?\n b. Is your privacy notice or equivalent communication\n periodically reviewed, kept up to date, and revised?"}, {"id": "guide-compliance-plan-004", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "5|Page\n\nc. Do you have an internal privacy policy that instructs\n employees on lawful, secure, and transparent handling\n of personal data?\n Compelled Disclosure\n Yes No Partial NA\n a. Do you have an internal policy governing compelled\n disclosures to law enforcement or regulatory\n authorities, ensuring legal validity and proper\n documentation?\n\nNote: Compelled disclosure means the obligation to disclose or\nhand over personal data (or other types of information) because\nof a legal or regulatory requirement.\n\n4. Purpose Limitation\n\nYes No Partial NA\n a. Are processing purposes clearly defined and specific\n prior to data collection?\n b. Do you ensure data is not further processed in ways\n incompatible with the original purposes?\n c. Are secondary uses of personal data assessed for\n compatibility or supported by a new legal basis?\n\n5. Data Minimization\n\nYes No Partial NA\n a. Have you ensured that only personal data which is\n adequate, relevant, and strictly necessary for the\n specified and legitimate purpose is collected and\n processed?\n b. Have all data collection mechanisms (including forms,\n systems, and datasets) been reviewed to identify and\n eliminate unnecessary or excessive data fields?\n\n6. Storage Limitation\n\nYes No Partial NA\n a. Have clearly defined and documented data retention\n periods been established for each processing activity?\n\n6|Page\n\nb. Are these retention periods consistent with the lawful\n purpose of collection and any applicable legal\n obligations?\n c. Are appropriate procedures in place to ensure that\n personal data is securely deleted or anonymized upon\n the expiration of the applicable retention period?\n d. Are periodic reviews conducted to identify and remove\n personal data that is no longer necessary?\n\n7. Data Accuracy\n\nYes No Partial NA\n a. Are appropriate measures in place to ensure that\n personal data is accurate and, where necessary, kept up\n to date, including through periodic verification and\n rectification mechanisms?\n b. Does the controller provide accessible and effective\n means for data subjects to request the correction or\n update of inaccurate or incomplete personal data?\n\n8. Data Security\n\nPreliminary Assessment\n Yes No Partial NA\n a. Have appropriate technical measures (such as\n encryption, access controls, and intrusion detection\n systems) been implemented to ensure the\n confidentiality, integrity, and availability of personal\n data?\n b. Are there documented organizational measures\n (including internal policies, employee training, breach\n response protocols, and third-party oversight) in place\n to support secure and lawful processing?\n Governance and Accountability\n Yes No Partial NA\n a. Is there a documented governance framework for\n managing information security, privacy risks, and\n compliance?\n b. Are roles, responsibilities, and accountabilities clearly\n defined and regularly updated at all levels?"}, {"id": "guide-compliance-plan-005", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "7|Page\n\nc. Is there a steering committee or oversight body\n overseeing the alignment of information security and\n privacy with strategic objectives?\nd. Are adequate resources and skills allocated for effective\n privacy and information security management?\ne. Is segregation of duties implemented and reviewed to\n reduce unauthorized actions?\nf. Is there a privacy risk management process to assess,\n treat, monitor, and communicate personal data risks?\ng. Are privacy risk management processes established?\n Privacy by Design and by Default\n Yes No Partial NA\na. Do you ensure that data protection is integrated into the\n design of your processing activities and business\n practices from the start?\nb. Is data protection, through both privacy impact\n considerations and technical safeguards, embedded into\n the design and development of systems, products, and\n services from the outset?\nc. Are there procedures in place to ensure personal data is\n automatically protected by default and is not made\n accessible to an indefinite number of persons?\nd. Do you have procedures in place to ensure that personal\n data is automatically protected in any IT system or\n business practice?\ne. Do you ensure that privacy settings are set to the most\n privacy-friendly options by default?\nf. Do you conduct Data Assessments? (Data Protection\n Impact Assessment (DPIA), Risk Assessment, Vendor\n Assessment …etc.)\n Technical and Organizational Security Measures\n Yes No Partial NA\na. Are encryption mechanisms enforced to maintain\n personal data confidentiality and integrity?\nb. Do you use pseudonymization where applicable to\n enhance data security?\nc. Are physical security controls in place to protect\n personal data confidentiality, integrity, and availability?\nd. Do you apply secure configuration and vulnerability\n management practices for systems processing personal\n data?\ne. Are secure procedures documented and followed for\n disposing of personal data media?\nf. Are secure communication safeguards in place for\n internal and external personal data transmission?\n\n8|Page\n\nMonitoring, Audit, and Risk Mitigation\n Yes No Partial NA\n a. Are continuous monitoring mechanisms, regular audits,\n and assessments in place?\n b. Are policy reviews and updates implemented with\n metrics and analysis tools?\n c. Is there an asset management process for assets\n associated with personal data?\n d. Are access control safeguards implemented for personal\n data-related assets?\n e. Are there documented procedures for secure personal\n data management?\n Training & Awareness\n Yes No Partial NA\n a. Do you have any privacy awareness programs that are\n adopted?\n b. Do you provide training and awareness programs for\n employees to understand and implement privacy by\n design and by default principles?\n Certifications and External Standards\n a. Can you list the certifications your organization complies with related to information security\n and privacy?\n 1) ……………………………………………………………..\n 2) ……………………………………………………………..\n 3) ……………………………………………………………..\n 4) …………………………………………………………….."}, {"id": "guide-compliance-plan-006", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "9. Accountability\n\nThe following condition must be assessed Yes No Partial NA\n a. Can the controller demonstrate full compliance with the\n data protection principles through verifiable\n documentation, such as Records of Processing Activities\n (“ROPA”), Data Protection Impact Assessments\n (“DPIAs”), internal policies, audit logs, consent logs, and\n training records?\n\na. Record of Processing Activities (“ROPA”)\n\nImportant Note:\n\n- Article 4-9 mandates that controllers maintain a Record of Processing Activities (“ROPA”).\n\n9|Page\n\n- Article 5-9 requires the same for processors, for the processing activities they perform on behalf\n of controllers.\n\nData Inventory\n Yes No Partial NA\n\na. Do you define personal and sensitive personal data in\n accordance with Article 1 of the PDPL?\n[You clearly understand and apply the legal definition of\npersonal and sensitive personal data under the PDPL to ensure\naccurate identification and classification.]\nb. Do you identify all personal information collected and used\n by the organization?\n[You determine what personal data is collected, the purposes,\nthe means of collection, and how it is used across your\noperations.]\nc. Do you document where personal information is stored?\n[You record all storage locations, including internal systems,\nthird-party platforms, geographic server locations, and data\ncenters.]\nd. Do you map the flow of personal information across your\n organization?\n[You visualize the lifecycle of personal data—from collection\nthrough processing, storage, and transmission—including data\nsharing with vendors or third parties.]\ne. Do you determine and document the retention periods for\n personal data?\n\nf. Do you classify and categorize personal data?\n[You assign appropriate classification levels (e.g., public,\nconfidential, restricted) and evaluate the risk level associated\nwith each category of personal data.]\ng. Do you document the authority and responsibility for\n systems processing personal data?\n[You record the individuals or departments responsible for the\nsystems that handle personal data, including their roles and\ndecision-making authority.]\n Record of Processing Activities (“ROPA”) – Controller Requirements (Article 4-9)\n If you are a controller, does your documentation include the Yes No Partial NA\n following?\n\na. Name and contact details of the controller\n\nb. Name and contact details of the controller’s representative\n (if applicable)\n\n10 | P a g e\n\nc. Name and contact details of the Data Protection Officer\n (“DPO”)\nd. Name and contact details of any joint controller (if\n applicable)\ne. Purpose(s) of personal data processing"}, {"id": "guide-compliance-plan-007", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "f. Record of consent\n\ng. Description of the categories of personal data processed\n\nh. Description of the categories of data subjects\n[In practical terms, it means: You must describe the types of\npeople whose personal data you collect, store, use, or transfer.]\ni. Description of the categories of recipients to whom the\n personal data have been or will be disclosed, including\n recipients in third countries or international organizations\nj. Access control mechanisms\n\nk. Procedures for erasure or modification of personal data\nl. Identification of any third countries or international\n organizations to which personal data is transferred &\n Documentation of appropriate safeguards for international\n data transfers\nm. Retention periods for each data category\nn. General description of technical and organizational security\n measures\no. Description of data subject rights available under the PDPL\n Record of Processing Activities (“ROPA”) – Processor Requirements (Article 5-9)\n If you are a processor, does your documentation include the Yes No Partial NA\n following?\n\na. Name and contact details of the processor or processors\n and each controller on behalf of which the processor is\n acting\nb. Name and contact details of the controller’s representative\n or the processor’s representative (if applicable)\nc. Name and contact details of the Data Protection Officer\n (“DPO”)\nd. Categories of processing activities carried out on behalf of\n each controller\ne. Procedures for erasure or modification of personal data\nf. Retention periods for each data category\ng. Identification of any third countries or international\n organizations to which personal data is transferred &\n Documentation of appropriate safeguards for international\n data transfers\n\n11 | P a g e\n\nh. General description of technical and organizational security\n measures\n\nIII. Responding to Data Subject Requests\n\nData Subject Rights Enablement\n Yes No Partial NA\n\na. Do you have a documented and operational process to\n enable data subjects to exercise their rights under the PDPL,\n such as mechanisms for submission, identity verification,\n and response handling?\n b. Do your procedures ensure that acknowledgement of data\n subject requests is issued within six working days, as legally\n required?\n c. Are responses to data subject requests provided in a clear,\n intelligible, and accessible format using plain language?\n Rights Covered by Internal Procedures\n Confirm that internal procedures adequately cover the Yes No Partial NA\n following rights"}, {"id": "guide-compliance-plan-008", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "Right to be informed\n\nRight of access\n\nRight to withdraw consent\n\nRight to erasure\n\nRight to restrict processing\n\nRight to data portability\n\nRight to object\n\nRight to rectification\n Right to be notified in case of a data breach\n\nIV. Data Protection Officer\n\nAppointment & Nationality of DPO\n Yes No Partial NA\n a. Is a Data Protection Officer (DPO) appointed for the\n organization?\n\n12 | P a g e\n\nIs the DPO:\n ☐ Egyptian ☐ Foreign National\n Employment Status of DPO\n Yes No Partial NA\na. Is the DPO an existing employee of the organization?\n\nDisclaimer: The DPO may be an existing employee of the\norganization and may retain their previous responsibilities,\nprovided that the conditions of independence are upheld and the\nrole has been approved by PDPC has approved the role during\nthe registration process.\n\nb. Does the DPO continue to perform previous job functions\n alongside the DPO role?\nc. Is the DPO involved in decision-making regarding personal\n data processing activities?\nd. Is the DPO a newly hired employee or externally contracted?\n ☐ New hire ☐ External consultant/service provider\ne. External DPO Appointments: (If applicable)\n 1. If the same DPO is appointed to serve multiple\n controllers or processors, has prior approval been\n obtained?\n 2. In the case of a shared DPO arrangement across\n more than one entity, have all involved controllers\n or processors formally provided their written\n consent to such arrangement?\n DPO Roles and Responsibilities\n Based on Article 9 of Law No. 151 of 2020\n Monitoring and Evaluation Yes No Partial NA\na. Does the DPO oversee and ensure the entity’s compliance\n with the PDPL?\nb. Does the DPO monitor and evaluate the performance of\n departments involved in data processing activities?\nc. Does the DPO review the organizational (e.g., policies,\n procedures) and technical controls implemented to ensure\n compliance with the PDPL?\nd. Does the DPO determine the scope and frequency of\n compliance assessments? [Focus: Legal and procedural\n obligations under the PDPL.]\ne. Does the DPO ensure that appropriate data assessments,\n such as Data Protection Impact Assessments (“DPIAs”),\n Transfer Impact Assessments (“TIAs”), or similar\n evaluations, are carried out to identify and mitigate risks\n related to personal data processing activities?"}, {"id": "guide-compliance-plan-009", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "13 | P a g e\n\nf. Does the DPO ensure that assessments are carried out by\n appropriate personnel or third-party experts?\ng. Does the DPO review findings and recommendations from\n compliance assessments and data assessments?\nh. Does the DPO report on the entity’s overall data protection\n compliance status to management?\n Enabling Data Subject Rights Yes No Partial NA\na. Does the DPO ensure that data subjects can effectively\n exercise their rights under the PDPL, including the handling\n of their requests and complaints in a timely and transparent\n manner?\nb. Is the DPO’s contact information made available and easily\n accessible to data subjects?\n Incident Management Yes No Partial NA\na. Does the DPO notify the data subjects in the event of a\n personal data breach or violation?\nb. Does the DPO ensure that corrective measures are taken to\n address and contain personal data breaches and to\n eliminate violations related to personal data?\n Record Keeping and Maintenance Yes No Partial NA\na. Does the DPO oversee the maintenance and updating of the\n record of processing activities (ROPA) held by the controller,\n and the relevant processing operations record held by the\n processor, while ensuring the accuracy and completeness of\n the recorded data?\n Training and Capacity Building Yes No Partial NA\na. Does the DPO organize training programs for employees to\n ensure their compliance with the PDPL?\n Position and Independence\n The following condition must be assessed Yes No Partial NA\na. Is the DPO positioned at a sufficiently senior level within the\n organizational structure?\nb. Is the DPO assigned a position that ensures independence in\n the performance of their duties?\nc. Is the DPO guaranteed protection against dismissal or\n disciplinary action for performing their duties in compliance\n with the PDPL?\nd. Does the DPO report directly to the highest level of\n management (e.g., CEO, Board of Directors)?\n Certifications\nDoes your Data Protection Officer (DPO) hold professional certifications such as CIPP/E, CIPM, or\nCIPT? If yes, please list the certifications\n 1) ……………………………………………………………..\n 2) ……………………………………………………………..\n 3) ……………………………………………………………..\n\n14 | P a g e\n\n4) ……………………………………………………………..\n\nV. Licenses and Permits Readiness\n\nController / Processor - Processor\n Yes No\na. Has your organization identified whether it qualifies as a\n Controller/Processor, or Processor for purposes of determining the\n applicable licensing or permit obligations?\nb. Are you aware that obtaining a license or a permit from the PDPC is\n required before processing personal data under the PDPL?"}, {"id": "guide-compliance-plan-010", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "Note: ‘processing’ means any operation or set of operations which is\nperformed on personal data or on sets of personal data, such as collection,\nrecording, organisation, structuring, storage, adaptation or alteration,\nretrieval, consultation, use, disclosure by transmission, dissemination or\notherwise making available, alignment or combination, restriction, erasure\nor destruction;\n\nc. Has your organization prepared the necessary documentation (e.g.,\n data inventory, security measures, DPO designation) to support a\n license or permit application?\n Cross-Border Data Flow\n Yes No\na. Are you aware that a license or permit must be obtained from PDPC\n prior to conducting international data transfers under the PDPL, once\n such procedures are formally issued?\nb. Have you assessed your current data flows in preparation for these\n future licensing requirements?\n Electronic Marketing\n Yes No\na. Are you aware that conducting electronic marketing activities is\n subject to obtaining a license or permit from PDPC?\nb. Have you assessed your current and planned electronic marketing\n practices in preparation for future licensing or permit obligations\n under the PDPL?\nc. Do you regularly review and update your e-marketing practices to\n ensure compliance with the PDPL?\n Visual Surveillance Tools in Public Places\n Yes No\nc. Are you aware that the installation and operation of visual surveillance\n tools in public places is subject to obtaining a license or permit from\n PDPC?\n\n15 | P a g e\n\nd. Has your organization secured all necessary approvals from the\n competent authorities for the lawful use of visual surveillance tools in\n public places?\n\nVI. Cross-Border Data Transfer – Readiness Compliance Assessment\n\nThe following condition must be assessed Yes No Partial NA\n a. Do you currently process personal data outside the territory\n of the Arab Republic of Egypt?\n b. If yes, have you identified the transfer basis on which each\n external data transfer is carried out?\n c. Have you documented all relevant jurisdictions and their\n current adequacy status in anticipation of future PDPC\n determinations?\n d. In the absence of any adequacy decision, have you\n implemented appropriate safeguards to justify the transfer\n in accordance with the PDPL and its Executive Regulation?\n e. Are mechanisms in place to ensure that the data importer\n applies protection measures equivalent to those under the\n PDPL?\n f. If neither adequacy nor safeguards apply, have you assessed\n whether your transfers qualify for one of the limited\n derogatory cases permitted under the PDPL?\n g. If relying on exceptional transfer cases (derogations), have\n you documented the basis for each transfer?\n h. Have you carried out and documented a transfer impact\n assessment (TIA) to evaluate legal and technical risks\n associated with cross-border transfers?"}, {"id": "guide-compliance-plan-011", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "VII. Electronic Direct Marketing\n\nConsent and Record-Keeping\n Yes No Partial NA\n a. Do you obtain and verify the consent of the Data Subject\n before sending any electronic communication for direct\n marketing?\n b. Do you ensure that direct marketing communications are\n sent only to Data Subjects who have explicitly opted in?\n c. Do you maintain electronic records evidencing the Data\n Subject’s consent or non-objection to receive e-marketing\n\n16 | P a g e\n\ncommunications, including any amendments, for a period of\n three years from the date of the last communication?\n Transparency and Communication Content\n Yes No Partial NA\na. Does each electronic marketing communication clearly\n identify the sender and creator, include a valid contact\n address, and indicate its purpose as direct marketing?\nb. Do you specify a defined marketing objective for each\n electronic marketing communication sent to Data Subjects?\n Data Subject Rights and Preferences\n Yes No Partial NA\na. Do you ensure that the Data Subject is presented, from the\n outset, with a clear and unambiguous option to decline\n consent to receive electronic marketing communications?\nb. Do you ensure that the Data Subject is not compelled to\n consent to receiving electronic marketing communications\n as a condition for accessing a service, unless such\n communication is objectively necessary for the performance\n or provision of that service?\nc. Do you ensure that the Data Subject can withdraw\n previously granted consent or opt out of receiving further\n electronic marketing communications at any time through a\n clear and easily accessible mechanism?\nd. Do you offer a simple and easily accessible process through\n which Data Subjects can modify, update, or manage their\n communication preferences (e.g., frequency, channel, or\n type of marketing content)?\ne. Do you ensure that the contact details of the Data Subject\n are not disclosed in your e-marketing communications?\n\nVIII. Visual Surveillance Tools in Public Places\n\nYes No Partial NA\na. Has your organization placed clear and visible privacy\n notices in public areas to inform individuals of the presence\n and operation of visual surveillance tools\nb. Has your organization ensured that any recordings or\n images obtained through visual surveillance tools are not\n transferred, made available, or processed outside the\n territory of the Arab Republic of Egypt, except where\n expressly permitted by law?\nc. Has your organization ensured that no processing is carried\n out on personal images or video recordings using facial"}, {"id": "guide-compliance-plan-012", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "17 | P a g e\n\nrecognition or similar identification technologies, except\n where expressly permitted by law or based on the explicit\n consent of the data subject?\n d. Has your organization implemented binding measures to\n ensure that personnel operating visual surveillance systems\n in public places are obligated to maintain the confidentiality\n of collected data and are prohibited from using, sharing, or\n disclosing such data except as expressly permitted by law?\n e. Has your organization implemented the technical and\n organizational measures to secure recordings obtained\n through visual surveillance systems and to protect them\n against unauthorized access, breaches, or misuse?\n\nIX. Vendor and Third-Party Risk Management\n\nYes No Partial NA\n\na. Policies and Procedures\n Are vendor assessment policies consistently followed by all\n departments?\n b. Ongoing Monitoring and Auditing\n Is there regular monitoring and auditing of vendor activities?\n c. Termination Process\n Is there a clear process for terminating the vendor relationship?\n d. Data Inventory/Map\n Is relevant personal information included in your data\n inventory/map?\n e. Procurement Process\n Is there a consistent procurement process in place?\n f. Contractual Requirements\n Are all privacy and security requirements addressed in the\n contract?\n g. Processing Activities\n Do processing activities align with the privacy framework?\n Privacy Risk Management\n a. Is a vendor/third-party risk assessment conducted prior to\n engagement?\n\nb. Are compliance certifications, privacy policies, and\n information security policies reviewed before finalizing\n agreements?\n\n18 | P a g e\n\nc. Are privacy risks identified, assessed, mitigated, and\n addressed in the contract?\na. Training and Awareness\nHave relevant teams received training to handle vendor privacy\nissues?\n\nX. Data Breach Response Plan Compliance\n\nBreach1 Notification Obligations\n Internal Preparedness and Existing Procedures Yes No Partial NA\na. Has your organization adopted an incident response plan\n addressing personal data breach?\nb. Does the incident response plan clearly identify all required\n notification recipients, including affected data subjects and,\n in the case of processors, the controller or other relevant\n parties?\nc. Does the incident response plan establish procedures and\n timelines triggered upon becoming aware of a personal\n data breach?\n Anticipated Obligations upon Official Launch of PDPC Yes No Partial NA\nHas your organization reviewed and accounted for future\nbreach notification obligations in its documented incident\nresponse plan, specifically with respect to procedures that:\na. Provide for notifying the Personal Data Protection Center\n (PDPC) within seventy-two (72) hours of becoming aware of\n a personal data breach?"}, {"id": "guide-compliance-plan-013", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "b. Provide for notifying the PDPC immediately in cases\n involving breaches that impact national security?\nc. Provide for notifying affected data subjects within three (3)\n working days of notifying the PDPC?\n\nNote: This focuses on the present state of documentation:\nwhether the current plan already reflects the statutory\nobligations (even if not yet enforceable).\nd. If the above is not implemented, is your organization\n currently preparing specific updates to your breach\n response framework to operationalize the statutory breach\n notification obligations under the PDPL?\n\nNote: This focuses on the future implementation.\n Incident2 Detection and Immediate Response\n\n19 | P a g e\n\nYes No Partial NA\nAre there procedures for:\na. Detecting personal data breaches effectively?\n\nb. Monitoring data security to promptly identify incidents?\n\nc. Taking immediate containment and remediation actions\n once a breach is suspected or confirmed?\n\nIncident Response Plan Structure and Governance\n Yes No Partial NA\na. Does the incident response plan define internal escalation\n mechanisms and assign clear roles and responsibilities to\n relevant personnel, including the designation of an Incident\n Response Team (IRT) responsible for managing and\n responding to personal data breaches?\nb. Does the plan include structured procedures for?\n • Containment, and recovery\n • Post-incident reviews and implementation of\n corrective actions\nc. Is the incident response plan formally embedded within the\n organization’s overarching risk management and data\n security governance frameworks, and does it undergo\n periodic review and update to maintain compliance with\n applicable legal obligations and ensure operational\n effectiveness?\n Communication and Training\n Yes No Partial NA\nd. Are training and awareness programs in place to ensure\n that all employees are familiar with breach reporting\n procedures and the legal implications of data incidents?\n Documentation and Reporting\n Yes No Partial NA\nDoes the organization maintain complete documentation for\neach incident, including?\n\na. Incident description\n\nb. Response actions taken\n\nc. Lessons learned and post-incident remediation measures?\n\nAnnex: Key Definitions\n\n20 | P a g e\n\n1. Incident: An event that may compromise the confidentiality, integrity, or availability of personal\n data, but which does not necessarily trigger notification obligations.\n\n2. Breach: A confirmed unauthorized disclosure of personal data, which requires notification to\n external parties under the PDPL."}, {"id": "guide-compliance-plan-014", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "XI. Website/App-Specific Compliance\n\nControllers, and processors acting on their behalf, who operate websites or mobile applications must\nensure full compliance with all provisions of the PDPL and its Executive Regulation. The checklist below\noutlines specific requirements applicable to personal data processing activities carried out through digital\nplatforms. These obligations are complementary to, and must be implemented alongside, the other\nrequirements addressed in other thematic compliance checklists\n\nPrivacy Interface and User Interaction\n Yes No Partial NA\n a. Is a dedicated and up-to-date privacy notice made publicly\n available on the website/app, clearly describing the\n personal data collection and processing activities carried\n out through the digital platform?\n b. Is the Privacy Notice easily accessible on every page (e.g.,\n via footer or menu)?\n Cookie and Tracking Consent (Digital Environment)\n Yes No Partial NA\n a. Is a cookie banner implemented that clearly explains the\n use and purposes of cookies, pixels, SDKs, or similar tracking\n technologies, and distinguishes between essential and non-\n essential types?\n b. Are non-essential cookies and tracking technologies\n disabled by default and only activated after obtaining the\n user’s explicit, informed consent?\n c. Does the consent interface provide granular options by\n category (e.g., performance, analytics, marketing), rather\n than relying solely on general acceptance or refusal,\n enabling users to select or refuse specific categories of\n cookies or similar technologies?\n d. Once preferences are submitted, are they properly\n recorded and enforced across future sessions, unless the\n Data Subject revokes or modifies them?\n e. Is a clearly accessible mechanism provided for users to\n review, modify, or withdraw their cookie preferences at any\n time?\n\n21 | P a g e"}, {"id": "guide-compliance-plan-015", "ref": "Data Protection Compliance Plan Checklist — Introduction", "text": "f. Does the website/app remain fully usable and accessible\n even when the user declines all non-essential cookies?\ng. Is the cookie banner linked to the Privacy Notice and\n accessible from all pages?\n Third Party and Data Processor Alignment\n Yes No Partial NA\na. Have you identified all third parties or processors involved\n in website/app operations (e.g., hosting, analytics,\n marketing tools)?\nDo all processor contracts include provisions that bind them to\nPDPL-compliant obligations?\nHave you reviewed whether each third party aligns with your\npublished Privacy Notice?\nAre regular reviews conducted to ensure third parties remain\ncompliant with PDPL?\n Website/Application Security Measures\n Yes No Partial NA\nHave you implemented technical and organizational measures\nto secure personal data processed through your website or\napp?\nAre third-party scripts and plugins regularly reviewed for\nvulnerabilities?\nDo you have a digital-specific incident response procedure in\nplace for handling personal data breaches involving the\nwebsite/app, including secure user notification channels?\n Age Verification Measures\n Yes No Partial NA\nIf your website/app targets or may be used by children, do you\nimplement age verification mechanisms and obtain verifiable\nparental consent before collecting personal data?\n Content Management System (CMS) and Plugin Updates\n Yes No Partial NA\nIs your CMS regularly updated and patched to prevent\nvulnerabilities?\nAre third-party plugins or extensions kept up to date and legally\nreviewed?\n Data Subject Communication and Rights Requests\n Yes No Partial NA\nDoes the website/app provide a clearly visible and consistently\naccessible communication channel (e.g., privacy-specific email\naddress, contact form, or in-app feature) through which Data\nSubjects may submit inquiries, complaints, or exercise their\nrights under the PDPL?\nIs there a documented internal procedure in place to:\n • Acknowledge receipt of Data Subject communications\n\n22 | P a g e\n\n• Verify the identity of the requesting Data Subject prior\n to responding;\n• Record and log the nature of the request or complaint,\n the steps taken, the outcome, and the timeline of action\n taken\n\n23 | P a g e"}, {"id": "guide-framework-001", "ref": "Egypt's Personal Data Protection Framework Overview — Introduction", "text": "Egypt’s Personal Data\n Protection Framework:\nFrom Legal Foundations\nto Practical Compliance\n and Enforcement\n\nMar., 2026\n\nEmpowering Data Protection\nin Egypt: Regulatory\nFramework and Enforcement\n1. Overview of Egypt's Personal Data Protection Law No. 151\n of 2020\n2. Personal Data Protection Center (PDPC): Roles and\n Responsibilities as the Regulatory Authority\n3. Key Provisions and Highlights of the PDPL & its Executive\n Regulations\n4. Compliance Toolkit Overview\n5. Licenses/ Permits Applications\n6. Application for Accreditation as Data Protection Consultant\n (DPC) / Data Protection Officer (DPO)\n\nOverview of The Personal Data Protection Law\n\nThe Personal Data Protection Law No. 151 of 2020 (\"PDPL\") establishes a comprehensive framework for\nprotecting personal data. The
