n breach] On a breach or violation, the controller/processor must notify the Center within 72 hours of becoming AWARE, via the electronic portal or hotline, and log the notification in a secure electronic record. The notice must state: the hour/date of awareness and of reporting; the nature and time of the breach with an approximate count of affected data; potential effects and expected damage; immediate corrective measures taken; the DPO's contact details; and anything else the Center requests. Breaches touching national security must be reported immediately with extra details (the national-security connection; affected data volume and damage estimate). In all cases the data subject must be notified within three working days of notifying the Center, including the safeguards taken, by the contact method agreed at consent (SMS, email, or phone call)."}, {"id": "exec-regs-006", "ref": "Exec Regs Art 6 — Center duties on breach", "text": "[Center duties on breach] The Center must provide reporting channels (with a dedicated channel for national-security-related reports), coordinate notification mechanisms with national security agencies, and regularly train DPOs on classifying breaches."}, {"id": "exec-regs-007", "ref": "Exec Regs Art 7 — Conditions to register as a DPO", "text": "[Conditions to register as a DPO] A Data Protection Officer must: hold relevant academic qualifications or professional certificates plus practical experience per Board standards; pass Center tests scaled to the nature and size of the data activity; and have no prior conviction for crimes of moral turpitude or dishonesty."}, {"id": "exec-regs-008", "ref": "Exec Regs Art 8 — DPO registration documents", "text": "[DPO registration documents] The DPO register application includes: ID (national ID or passport), a recent photo, qualifications, proof of experience, a criminal-record certificate, proof of passing Center tests, and any existing DPO code. The Center decides within 30 working days (15 days after any requested documents are supplied). The entity's legal representative must take the steps needed to register its DPOs."}, {"id": "exec-regs-009", "ref": "Exec Regs Art 9 — The DPO register and code", "text": "[The DPO register and code] The Center keeps an electronic DPO register. Each officer gets a 'DPO code' recording the nature and volume of data they may handle based on their test results. Registration is via the electronic portal, either by the controller/processor's legal representative registering an employee, or by a natural person applying directly."}, {"id": "exec-regs-010", "ref": "Exec Regs Art 10 — Ending or replacing a DPO", "text": "[Ending or replacing a DPO] To end a DPO relationship, the legal representative must notify the Center at least 15 days in advance and have applied to register a replacement matching the data previously handled, giving the replacement's code. The Center can suspend a non-compliant DPO and require a temporary registered substitute until a permanent appointment within a period the Center sets."}, {"id": "exec-regs-011", "ref": "Exec Regs Art 11 — One DPO for several entities", "text": "[One DPO for several entities] A registered DPO may serve more than one entity if the entities agree, no conflict of interest arises, the work stays within the officer's authorized data volume/nature, and the Center approves. Structurally linked entities with complementary data-exchanging activities may share one DPO with notice to the Center."}, {"id": "exec-regs-012", "ref": "Exec Regs Art 12 — DPO obligations", "text": "[DPO obligations] The DPO must: monitor application of the Center's security policies and file an annual privacy-state report to the Center (or on request); if appointed as a replacement, report on the privacy state within 15 days of taking office; monitor and ensure implementation of data-subject requests (deletion, modification, addition); avoid conflicting assignments; and, when serving a group of entities, run a separate system reviewable by the Center."}, {"id": "exec-regs-013", "ref": "Exec Regs Art 13 — Digital evidence", "text": "[Digital evidence] Digital evidence from personal data has the same evidentiary weight as written evidence if: collection used technology preventing alteration; the evidence is relevant and within the investigating authority's or court's scope; it was collected and preserved by authorized judicial officers or specialized experts, with reports naming the tools used and preserving the original; and it is documented in a procedural report with dated, attributed copies before analysis."}, {"id": "exec-regs-014", "ref": "Exec Regs Art 14 — Sensitive personal data controls", "text": "[Sensitive personal data controls] To collect, transfer, store, process or make available sensitive data, the controller/processor must: hold the relevant Center license/permit; obtain EXPLICIT WRITTEN consent (paper or electronic) from the data subject — or the guardian for children's data — except where law permits otherwise; ensure the data is essential to the entity's work and its use harmless to the data subject; meet the Center's security standards for sensitive data; never take from a child participating in a game/competition more data than participation requires, and never use children's data for classification, tracking, or behavioral monitoring; follow any further Board standards; and keep secure electronic records of consents and of deletion/modification/stop-processing requests and their execution."}, {"id": "exec-regs-015", "ref": "Exec Regs Art 15 — Children's data", "text": "[Children's data] For children UNDER 15: explicit written guardian consent (paper or electronic) is required BEFORE collecting or processing, must state the timeframe, and is withdrawable/amendable; the Center approves the consent formats. For children 15–18: the guardian's consent must still be provided, via mechanisms the Center defines."}, {"id": "exec-regs-016", "ref": "Exec Regs Art 16 — Cross-border transfer controls", "text": "[Cross-border transfer controls] Transferring, storing, sharing, processing or making personal data available across borders requires BOTH: (1) a Center license/permit granted according to the Center's assessment of the destination country's adequacy, AND (2) the data subject's consent to the transfer. The entity must use technology ensuring adequate protection in transit and at rest, matched to the licensed data volume/nature, and may transfer only to the countries named in its license/permit — adding countries requires updating it. The Center maintains an adequacy policy listing countries with sufficient protection, judged on: data-protection legislation consistent with the Law; technical and security safeguards; and legal compensation rules for misuse. Meeting the standards lets the Center license transfers to other qualifying countries."}, {"id": "exec-regs-017", "ref": "Exec Regs Art 17 — Making data available to a controller/processor abroad", "text": "[Making data available to a controller/processor abroad] Sharing personal data with another controller or processor outside Egypt requires a Center license and: (1) the two businesses' activities must be common or complementary, serving a legitimate interest of both parties or the data subject; and (2) safeguards ensuring the foreign recipient's legal and technical protection is no weaker than Egypt's."}, {"id": "exec-regs-018", "ref": "Exec Regs Art 18 — Direct electronic marketing rules", "text": "[Direct electronic marketing rules] A sender (controller or processor) of direct-marketing electronic communication must: hold a Center license for direct e-marketing; have the data subject's explicit prior consent to receive it; and erase the data when consent is withdrawn or when the retention period/marketing purpose ends (whichever is sooner). Marketing data may not be reused, exchanged, or processed for other purposes without explicit consent. First contact must identify the caller, state the marketing purpose, and enable refusal or withdrawal through Center-approved channels (social media messages, SMS, email, phone). Marketing intermediaries must verify the consent chain and retain the data's source, or immediately stop using the data. Senders must keep electronic records — available to the Center on request — of how/when consent was obtained and its purpose, erasure/amendment requests and actions, and data-security mechanisms. The Center runs a complaints channel for direct-marketing abuse."}, {"id": "exec-regs-019", "ref": "Exec Regs Art 19 — License categories and fees (controllers/processors, legal entities)", "text": "[License categories and fees (controllers/processors, legal entities)] Annual combined controller+processor license fees scale with the number of personal-data records: 1–100,000 records = EXEMPT from fees; 101k–1M = EGP 200 up to EGP 1,000 (roughly EGP 100 per additional 100k); 1M–2M = EGP 5,000 up to EGP 50,000 (EGP 5,000 per 100k); 2M–3M = EGP 60,000 up to 150,000 (EGP 10,000 per 100k); 3M–4M = EGP 165,000 up to 300,000 (EGP 15,000 per 100k); 4M–5M = EGP 320,000 up to 500,000 (EGP 20,000 per 100k). Above 5M records the fee is the legal maximum — EGP 2,000,000 over three years (about EGP 666,666/year). A controller-ONLY or processor-ONLY license costs HALF the table value. Member-data licenses: associations EGP 5,000/yr; syndicates EGP 10,000/yr; clubs EGP 20,000/yr (<50k member records) or EGP 50,000/yr (>50k)."}, {"id": "exec-regs-020", "ref": "Exec Regs Art 20 — Permit categories and fees", "text": "[Permit categories and fees] A permit covers a specific, temporary purpose for up to one calendar year. Fees scale by record count and duration: 1–25,000 records = EXEMPT for any period; 25k–250k = EGP 10,000 (≤3 months) up to EGP 25,000 (9–12 months); 250k–500k = EGP 12,500–50,000; 500k–1M = EGP 25,000–100,000; 1M–2M = EGP 50,000–200,000; 2M–3M = EGP 75,000–300,000; 3M–4M = EGP 100,000–400,000; 4M–5M = EGP 125,000–500,000; above 5M = the legal maximum for any period. Controller-only or processor-only permits cost half the table value."}, {"id": "exec-regs-021", "ref": "Exec Regs Art 21 — License/permit conditions — legal entities", "text": "[License/permit conditions — legal entities] A legal entity applying for a license/permit must show: its consent mechanism and how data subjects exercise their rights; proof of maintaining the required electronic records; its data-security mechanisms per the Center's standards; proof of compliance enabling Center inspection; the DPO contract with the officer's explicit acceptance and guaranteed independence; acknowledgment of the Center's financial penalties for violations; and proof of compliance with sensitive-data and children's-data controls."}, {"id": "exec-regs-022", "ref": "Exec Regs Art 22 — Permit conditions — natural persons", "text": "[Permit conditions — natural persons] A natural person applying for a permit must show: the consent mechanism and rights-exercise mechanisms; data-security mechanisms per the Center's standards; proof of compliance enabling inspection; and compliance with sensitive-data and children's-data controls."}, {"id": "exec-regs-023", "ref": "Exec Regs Art 23 — Cross-border license/permit — scope", "text": "[Cross-border license/permit — scope] The cross-border license/permit grants the right to transfer personal data collected or prepared for processing from inside Egypt to outside, per the Regulations' cross-border controls."}, {"id": "exec-regs-024", "ref": "Exec Regs Art 24 — Cross-border license/permit — requirements (legal entities)", "text": "[Cross-border license/permit — requirements (legal entities)] Beyond general conditions, applicants must specify: the destination(s); evidence of the foreign recipient's activity; the nature of the data; the security systems, temporary/final storage locations, and in-transit protections; compliance with the cross-border rules; the transfer purpose; storage-location details per Center forms; and the categories, volume, and retention period of the transferred data."}, {"id": "exec-regs-025", "ref": "Exec Regs Art 25 — Cross-border permit — natural persons", "text": "[Cross-border permit — natural persons] Natural persons must specify: the nature, description, volume and purpose of the transfer; the destination and retention period; security systems and storage locations with transfer protections; compliance with cross-border rules; and storage-location details per Center forms."}, {"id": "exec-regs-026", "ref": "Exec Regs Art 26 — Cross-border application procedure", "text": "[Cross-border application procedure] Applications go through the electronic portal with all Article 24/25 data. Specialized working groups study them; the Center may seek clarifications. The decision (approval or rejection) comes within 90 working days of complete submission — silence counts as rejection."}, {"id": "exec-regs-027", "ref": "Exec Regs Art 27 — Cross-border fees", "text": "[Cross-border fees] The cross-border transfer license/permit fee is 50% of the applicant's controller/processor license or permit fee, by data nature and volume."}, {"id": "exec-regs-028", "ref": "Exec Regs Art 28 — Direct e-marketing license — scope", "text": "[Direct e-marketing license — scope] The direct-marketing license/permit is issued to a controller or processor providing electronic marketing services, allowing use of personal data for direct e-marketing for itself or others under the legal conditions."}, {"id": "exec-regs-029", "ref": "Exec Regs Art 29 — E-marketing license categories and fees", "text": "[E-marketing license categories and fees] Category 1 — THIRD-PARTY marketing (promoting others' goods/services): fee = 25% of the controller/processor license fee. Category 2 — SELF marketing (promoting your own goods/services): fee = 10% of the controller/processor license fee."}, {"id": "exec-regs-030", "ref": "Exec Regs Art 30 — E-marketing license conditions", "text": "[E-marketing license conditions] Requires: proof of sector-authority approval of the activity; an existing controller/processor license or permit; the consent-collection mechanism for marketing communications; the refusal/withdrawal mechanisms; and electronic records of consents and deletion/amendment requests."}, {"id": "exec-regs-031", "ref": "Exec Regs Art 31 — Visual surveillance (CCTV) in public places", "text": "[Visual surveillance (CCTV) in public places] Using visual surveillance in PUBLIC places requires a Center license/permit plus: sector approvals; visible public notice that cameras are present; no transfer of footage outside Egypt except as law provides; NO face-recognition or similar identification processing except as law provides or with explicit consent; confidentiality duties on operators; the Center's security procedures against hacking; and Center inspection access. Home cameras within the household's own boundaries are excluded. Fees: license EGP 1,000 per three years; permit EGP 500 per year."}, {"id": "exec-regs-032", "ref": "Exec Regs Art 32 — Accreditation to give data-protection consultations — natural persons", "text": "[Accreditation to give data-protection consultations — natural persons] Requires relevant qualifications/certificates and experience, passing the Center's tests for the intended activity's nature and size, and no conviction for crimes of moral turpitude or dishonesty."}, {"id": "exec-regs-033", "ref": "Exec Regs Art 33 — Accreditation — legal entities", "text": "[Accreditation — legal entities] Requires information proving the entity's activity and basis; relevant practical experience; and proof that its consulting staff hold Center accreditation certificates and valid practice permits."}, {"id": "exec-regs-034", "ref": "Exec Regs Art 34 — Accreditation fees", "text": "[Accreditation fees] Natural person: EGP 5,000/year. Legal entity: EGP 50,000/year. The certificate is valid three years and renewable for like periods at the same fees."}, {"id": "exec-regs-035", "ref": "Exec Regs Art 35 — License/permit documents — legal entities", "text": "[License/permit documents — legal entities] Applications must include: commercial register, address, legal representative, structure, activity, contacts; the requested category; the nature/volume of data with sensitive data identified; retention periods; transfer-security procedures; the erase/amend mechanism; storage method; the DPO; the consent mechanism; full infrastructure details (data-center classification, equipment, current technical certificates and their compliance); and the security certificates/accreditations with issuers, dates, and validity."}, {"id": "exec-regs-036", "ref": "Exec Regs Art 36 — License/permit procedure — legal entities", "text": "[License/permit procedure — legal entities] Applications go through the dedicated electronic portal with all required data per category. Specialized working groups study them and may seek clarification. Decision within 90 working days of complete submission; silence = rejection."}, {"id": "exec-regs-037", "ref": "Exec Regs Art 37 — Permit documents — natural persons", "text": "[Permit documents — natural persons] Applications include: ID, criminal-record certificate, qualifications, nature of work; permit category; purpose; nature/volume of data with sensitive data identified; retention period; erase/amend mechanism; storage method; consent mechanism; infrastructure details and compliance; and security certificates with issuers, dates, validity."}, {"id": "exec-regs-038", "ref": "Exec Regs Art 38 — Permit procedure — natural persons", "text": "[Permit procedure — natural persons] Via the electronic portal; specialized teams review; decision within 90 days of complete submission, silence = rejection. An approved natural-person permit runs at most one year, and the holder personally carries the law's obligations and the DPO's duties."}, {"id": "exec-regs-039", "ref": "Exec Regs Art 39 — General license/permit provisions", "text": "[General license/permit provisions] Associations, syndicates and clubs handling members' data must hold the required licenses/permits. If record counts grow beyond the licensed volume, the holder must apply to amend the license/permit. Legal entities must also hold their sector-activity approvals."}, {"id": "exec-regs-040", "ref": "Exec Regs Art 40 — Renewal", "text": "[Renewal] Licenses expire at term and are renewable on request made at least THREE months before expiry; permits are renewable (more than once) on request at least ONE month before expiry — both per the Center's mechanisms, conditions, and fees."}, {"id": "exec-regs-041", "ref": "Exec Regs Art 41 — Application forms", "text": "[Application forms] License, permit and accreditation applications are electronic, via an interactive platform on the Center's portal. Forms are generated from the applicant's declared activity and data profile, and issued after review of: data types and purposes; retention periods and the deletion commitment; proof of the personal-data register (categories, disclosees, basis, deletion/modification mechanisms, cross-border details); the consent mechanism; security undertakings; inspection-enabling undertakings; staff confidentiality acknowledgments; and acceptance of the Center's financial penalties."}];

/* ================= retrieval ================= */
const STOP = new Set("the a an and or of to in for on with is are be do does my i we you it as at by from this that shall may not no if any".split(" "));
const tok = s => s.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF ]/g," ").split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));
const DOCS = CORPUS.map(c=>({ ...c, terms: tok(c.text + " " + c.ref) }));
const DF = {}; DOCS.forEach(d=>new Set(d.terms).forEach(t=>DF[t]=(DF[t]||0)+1));
const N = DOCS.length, avgL = DOCS.reduce((s,d)=>s+d.terms.length,0)/N;
function retrieve(qterms, k=6){
  return DOCS.map(d=>{
    let s=0; const L=d.terms.length;
    for(const t of new Set(qterms)){
      const tf = d.terms.filter(x=>x===t).length; if(!tf) continue;
      const idf = Math.log(1+(N-DF[t]+0.5)/(DF[t]+0.5));
      s += idf*(tf*2.2)/(tf+1.2*(0.25+0.75*L/avgL));
    } return {d,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,k).map(x=>x.d);
}

const RULES = `You are Eshra7ly (اشرحلي), a plain-language assistant that explains Egypt's Personal Data Protection Law (PDPL, Law 151/2020), its Executive Regulations (Decree 816/2025), and the PDPC's guidance to ordinary citizens and small businesses.
STRICT RULES:
1. LANGUAGE — detect the language of the user's question and reply ENTIRELY in that same language. If the question is in Arabic, answer in clear, natural Egyptian Arabic. If it is in English, answer in English. Do not mix the two languages in one answer (an unavoidable proper noun is the only exception).
2. FORMATTING — write in plain, clean prose made of short paragraphs. Do NOT use Markdown or any formatting symbols: no asterisks (** or *), no hash headings (#, ##, ###), no horizontal rules (---), no block quotes (>), no backticks, no underscores for emphasis, and no Markdown bullet syntax. If you must list things, write them on separate lines each starting with a plain dash and a space. The ONLY bracketed text allowed is a citation (rule 5).
3. Answer ONLY from the SOURCES provided in this message. Never use outside knowledge.
4. If the sources don't contain the answer, say plainly you couldn't find it in the official sources and advise confirming with the Personal Data Protection Center (PDPC). Never guess.
5. Support every claim with a bracketed citation copied exactly from a source's REF, e.g. [Law Article 14]. The REF may stay in English even inside an Arabic answer. Never invent a citation.
6. Keep answers short, concrete, and practical. This is general information, not legal advice or a binding ruling — add one short reminder when the question is consequential.
7. Scope is data protection only; other topics are outside what you cover today.
8. Never declare anyone "fully compliant" — describe obligations instead.
9. Executive Regulations sources are plain-English restatements; when citing exact figures note they should be verified with the PDPC or the official Arabic text.`;

async function claude(messages){
  const r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages})});
  const data = await r.json();
  if(data.error) throw new Error(data.error.message||"API error");
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
}

/* ================= chat ================= */
const hist = [];
const feed = document.getElementById("feed"), mainEl = document.getElementById("main");
const q = document.getElementById("q"), send = document.getElementById("send");
function el(h){const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderAnswer(t){
  // 1) Strip Markdown structure the model shouldn't emit (done before HTML-escaping).
  let s = (t||"").replace(/\r/g,"")
    .replace(/^\s*#{1,6}\s*/gm,"")             // headings: drop #, keep the text
    .replace(/^\s*>\s?/gm,"")                   // block quotes
    .replace(/^\s*([-*_])\1{2,}\s*$/gm,"")      // horizontal rules: --- *** ___
    .replace(/`{1,3}/g,"");                     // backticks
  // 2) Escape HTML, then render only the light bits we allow.
  s = esc(s);
  s = s.replace(/^\s*[-*]\s+/gm,"• ");          // leading - or * bullets -> clean bullet
  s = s.replace(/\*\*([^*]+?)\*\*/g,"<strong>$1</strong>"); // **bold** -> bold
  s = s.replace(/\*(?!\s)([^*\n]+?)\*/g,"<em>$1</em>");      // *italic* -> italic
  s = s.replace(/\*/g,"");                       // remove any leftover stray asterisks
  s = s.replace(/_{1,2}([^_\n]+?)_{1,2}/g,"$1"); // strip stray _emphasis_
  s = s.replace(/\[([^\[\]\n]{3,80})\]/g,'<span class="cite">$1</span>'); // citations -> chips
  return s;
}
function push(role, html, extra=""){
  const m = el(`<div class="msg ${role}"><div class="bubble" dir="auto">${html}</div>${extra}</div>`);
  feed.appendChild(m); mainEl.scrollTop = mainEl.scrollHeight; return m;
}
async function ask(text){
  text = (text ?? q.value).trim(); if(!text) return;
  q.value=""; q.style.height="auto"; send.disabled=true;
  showPage("ask");
  push("user", esc(text));
  const think = push("bot", `<span class="think"><i></i><i></i><i></i></span>`);
  try{
    let kw = text;
    try{ kw = await claude([{role:"user",content:`Give 6-10 English search keywords (single words, space-separated, no punctuation, no commentary) for finding passages in Egypt's data-protection law corpus that answer this question:\n"${text}"`}]); }catch(e){}
    const hits = retrieve(tok(text + " " + kw));
    const srcBlock = hits.length ? hits.map((h,i)=>`SOURCE ${i+1} — REF: ${h.ref}\n${h.text}`).join("\n\n---\n\n") : "(no matching sources found)";
    const msgs = []; hist.slice(-6).forEach(m=>msgs.push(m));
    msgs.push({role:"user",content:`${RULES}\n\n=== SOURCES ===\n${srcBlock}\n=== END SOURCES ===\n\nQUESTION: ${text}`});
    const ans = await claude(msgs);
    think.remove();
    const chips = hits.map(h=>`<span class="chip">${esc(h.ref)}</span>`).join("");
    push("bot", renderAnswer(ans), hits.length?`<div class="srcs"><span class="lbl">SOURCES CONSULTED</span>${chips}</div>`:"");
    hist.push({role:"user",content:text},{role:"assistant",content:ans});
  }catch(e){
    think.remove();
    push("bot", `<span class="err">Something went wrong reaching the model (${esc(e.message)}). Try again.</span>`);
  }
  send.disabled=false; q.focus();
}
send.onclick=()=>ask();
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask();}});
q.addEventListener("input",()=>{q.style.height="auto";q.style.height=Math.min(q.scrollHeight,130)+"px";});

}

/* ================= fees (Exec Regs Art 19) ================= */
function feeFor(records, both){
  let fee, label=null;
  if(records<=100000) return {exempt:true};
  else if(records<=1000000){ const steps=Math.ceil((records-100000)/100000); fee=100+steps*100; if(fee>1000)fee=1000; if(fee<200)fee=200; }
  else if(records<=2000000){ const steps=Math.ceil((records-1000000)/100000); fee=Math.min(50000, steps*5000); fee=Math.max(fee,5000); }
  else if(records<=3000000){ const steps=Math.ceil((records-2000000)/100000); fee=Math.min(150000, 50000+steps*10000); }
  else if(records<=4000000){ const steps=Math.ceil((records-3000000)/100000); fee=Math.min(300000, 150000+steps*15000); }
  else if(records<=5000000){ const steps=Math.ceil((records-4000000)/100000); fee=Math.min(500000, 300000+steps*20000); }
  else return {over:true};
  if(!both) fee = fee/2;
  return {fee: Math.round(fee)};
}
let roleBoth = true;
function renderFees(){
  const t = T[LANG];
  const rc = parseInt(document.getElementById("recCount").value||"0",10);
  const r = feeFor(rc, roleBoth);
  const box = document.getElementById("fres");
  let inner;
  if(r.exempt) inner = `<div class="amt exp">${t.exempt}</div>`;
  else if(r.over) inner = `<div class="amt">${t.over5}</div>`;
  else inner = `<div class="amt">EGP ${r.fee.toLocaleString()} <span style="font-size:15px;color:#A8B4BE">${t.peryear}</span></div>`;
  box.innerHTML = inner + `<p>${t.fnote}</p>`;
}
document.getElementById("recCount").addEventListener("input", renderFees);
document.getElementById("roleSeg").addEventListener("click", e=>{
  if(e.target.dataset.r){ roleBoth = e.target.dataset.r==="both";
    document.querySelectorAll("#roleSeg button").forEach(b=>b.classList.toggle("on",b.dataset.r===(roleBoth?"both":"single")));
    renderFees(); }
});

    c.onclick=()=>ask(g.q[LANG]); gg.appendChild(c);
  });
  // checklist
  renderChecklist();
  renderFees();
}
function renderChecklist(){
  const t = T[LANG];
  const list = document.getElementById("ckList"); list.innerHTML="";
  let done=0;
  CHECK.forEach((c,i)=>{
    const [h,p]=c[LANG]; const isDone = !!ckState[i]; if(isDone) done++;
    const row = el(`<div class="ck ${isDone?"done":""}"><input type="checkbox" ${isDone?"checked":""}><div><b>${h}</b><span>${p}</span><br><button class="ckask">${t.askAbout}</button></div></div>`);
    row.querySelector("input").onchange = e=>{ ckState[i]=e.target.checked; saveCk(); renderChecklist(); };
    row.querySelector(".ckask").onclick = ()=>ask(c.q[LANG]);
    list.appendChild(row);
  });
  document.getElementById("progBar").style.width = (done/CHECK.length*100)+"%";
  document.getElementById("progNote").textContent = t.progress(done, CHECK.length);
}
document.getElementById("langBtn").onclick=()=>{ LANG = LANG==="en"?"ar":"en"; saveLang(); renderUI(); };

loadState().then(renderUI);
