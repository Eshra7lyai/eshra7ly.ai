Law mandates the establishment of a Personal Data Protection Center (“PDPC”) as\nthe competent authority responsible for overseeing and enforcing compliance with the law.\n\nKey Elements of the PDPL:\n • Regulates the collection, processing, storage, and transfer of personal data of Egyptian citizens, non-Egyptian\n residents, and Egyptians abroad\n\n• Ensures safeguarding of personal data against unauthorized access, misuse, or disclosure\n\n• Prescribes limitations on processing to ensure proportionate and respectful treatment of individual autonomy\n\n• Confers nine fundamental rights upon data subjects to exercise control over their personal data\n\nPDPC Roles and Responsibilities\n as the Regulatory Authority\n• Article 19 of the Personal Data Protection Law mandates the\n establishment of an economic authority, designated as the\n Personal Data Protection Center (“PDPC”).\n\n• PDPC’s mandate encompasses the development and\n enforcement of robust controls and mechanisms designed to\n govern the lifecycle of personal data, encompassing collection,\n processing, storage, transmission, dissemination, and any other\n handling of personal data, ensuring the rights of individuals and\n protecting them from any potential violations.\n\nPDPC Roles and Responsibilities as the Regulatory Authority\n\nThe PDPC has a broad range of competences to fulfill its mandate, these include but are\nnot limited to:\n 1. Issuing licenses, permits, and accreditation\n 2. Registering Data Protection Officers (DPOs) and Personal Data Protection\n Consultants\n 3. Developing and setting the necessary policies, strategic plans, and\n programs for the protection of personal data)\n 4. Developing and applying decisions, controls, measures, procedures, and\n REGULATORY standards for the protection of personal data.\n 5. Expressing opinions on draft laws and international agreements that\n regulate personal data or relate to or reflect directly or indirectly on\n personal data.\n 6. Developing a guiding framework for codes of conduct for the protection of\n personal data and adopting codes of conduct for different entities.\n 7. Establishing controls on the movement of data across borders."}, {"id": "guide-framework-002", "ref": "Egypt's Personal Data Protection Framework Overview — Introduction", "text": "PDPC Roles and Responsibilities as the Regulatory Authority\n\nThe PDPC has a broad range of competences to fulfill its mandate, these include but are\nnot limited to:\n\n1. Receiving and investigating complaints, and issuing the necessary\n COMPLIANCE & decisions thereon.\n 2. Monitoring and inspecting those subject to the provisions of the law, and\n ENFORCEMENT taking the necessary legal measures.\n\n1. Unifying policies and plans for the protection and processing of personal\n data within the Egyptian Republic.\n 2. Coordinate and cooperate with all governmental and non-governmental\n COORDINATION organizations and agencies in ensuring personal data protection measures.\n 3. Conclusion of agreements and memorandums of understanding,\n coordination, cooperation and exchange of experiences with international\n bodies.\n\nPDPC Roles and Responsibilities as the Regulatory Authority\n\nThe PDPC has a broad range of competences to fulfill its mandate, these include but are\nnot limited to:\n\n1. Supporting the development of the competence of personnel working in all\n governmental and non-governmental entities involved in the protection of\nAWARENESS & personal data.\n 2. Organizing conferences, workshops, training, and educational courses, and\n CAPACITY issuing publications to raise awareness and educate individuals and entities\n about their rights regarding the handling of personal data.\n BUILDING 3. Providing all types of expertise and consultations related to personal data\n protection.\n\nKey Provisions and\nHighlights of the PDPL &\nIts Executive Regulations\nA. Key concepts\nB. Data Processing Principles\nC. Data Subject Rights\nD. Data Users’ Obligations\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\nA. PDPL Key Concepts (PDPL article 1):\n\nPersonal Data Sensitive Personal Processing Data\n Data\n\nData Protection Personal Data\n Data Subject Data Users\n Officer(DPO) Protection\n Consultant\n\nData Users\n Understanding Your Role: Are you a controller or a processor?\n\n⦿ Controller: The controller is any natural or legal ⦿ Processor: The processor is any natural or legal\n\nperson who, by virtue of their profession or role, has person who, by virtue of their profession or expertise,\n\nthe authority to obtain personal data and determine is authorized to process personal data on behalf of\n\nthe methods, procedures, and criteria for its the controller, in accordance with an agreement and"}, {"id": "guide-framework-003", "ref": "Egypt's Personal Data Protection Framework Overview — Introduction", "text": "storage, processing, and control, in accordance under the controller's instructions.\n\nwith a specific purpose or activity.\n\n*Article 4 of the PDPL provides for the role and *Article 5 of the PDPL provides for the role and\n\nresponsibilities of the controller. responsibilities of the processor.\n\nUnderstanding Your Role: Are you a controller or a processor?\n • Sector-Specific Examples of Controllers and Processors\n\nEducation Ride hailing Health Mobile network services Social media\n\nA University's admission office is A ride-hailing service provider is A hospital is the controller when A mobile network operator is A social media platform is the\n\nthe controller when they collect the controller when they collect they collect and process the controller when they collect controller when they collect and\n\nand process personal data from and process personal data from personal health data from and process personal data from process personal data from\n\napplicants, such as names, drivers and passengers, such as patients, such as medical subscribers, such as call users, such as names, emails,\nController\n addresses, and grades, to decide names, phone numbers, and histories and test results, to records and location data, to and browsing history, to provide\n\nwho gets accepted.. locations, to facilitate rides and provide medical care and provide mobile services and services and target advertising\n\nmanage their service. manage treatment. manage accounts.\n\nA company providing student A company providing mapping A company providing medical A company providing customer A company providing content\n\ninformation systems is the and navigation services is the transcription services is the relationship management (CRM) moderation services is the\n\nprocessor when they process processor when they process processor when they process services is the processor when processor when they process\n\npersonal data of students, such location data and ride history on personal health data, such as they process personal data, personal data, such as user\nProcessor as enrollment and academic behalf of ride-hailing companies doctor-patient conversations such as customer complaints posts and comments, on behalf\n\nrecords, on behalf of schools (controllers). and medical test results, on and service requests, on behalf of social media platforms\n\n(controllers). behalf of hospitals and clinics of mobile network operators (controllers)."}, {"id": "guide-framework-004", "ref": "Egypt's Personal Data Protection Framework Overview — Introduction", "text": "(controllers). (controllers).\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\nB. Data Subject Rights (PDPL Article 2)\n\nThe PDPL establishes nine fundamental rights for data subjects\n\nRight to be Right of Withdrawal Right of\n Right of Access Right to Erasure\n Informed Rectification\n\nRight to be\n Right to Restrict Right of Portability\n Notified in case Right to Object\n of Data Breach\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\nC. Data Processing Principles (PDPL Article 3):\n\nThe PDPL sets out seven data processing principles\n\nLawfulness and\n Purpose Limitation Data Minimization Data Accuracy Storage Limitation\n Transparency\n\nIntegrity and\n Accountability\n Confidentiality\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\nD. Data Users’ Obligations (PDPL Articles 4 & 5) - (ER-PDPL Articles 3 & 4) :\n The PDPL & its Executive Regulations provide the roles and responsibilities of controllers and processors,\n some of which are presented below.\n\nApplying for the Data Breach Sensitive Personal Data\n Not disclosing\n Appointing a DPO relevant Licenses/ Obligations/Children’s\n personal data Notification\n Permits Data Obligations\n\nAppointment of a\n Cross-Border Direct Marketing VMS in public\n Representative in\n Obligations Obligations spaces Obligations\n Egypt\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\n ❑ Responsibilities in Ensuring Non-Disclosure of Personal Data, but\n not limited to:\n\n➢ Overseeing the implementation and effectiveness of policies and\nNot disclosing procedures governing the non-disclosure of personal data.\npersonal data ➢ Monitoring the application of technical and organisational security\n measures, including access controls and role-based authorization.\n ➢ Ensuring the establishment and delivery of awareness and\n training programs related to confidentiality and unauthorised\n disclosure.\n ➢ Reviewing and monitoring audit, logging, and incident reporting\n mechanisms related to personal data disclosure.\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\n ❑ Determining the Appropriate DPO for the Organisation\n\n➢ Assess the nature and sensitivity of the personal data processed\n by the organisation\nAppointing a ➢ Consider the volume of personal data.\n DPO\n ➢ Review the scope, purposes, and complexity of processing\n activities carried out\n ➢ Based on the above assessment, determine which category of\n DPO is appropriate to serve the organisation\n ➢ Ensure that the appointed DPO’s qualifications and role are\n proportionate to the organisation’s data processing risks and\n obligations"}, {"id": "guide-framework-005", "ref": "Egypt's Personal Data Protection Framework Overview — Introduction", "text": "Key Provisions and Highlights of the PDPL & its Executive\n Regulations\n ❑ Requirements for DPO Appointment\n\n➢ The DPO role shall be explicitly reflected in the entity's organizational chart.\n\n➢ To ensure independence, the DPO shall report directly to the highest management level.\nAppointing a\n DPO ➢ The DPO may be engaged through an employment agreement or a service contract.\n\n➢ The DPO may be an existing employee, a new hire, or an external appointment. Where a\n single DPO is intended to serve multiple controllers, approval from the PDPC and all\n relevant controllers is mandatory\n\n➢ The DPO can be an existing employee of the organization, and they may continue to\n perform their previous duties alongside the DPO role so long as the condition of\n independence is met and that the PDPC has approved the role during the registration\n process.\n ➢ The DPO can be either an Egyptian national or a foreigner, but they must be registered\n with the PDPC in order to serve in this role.\n\n➢ The DPO must be independent and should not be involved in decision-making regarding\n processing activities relevant to personal data.\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\n ❑ DPO Categories in PDPC Registry\n PDPC Registry recognizes three categories of DPOs:\n\nAppointing a\n DPO\n Category A (Lead DPO) Category B (Advanced Category C (Entry-\n\nDPO) Level DPO)\n\nHighly experienced DPOs with Competent DPOs with solid Entry-level DPOs with\n\nadvanced expertise in data knowledge and practical foundational knowledge in data\n\nprotection experience in data protection or protection or a related field\n\na related field\n\nPDPC will categorize DPOs based on existing certifications, such as those offered by the International Association of Privacy\nProfessionals (IAPP) and other reputable international organizations, as well as its exams for each category.\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\n ❑ Licensing Obligations When Processing Personal Data\n\n➢ Where an entity processes personal data, it shall obtain the license/permit for\n processing personal data as a controller and/or processor, which constitutes the\n mandatory and core license in all cases.\n ➢ The entity shall assess the need to obtain additional licenses/permits, such as:\n Applying for the • Direct electronic marketing\nrelevant Licenses/ • Cross-border transfer of personal data\n Permits • Use of visual surveillance systems in public places\n ➢ The entity shall assess the volume of personal data records processed to determine\n the applicable license or permit category. (1 record = 1 Data Subject)\n ➢ The entity shall determine whether the processing activity is occasional or ongoing,\n where:\n • Occasional processing activities require a permit;\n • And ongoing processing activities require a license.\n ➢ The entity shall ensure the appointment of a Data Protection Officer (DPO) as a\n prerequisite for obtaining the relevant license or permit.\n ➢ Prior to submitting any license or permit application, the entity should implement a\n data protection compliance plan to assess its compliance with the provisions of the\n Law and its Executive Regulations."}, {"id": "guide-framework-006", "ref": "Egypt's Personal Data Protection Framework Overview — Introduction", "text": "Key Provisions and Highlights of the PDPL & its Executive\n Regulations\n ❑ Where an entity does not have an establishment within the Arab Republic of\n Egypt and processes personal data relating to Egyptian data subjects or\n data subjects resident in Egypt, such entity shall appoint a legal\nAppointment of a representative in Egypt.\nRepresentative in\n Egypt\n ❑ Data Users may choose among several forms of representations through\n existing legal entities, offices and/or individuals, provided that the\n designation is submitted to PDPC for examination and approval.\n\n❑ The approved legal representative shall act as the entity’s official interface\n with PDPC.\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\n ❑ Risk Assessment and Impact Analysis\n ➢ Assess the nature of the breach or violation, the type of personal data affected,\n and the potential risks and impacts on data subjects.\n\n❑ Incident Response Plan Activation\n ➢ Activate the approved incident response procedures to contain the breach,\nData Breach mitigate its effects, and document corrective and security measures taken.\nNotification\n ❑ Breach Awareness and Notification\n ➢ Notify PDPC within seventy-two (72) hours from the date of becoming aware of\n the breach.\n ➢ Where the breach is related to national security considerations or the entities\n responsible therefor, notification to PDPC shall be made immediately.\n ➢ Data subjects shall be notified within three (3) working days from the date of\n notifying PDPC\n\n❑ Post-Incident Measures and Follow-Up\n ➢ Implement remedial and preventive measures, update internal controls and\n procedures, and retain documentation related to the breach, notifications, and\n corrective actions.\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\n ❑ Obligations When Processing Sensitive Personal Data\n\n➢ The controller shall obtain explicit written consent when processing\n sensitive personal data.\n ➢ Explicit consent can be obtained in physical or electronic form.\nSensitive Personal Data\n Obligations/Children’s ❑ Obligations When Processing Children’s Personal Data\n Data Obligations\n ➢ Children under 15 years of age: The controller shall obtain the\n explicit written consent of the parent or legal guardian prior to\n collecting or processing the child’s personal data, and such consent\n shall clearly specify the purpose and duration of the processing."}, {"id": "guide-framework-007", "ref": "Egypt's Personal Data Protection Framework Overview — Introduction", "text": "➢ Children aged 15 to 18 years: They may submit to the controller the\n explicit written consent of the legal guardian for the collection and\n processing of their personal data, and such consent shall clearly\n specify the purpose and duration of the processing.\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\n ❑ Articles 14, 15, and 16 of the PDPL, as well as Article 16 of the ER-PDPL, stipulate the\n requirements and conditions for the legitimate transfer of personal data across international\n borders.\n\n❑ Key Requirement:\nCross-Border ▪ Identify the categories of personal data transferred, distinguishing between data in transit\n Obligations and data at rest, and mapping transfer routes, recipients, and locations.\n ▪ Perform a Transfer Impact Assessment (TIA) covering risks to data subjects and the\n adequacy of safeguards.\n ▪ Assess the data protection framework of the destination jurisdiction, including the\n existence of a data protection authority and applicable data protection legislation.\n ▪ Assess the recipient entity and any dependent or affiliated entities to ensure compatibility\n in joint or integrated processing operations and the existence of a legitimate interest for\n the parties and/or the data subject.\n ▪ Ensure the availability of effective remedial measures and enforceable rights for data\n subjects in the destination jurisdiction.\n ▪ Ensure the application of appropriate technical and organisational security measures for\n cross-border personal data transfers.\n ▪ Ensure contractual arrangements governing the cross-border transfer are in place in a\n manner that ensures compliance with the PDPL and its Executive Regulation.\n ▪ Prior authorisation or approval from PDPC is required (License/Permit)\n\nPursuing Adequacy and Alternative Mechanisms for Secure\n Cross-Border Data Transfers\n\nAdequacy Decision Appropriate Safeguards\n\n1. Standard Contractual Clauses (SCCs): Approved clauses\n by PDPC.\n Adequacy decision refers to a formal determination that a country, 2. Binding Corporate Rules (BCRs): Regulations adopted by\n territory, sector, or organization provides a sufficient level of multinational businesses, enabling group international data\nCross- Border Data protection for personal data, enabling the transfer of data without transfers while ensuring consistent data protection levels.\n additional safeguards.\n Transfers 3. Agreements: Agreements for cross-border data transfers\n between entities. Examples: Data processing agreements,\n Mechanisms PDPC will maintain a whitelist of countries deemed to have an data transfer agreement ..etc.\n adequate level of personal data protection, equivalent to that of 4. Codes of Conduct: Approved codes of conduct created by\n Egypt. This whitelist will facilitate the transfer of personal data associations and businesses, specifying PDPL application and\n between Egypt and these countries, without the need for additional cross-border data transfer procedures.\n safeguards."}, {"id": "guide-framework-008", "ref": "Egypt's Personal Data Protection Framework Overview — Introduction", "text": "Key Provisions and Highlights of the PDPL & its Executive\n Regulations\n\n❑ Articles 17 and 18 of the PDPL, as well as Article 18 of the\n ER-PDPL, stipulate the requirements and conditions for\n\nDirect Marketing legitimate Electronic Digital Marketing practices.\n Obligations\n ❑ Key Requirements:\n ▪ Prior authorization or approval from PDPC is required\n (License/Permit)\n ▪ Explicit Consent\n ▪ Easy Withdrawal Mechanisms\n ▪ Transparency\n\nKey Provisions and Highlights of the PDPL & its Executive\n Regulations\n ❑ Pursuant to Article 26 of the PDPL, any entity operating a visual surveillance\n system that processes personal data is required to obtain a license or permit\n from the PDPC. In this context, Article 31 of the ER-PDPL governs the lawful,\n controlled, and licensed use of visual surveillance systems in public places.\n\nVMS in public\nspaces Obligations ❑ Key Requirement:\n ▪ Prior authorization or approval from PDPC is required (License/Permit)\n ▪ Prior approvals from competent authorities must be obtained.\n ▪ A clear and visible notice of the use of visual surveillance systems must be\n provided.\n ▪ Processing or transfer of surveillance data outside Egypt is prohibited,\n except for legally prescribed reasons.\n ▪ There must be a lawful basis or explicit consent of the data subject for the\n use of facial recognition or similar technologies.\n ▪ Confidentiality and security measures must be implemented to prevent\n unauthorised use, disclosure, or access to recordings.\n ▪ Exemption applies to private residential premises, provided surveillance\n does not extend beyond the premises.\n\nCompliance Toolkit Overview\n1. Establishing Compliance Foundations\n\n• Conducting a Readiness Assessment\n • Understanding Your Role: Are you a controller or a processor?\n • Appointing a Data Protection Officer (DPO)\n\n2. Compliance with Key Provisions\n\n• Data Processing Principles\n • Lawful Basis\n • Consent Management\n • Cross-Border Data Transfers\n • E-Marketing\n • Visual Monitoring Systems (VMS)\n • Breach Notification\n • Data Subject Requests\n • Cloud Computing and Data Centers\n\n3. Operationalizing Data Protection\n\n• A Structured Approach to Privacy Management: Assess, Protect, Sustain, Respond\n\nCompliance Starts Here!\n ✓ Identify and document the personal data collected\n ✓ The purpose of the collection\n ✓ The level of control exerted over its processing\n ✓ Review responsibilities and obligations under the PDPL, ER, and PDPC guidelines\n ✓ Conduct a gap analysis"}, {"id": "guide-framework-009", "ref": "Egypt's Personal Data Protection Framework Overview — Introduction", "text": "Launch of License/ Permit Application Services via the PDPC Portal\n\n✓ Access the Personal Data Protection Center’s website at pdpc.gov.eg\n ✓ Create an account on the portal\n ✓ Select and initiate the relevant service\n ✓ Complete the required questionnaire\n ✓ Appoint a Data Protection Officer (DPO)\n ✓ Submit the application together with all required supporting documents\n\nApplication for Accreditation as Data Protection Consultant (DPC) / Data\n Protection Officer (DPO)\n\nLaunch of DPC/ DPO Accreditation Application Services via the PDPC Portal\n\n➢ Data Protection Officer (DPO) Accreditation:\n ✓ Create an account on the portal\n ✓ Select the relevant category\n ✓ Complete the category-specific examination\n ✓ Request the DPO registration service\n ✓ Select the category for registration\n ✓ Upload the required supporting documents\n ✓ Submit the application\n\n➢ Personal Data Protection Consultant (DPC) Accreditation:\n ✓ Create an account on the portal\n ✓ Select the Personal Data Protection Consultant (DPC) accreditation service\n ✓ Submit the required documents"}, {"id": "law-promulgation-001", "ref": "Promulgation Article 1", "text": "The provisions of this law and the annexed law shall apply to the protection of personal data processed\nelectronically, in part or in whole, by any holder, controller, or processor in relation to natural persons."}, {"id": "law-promulgation-002", "ref": "Promulgation Article 2", "text": "The provisions of this law and the annexed law shall apply to whoever commits any of the violations stipulated in the\nannexed law if the offender is an Egyptian residing inside or outside the Arab Republic of Egypt, a non-Egyptian\nresiding inside the Arab Republic of Egypt, or a non-Egyptian outside the Arab Republic of Egypt provided that the\nact is punishable under any legal form in the country where it occurred, and the data subject of the crime belongs to\nEgyptians or foreigners residing inside the Arab Republic of Egypt."}, {"id": "law-promulgation-003", "ref": "Promulgation Article 3", "text": "The provisions of the annexed law shall not apply to the following:\n 1. Personal data of third parties which is held by natural persons and processed for personal use.\n 2. Personal data which is processed for the purpose of obtaining official statistical data, or in application of a\n legal provision.\n 3. Personal data which is processed exclusively for media purposes, provided that it is true and accurate, and\n not used for any other purpose, without prejudice to the laws governing the press and media.\n 4. Personal data relating to judicial records, investigations, and lawsuits.\n 5. Personal data which is held by the national security authorities, and whatever determined by them for other\n considerations. Upon the request of national security authorities, the Center shall notify the controller or the\n processor to modify, delete, hide, make available, or circulate personal data within a specified period,\n according to national security considerations. The controller or processor shall comply with the notification\n within the specified period therein.\n 6. Personal data which is held by the Central Bank of Egypt and entities subject to its control and supervision,\n with the exception of money transfer companies and currency exchange companies, provided that the rules\n set out by the Central Bank of Egypt in relation to handling personal data are observed."}, {"id": "law-promulgation-004", "ref": "Promulgation Article 4", "text": "The Minister of Telecommunications and Information Technology shall issue the executive regulations of the\nannexed law (the “Executive Regulations”) within six (6) months from the effective date of this law."}, {"id": "law-promulgation-005", "ref": "Promulgation Article 5", "text": "The economic courts shall have jurisdiction over committed violations to the provisions of the annexed law."}, {"id": "law-promulgation-006", "ref": "Promulgation Article 6", "text": "The addressees by the provision of this law shall reconcile their positions and comply with the provisions of the\nannexed law and the Executive Regulations within one (1) year from the date of issuance of the Executive\nRegulations."}, {"id": "law-promulgation-007", "ref": "Promulgation Article 7", "text": "This law shall be published in the Official Gazette and shall come into force after three (3) months from the following\nday of its publication.\nThis law shall be stamped with the seal of the State and be enforced as one of its laws.\nIssued at the Presidency on July 13, 2020.\nAbdel-Fatah El-Sisi"}, {"id": "law-pdpl-001", "ref": "Law Article 1", "text": "In the application of the provisions of this Personal Data Protection Law (“Law”), the following terms shall have the\nmeaning ascribed to them:\n“Personal Data”: shall mean any data relating to an identified natural person, or one who can be identified directly\nor indirectly by way of linking such personal data and other data such as name, voice, picture, identification number,\nonline identifier, or any data which determines the psychological, medical, economic, cultural or social identity of a\nnatural person.\n“Processing”: shall mean any electronic or technological operation to write, collect, record, save, store, merge,\ndisplay, send, receive, circulate, publish, erase, change, edit, retrieve, or analyze personal data using any electronic\nor technological medium whether partially or wholly.\n“Sensitive Personal Data”: shall mean data which discloses psychological, mental, or physical health, or genetic,\nbiometric or financial data, religious beliefs, political views, or criminal records. In all cases, data relating to children\nis considered to be sensitive personal data.\n“Data Subject”: shall mean any natural person to whom electronically processed personal data is attributed which\nidentifies him/her legally or factually and enable his/her identification from any other person.\n“Holder”: shall mean any natural or juristic person, legally or factually, holds and retains personal data in any\nmanner, or by any means of storage, regardless of whether that person initially created such personal data or was\ntransferred to such person by any means.\n“Controller”: shall mean any natural or juristic person who has - by virtue of the nature of their activities - the right\nto obtain Personal Data and to specify the method and criteria of retaining, Processing or controlling such data\naccording to a specific purpose or to their activities.\n“Processor”: shall mean any concerned natural or juristic person, by virtue of the nature of its work, to process\nPersonal Data for its own benefit or on behalf of the Controller as agreed with and instructed by the Controller.\n“Disclosing Personal Data”: shall mean any means which make Personal Data known to others such as by way of\nviewing, circulating, publishing, transferring, using, displaying, sending, receiving, or disclosing Personal Data.\n“Data Security”: shall mean technological and organizational procedures and operations the purpose of which is to\nprotect the privacy, secrecy, safety, unity, and completeness of Personal Data.\n“Personal Data Infringement”: shall mean any unauthorized or illegal access to Personal Data, or any other\nillegitimate operation to reproduce, send, distribute, exchange, transfer, or circulate which aims to expose or\ndisclose such Personal Data, or damage or edit the same while being stored, transferred or processed.\n“Cross-Border Personal Data Transfer”: shall mean to transfer, make available, record, store, circulate, publish, use,\ndisplay, send, receive, retrieve or process Personal Data from inside the Arab Republic of Egypt to outside or vice\nversa.\n“Electronic Marketing”: shall mean sending any message, statement, or advertisement or marketing content, via\nany technological means, which aims, directly or indirectly, to promote goods, services or commercial, political,\nsocial, or charitable petitions or requests, addressed to specific persons.\n“National Security Authorities”: shall mean the Presidency, Ministry of Defense, Ministry of Interior, the General\nIntelligence Directorate, and the Administrative Control Authority.\n\n \n\n“Center”: shall mean the Personal Data Protection Center.\n“License”: shall mean an official document issued by the Center to the juristic person whereby it is granted the right\nto practice the activity of collecting, storing, transferring, or Processing electronic Personal Data or to undertake\nElectronic Marketing activities, or all the aforementioned activities and dealing with them in any way. Said document\ndetermines the obligations of the licensee in accordance with the rules, conditions, procedures, and technical\ncriteria set out in the Executive Regulations of this Law, and shall be issued for a period of three (3) years, which is\nrenewable for other periods.\n“Permit”: shall mean an official document issued by the Center to the natural or juristic person whereby it is granted\nthe right to practice the activity of collecting, storing, transferring or Processing electronic Personal Data or to\nundertake Electronic Marketing activities, or all the aforementioned activities and dealing with them in any way, or\nto carry out certain task(s). Said document determines the obligations of the permit holder in accordance with the\nrules, conditions, procedures, and technical criteria set out in the Executive Regulations, and shall be issued for a\ntemporary period not exceeding one (1) year, which may be renewed for more than one period.\n“Certification”: shall mean a certificate issued from the Center indicating that the natural or juristic person has\nsatisfied all technical, legal, and organizational requirements set out in the Executive Regulations of this Law,\nwhereby it is qualified to provide consultancy services in the field of Personal Data Protection.\n“Competent Minister”: shall mean the Minister of Telecommunications and Information Technology."}, {"id": "law-pdpl-002", "ref": "Law Article 2", "text": "Personal Data may not be collected, Processed, disclosed, or revealed by any means except with the explicit consent\nof the Data Subject or where otherwise permitted by law.\nThe Data Subject shall have the following rights:\n 1. to know, review and access/ obtain his/her own Personal Data, which is in possession of any Holder,\n Controller or Processor;\n 2. to withdraw the prior consent concerning the retention or Processing of his/her Personal Data;\n 3. to correct, edit, delete, add or update his/her Personal Data;\n 4. to limit the Processing to a specified purpose;\n 5. to be notified with any infringement to his/her Personal Data; and\n 6. to object to the Processing of Personal Data or its results whenever the same contradicts the Data Subject’s\n fundamental rights and freedom.\nWith exception to item (5) of the above paragraph, the Data Subject shall pay the consideration for the service\nprovided to him/her by the Controller or the Processor with respect to his/her exercise of said rights. The Center\nshall issue decisions to determine such consideration which shall not exceed EGP 20,000 (twenty thousand Egyptian\npounds)."}, {"id": "law-pdpl-003", "ref": "Law Article 3", "text": "In order to be able to collect, process, and retain Personal Data, the following conditions must be satisfied:\n 1. Personal Data shall be collected for legitimate, specific, and transparent purposes to the Data Subject.\n 2. Personal Data shall be correct, valid, and secured.\n 3. Personal Data shall be processed in a legitimate manner and in compliance with the purposes for which it is\n being collected.\n 4. Personal Data shall not be retained for a period longer than that is necessary for the fulfilment of the purpose\n thereof.\n\nThe Executive Regulations of this Law shall specify the policies, procedures, regulations, and standard criteria for\ncollecting, Processing, storing, and securing of such data."}, {"id": "law-pdpl-004", "ref": "Law Article 4", "text": "Without prejudice to Article (12) of this Law, the Controller shall:\n 1. obtain or receive the Personal Data from the Holder or the competent entities which provide such data, as the\n case maybe, after obtaining the Data Subject’s consent or where otherwise permitted by law;\n 2. ensure the validity, conformity and sufficiency of the Personal Data with the purpose of its collection;\n 3. set the method, manner, and standards for Processing pursuant to the designated purpose, unless the\n Processor has been delegated in this respect by virtue of a written agreement;\n\n \n\n 4. ensure the applicability of the specified purpose for the collection of the Personal Data for Processing\n objectives;\n 5. undertake or refrain from undertaking an action which would result in Disclosing Personal Data except in the\n cases permitted by law;\n 6. adopt all technical and regulatory procedures and applying the necessary standard criteria for protecting the\n Personal Data and ensuring its confidentiality, and preventing any hack, damage, alteration or manipulation\n through any illegitimate procedure;\n 7. delete any Personal Data at the Controller’s possession upon the satisfaction of the designated purpose.\n However, in case of retention of such data for any legitimate reason after the satisfaction of its purpose, the\n data shall be retained in a form that does not allow the identification of the Data Subject;\n 8. correct any error in the Personal Data immediately upon being notified or aware of such error;\n 9. maintain record of Personal Data, provided that it shall include the description of the categories of Personal\n Data in its possession and determining persons to whom such data shall be disclosed or made available along\n with the basis, duration, restrictions, and scope thereof as well as the mechanisms of deleting or modifying the\n Personal Data, or any other relevant data related to the Cross-Border Personal Data Transfer. The record shall\n also include description of the technical and regulatory procedures for Data Security;\n 10. obtain a License or Permit from the Center to handle Personal Data;\n 11. Controller outside of the Arab Republic of Egypt is required to appoint a representative in the Arab Republic of\n Egypt in accordance with the Executive Regulations; and\n 12. provide the necessary means to prove its abidance with the provisions of this Law and enable the Center to\n conduct inspections and supervision to ensure the same.\nIn case there are several Controllers, each Controller shall abide by all the obligations stipulated in this Law, and the\nData Subject may exercise his/her rights towards each Controller separately.\nThe executive regulations shall specify the policies, procedures, regulations, and technical criteria for such\nobligations.\n Second: Processor Obligations"}, {"id": "law-pdpl-005", "ref": "Law Article 5", "text": "Without prejudice to Article (12) of this Law, the Processor of Personal Data shall:\n 1. conduct and implement Processing pursuant to this Law and its Executive Regulation, in accordance with the\n legitimate and legal cases, and based on the written instructions which are received from the Center, the\n Controller or from any relevant person as the case may be, and in particular, with respect to the scope, subject\n and nature of Processing, and the type of Personal Data and its conformity and sufficiency with the designated\n purpose;\n 2. ensure the legitimacy of the purpose of Processing and the practice thereof and the non-violation to public\n order or morals;\n 3. not exceed the purpose and period of Processing, and notify the Controller, the Data Subject or each relevant\n person, as the case may be, with the period necessary for Processing;\n 4. delete the Personal Data following the lapse of the Processing’s period or deliver the same to the Controller;\n 5. undertake or refrain from undertaking an action, which would result in Disclosing the Personal Data or\n availability of Processing results except in the cases permitted by law ;\n 6. not undertake any Processing of Personal Data that contradicts the purpose or the activity of the Controller\n unless such Processing is for a statistical or educational purpose which shall be not-for-profit and without\n prejudice to the inviolability of private life;\n 7. protect and secure the Processing activity and the mediums and the electronic devices used in Processing, as\n well as the Personal Data thereon;\n\n \n\n 8. avoid any direct or indirect harm to the Data Subject;\n 9. prepare a record for the Processing activities, provided that it includes the Processing categories undertaken on\n behalf of any Controller, its contact details, its Data Protection Officer, the period, restrictions, and scope of\n Processing, the mechanisms for deleting or modifying the Personal Data, and a description of the technical and\n organizational procedures related to the Data Security and the Processing activities;\n 10. provide the means to prove its abidance with the provisions of this Law, upon the request of the Controller, and\n enable the Center to conduct inspections and supervision to ensure its compliance with the same;\n 11. obtain a License or a Permit from the Center in order to handle Personal Data; and\n 12. Processors outside of the Arab Republic of Egypt are required to appoint a representative in the Arab Republic\n of Egypt in accordance with the Executive Regulations.\nIn case there are several Processors, each Processor shall abide by all the obligations stipulated under this Law\nunless there is an agreement setting out the obligations and liabilities of each Processor clearly.\nThe Executive Regulations shall specify the policies, procedures, regulations, conditions, instructions and standard\ncriteria for such obligations.\n\n Third: Processing Conditions"}, {"id": "law-pdpl-006", "ref": "Law Article 6", "text": "Electronic Processing shall be considered legitimate and legal in case it satisfies one of the following conditions:\n 1. it is carried out upon the Data Subject’s consent for the achievement of certain purpose(s);\n 2. It is necessary and intrinsic for the performance of a contractual obligation or legal action, the execution of\n an agreement for the benefit of the Data Subject, or the undertaking of any procedure with respect to\n claiming or defending the Data Subject's legal rights;\n 3. It is necessary for performing a legal obligation or an order issued by the competent investigation authorities\n or it is based upon a judicial ruling; or\n 4. It is necessary for enabling the Controller to perform its obligations or any relevant person to practice its\n legitimate rights unless the same contradicts the Data Subject’s fundamental rights and freedom.\n\n Fourth: Obligation to Notify and Inform"}, {"id": "law-pdpl-007", "ref": "Law Article 7", "text": "Each of the Controller and the Processor, as the case may be, shall notify the Center with any Personal Data\nInfringement, within seventy-two (72) hours of such infringement. In the event that such infringement relates to\nnational security protection concerns, the notification shall be immediate. In all events, the Center shall immediately\nnotify the National Security Authorities with the infringement and provide them, within seventy-two (72) hours from\nbeing aware of the Infringement, with the following:\n 1. description of the nature of the infringement, the form and the reasons thereof as well as the approximate\n number of Personal Data and their records;\n 2. the information of the Data Protection Officer;\n 3. the potential consequences of the infringement;\n 4. description of the procedures which have been followed and the proposed procedures to be adopted in order\n to minimize the negative impacts of the infringement;\n 5. evidence of documenting any Personal Data Infringement and the corrective actions which have been taken\n to solve the same; and\n\n \n\n 6. any documents, information or data requested by the Center.\nIn all events, Controller and Processor, as the case may be, shall notify the Data Subject within three (3) days from\nthe date of notifying the Center, with the infringement and the adopted procedures related thereto.\nThe Executive Regulations of this Law shall determine the procedures relating to the obligation to notify and inform."}, {"id": "law-pdpl-008", "ref": "Law Article 8", "text": "The Center shall set a register for the information of Data Protection Officers. The Executive Regulations shall\ndetermine the conditions, procedures and mechanisms of registration.\nThe legal representative of the juristic person, with respect to any Controller or Processor, shall appoint a competent\nemployee to be responsible for the protection of Personal Data, inside its legal entity and among its personnel\nstructure. Said employee shall be registered in the register designated for the Data Protection Officers at the Center\nand such appointment shall be announced. (“Data Protection Officer”)\nController or Processor who is natural person, shall be the one in-charge of the application of the provisions of this\nLaw.\n Second: Data Protection Officer Obligations"}, {"id": "law-pdpl-009", "ref": "Law Article 9", "text": "The Data Protection Officer shall be responsible for the application of the provisions of this Law, its Executive\nRegulations, and the decisions of the Center, as well as supervising and monitoring the applicable procedures within\nits relevant entity and receiving requests related to Personal Data, according to the provisions of this Law.\nThe Data Protection Officer shall, in particular, undertake the following:\n1. Perform a regular evaluation and inspection of the Personal Data protection systems and avoid infringement\n thereto and document the results of such evaluation and issue the recommendations necessary for its\n protection.\n2. Act as a point of contact person with the Center and implement its decisions, with respect to the application\n of the provisions of this Law.\n3. Enable the Data Subject to practice the rights stipulated under this Law.\n4. Notify the Center with the existence of any Personal Data Infringement.\n5. Reply to the requests submitted by the Data Subject or any relevant person and reply to the complaints filed\n by them to the Center.\n6. Follow-up the registration and updating of the Personal Data’s record which is maintained by the Controller,\n or the Processing activities’ record which is maintained by the Processor, to guarantee the accuracy of the\n data and information recorded therein.\n7. Eliminate any violations related to Personal Data within its entity and take the corrective actions related\n thereto.\n8. Organize the necessary training programs for the employees within its entity to qualify them in accordance\n with the requirements of this Law.\nThe Executive Regulations of this Law shall specify the obligations, procedures, and other tasks that the Data\nProtection Officer shall perform."}, {"id": "law-pdpl-010", "ref": "Law Article 10", "text": "Controller, Processor or Holder shall, whenever it is requested to disclose Personal Data, comply with the following\nprocedures:\n1. The request shall be written and submitted by the relevant person or according to a legal deed;\n2. Controller, Processor or Holder shall ensure the fulfillment of required documents to grant the access to the\n Personal Data and retain such documents;\n3. The decision regarding the disclosure and its supporting documents shall be made within six (6) working days as\n of the date of its submission. In case the request is rejected, the decision shall include the rejection’s\n justification. The lapse of the mentioned period without any decision shall be considered a rejection."}, {"id": "law-pdpl-011", "ref": "Law Article 11", "text": "Digital evidence derived from Personal Data pursuant to the provisions of this Law, shall have the same\ndeterminative effect of the evidence derived from written data and information, provided that it fulfils the criteria\nand technical conditions outlined in the Executive Regulations."}, {"id": "law-pdpl-012", "ref": "Law Article 12", "text": "The Controllers and Processors, whether a natural or juristic person, are prohibited from collecting, transferring,\nstoring, saving, Processing or disclosing Sensitive Personal Data except by virtue of a license issued from the Center.\nWith exception to the cases authorized by law, Controller or Processor must obtain the explicit written consent of\nthe Data Subject.\nIn case of undertaking any of the above activities in relation to children data, the legal guardian’s consent shall be\nobtained.\nThe participation of a child in a game, competition or any other activity shall not be conditional on the submission of\nthe child’s Personal Data more than what is necessary for participation therein.\nThe foregoing shall be applied in accordance with the criteria and regulations set out in the Executive Regulation."}, {"id": "law-pdpl-013", "ref": "Law Article 13", "text": "In addition to the obligations mentioned in Article (9) of this Law, the Data Protection Officer of the Controller or the\nProcessor shall follow and implement the security policies and procedures necessary for avoiding any breach or\ninfringement of Sensitive Personal Data."}, {"id": "law-pdpl-014", "ref": "Law Article 14", "text": "Transfer of Personal Data which is collected or prepared for Processing, to a foreign country, or its storage or sharing\nmay only be undertaken if the level of data protection or security in the foreign country meets (or exceeds) the\nrequirements stipulated under this Law, and subject to obtaining a relevant License or Permit from the Center.\n\n \n\nThe Executive Regulations of this Law shall set out the policies, criteria, regulations and rules necessary for\ntransferring, storing, sharing, Processing or disclosing Personal Data across borders and the protection thereof."}, {"id": "law-pdpl-015", "ref": "Law Article 15", "text": "Notwithstanding Article (14) of this Law, if the explicit consent of the Data Subject or his representative is obtained,\ntransferring, sharing, circulating or Processing Personal Data may take place without the required minimum\nprotection level stipulated in the previous article, in the following cases:\n 1. To preserve the life of the Data Subject and provide him/her with medical care or treatment or the\n management of health services.\n 2. To perform obligations in order to ensure that a right is proven, exercised or defended before the judiciary.\n 3. To conclude an agreement or execute an agreement already concluded or, to be concluded, between the\n Processor and third party, for the benefit of the Data Subject.\n 4. To perform a procedure relating to international judicial cooperation.\n 5. There is legal necessity or obligation to protect the public interest.\n 6. To transfer money to another country pursuant to the laws in force of that country.\n 7. If the transfer or circulation is pursuant to a bilateral or multilateral international agreement to which Egypt\n is a party."}, {"id": "law-pdpl-016", "ref": "Law Article 16", "text": "Controller or Processor, as the case may be, may disclose Personal Data to another Controller or Processor outside\nthe Arab Republic of Egypt by virtue of a License from the Center provided that the following conditions are met:\n 1. if there is conformity between the nature of work of each of the Controllers or Processors, or unity of the\n purpose for which they obtain the Personal Data;\n 2. if each of the Controllers, the Processors, or the Data Subject, have a legitimate interest in the Personal\n Data; and\n 3. the level of legal and technical protection of the Personal Data provided by the Controller or the Processor\n abroad shall not be less than the level of protection provided in the Arab Republic of Egypt.\nThe Executive Regulations of this Law shall determine the necessary conditions, procedures, precautions, criteria,\nand rules in this regard."}, {"id": "law-pdpl-017", "ref": "Law Article 17", "text": "Any electronic communication for the purpose of direct marketing to the Data Subject shall be prohibited unless the\nfollowing conditions are met:\n 1. obtaining the consent of the Data Subject;\n 2. the communication shall include the identity of the sender;\n 3. the sender shall have a valid and complete address to be reached;\n 4. a clear indication that the purpose of communication is for direct marketing; and\n 5. setting clear and uncomplicated mechanisms to allow the Data Subject to opt-out or withdraw his/her consent\n in relation thereto."}, {"id": "law-pdpl-018", "ref": "Law Article 18", "text": "The sender of any electronic communication for the purpose of direct marketing shall:\n\n \n\n 1. specify a defined marketing purpose;\n 2. not disclose the contact details of the Data Subject; and\n 3. maintain electronic records evidencing the consent of the Data Subject to receive Electronic Marketing\n communication and any amendments thereof, or his/her non-objection to its continuity for a duration of\n three (3) years from the date the last communication.\nThe Executive Regulations shall set forth the necessary rules, conditions, and regulations related to direct Electronic\nMarketing."}, {"id": "law-pdpl-019", "ref": "Law Article 19", "text": "A public economic authority shall be established under the name of \"Personal Data Protection Center\" and will be\naffiliated to the Competent Minister and shall have a juristic personality. Its headquarters shall be located in Cairo or\nin one of its adjacent governorates. The Center is tasked with the overall mandate of protecting Personal Data and\nregulating Processing and availability. It shall practice all the competences stipulated under this Law for the purpose\nof achieving its objectives. Particularly, the Center is responsible for:\n − setting and developing the policies, strategic plans, and programs necessary for protecting Personal Data\n and the execution thereof;\n − unifying the policies and plans for protecting and Processing Personal Data within the Arab Republic of\n Egypt;\n − setting and applying the decisions, regulations, precautions, procedures, and criteria related to the\n protection of Personal Data;\n − setting a guidance framework for the codes of conduct related to the protection of Personal Data and\n approving the codes of conduct of different entities;\n − organizing and cooperating with all the entities, governmental and non-governmental bodies in\n guaranteeing Personal Data protection measures and connecting with all related initiatives;\n − supporting the development of the competence of the personnel working in all governmental and non-\n governmental entities who are competent with the protection of Personal Data;\n − issuing licenses, permits, certifications and various measures related to the protection of Personal Data and\n application of the provisions of this Law;\n − Issuing the Certification to entities or individuals and granting them the required permits to provide\n consultation in relation to Personal Data’s protection measures;\n − receiving complaints and communications related to the provisions of this Law and issuing the necessary\n decisions in this regard;\n − advising on draft laws and international agreements which are related to, regulating, or affecting the\n Personal Data directly or indirectly;\n − controlling and inspecting the addressees of the provisions of this Law and taking the necessary legal\n procedures;\n − verifying the conditions of Cross-Border Personal Data Transfer and issuing the decisions regulating the\n same;\n − organizing conferences, workshops, training and educational courses and issuing publications in order to\n raise awareness and to educate individuals and entities on their rights in relation to the Personal Data;\n − providing all types of expertise and consultations related to the protection of Personal Data, in particular to\n the investigation and judicial authorities;\n\n \n\n − entering into agreements and memoranda of understanding, coordinating, cooperating, and exchanging\n knowledge, with international entities which are relevant to the Center's work, in accordance with the rules\n and regulations set forth in this regard;\n − issuing special patrols to update the Personal Data protection measures, in accordance with the activities of\n different sectors and with the Center's recommendations; and\n − preparing and issuing an annual report on the status of Personal Data protection in the Arab Republic of\n Egypt."}, {"id": "law-pdpl-020", "ref": "Law Article 20", "text": "The Center shall have a board of directors (the “Board”) chaired by the Competent Minister and comprise the\nmembership of each of the following:\n 1. A representative of the Ministry of Defense appointed by the Minister of Defense;\n 2. A representative of the Ministry of Interior appointed by the Minister of the Interior;\n 3. A representative of the General Intelligence Service appointed by the Head of the Agency;\n 4. A representative of the Administrative Control Authority appointed by the Chairman of the Authority;\n 5. A representative of the Information Technology Industry Development Agency (ITIDA) appointed by the\n Chairman of the Board of Directors of the Agency;\n 6. A representative of the National Telecommunications Regulatory Authority (NTRA) appointed by the\n Chairman of the Authority;\n 7. The Center's Chief Executive Officer; and\n 8. Three (3) experts appointed by the Competent Minister.\nThe Board’s membership tenure shall be three (3) years and renewable. A decree shall be issued by the Prime\nMinister regarding the formation of the Board and determination of the financial remunerations of the members.\nThe Board may form amongst its members, one or more committees assigned to them on a temporary basis some\ntasks. The Board may delegate the Chairman of the Board or the Chief Executive Officer of the Center in some of its\ncompetencies."}, {"id": "law-pdpl-021", "ref": "Law Article 21", "text": "The Board of the Center is the dominant authority over its affairs and practice of its competencies. It may take\nwhatever decisions it deems necessary in pursuance of the purposes of the Center, the Law and its Executive\nRegulations. In particular, the Board may:\n - adopt the necessary policies, strategic plans, and programs for the protection of Personal Data;\n - approve the regulations, controls, measures, and standards for the protection of Personal Data;\n - approve international cooperation and knowledge exchange plans with international entities and organizations;\n - approve the organizational structure, the financial, administrative and human resources regulations, and the\n annual budget of the Center;\n - approve the establishment of offices or branches of the Center all over the Arab Republic of Egypt; and\n - accept grants, funds, and donations necessary to achieve its purposes after obtaining the approvals required by\n law."}, {"id": "law-pdpl-022", "ref": "Law Article 22", "text": "The Board of the Center shall meet, upon the invitation of its Chairman, at least once every month, and whenever\nnecessary. The meeting shall be valid in case the majority of board members are attending. Resolutions shall be\napproved by majority of two-thirds of the attending members. The Chairman may invite any person to attend the\nmeeting without any voting rights."}, {"id": "law-pdpl-023", "ref": "Law Article 23", "text": "The Center shall have Chief Executive Officer (CEO) whose appointment and financial remuneration shall be\ndetermined by a decree from the Prime Minister, upon the proposal of the Competent Minister, for a term of four\n(4) years, renewable for a similar term.\nThe CEO shall be responsible before the Board for the technical, administrative, and financial works of the Center,\nand shall represent the Center in its dealings with third parties and before the judiciary. The CEO shall particularly :\n 1. supervise the implementation of the Board resolutions;\n 2. manage and supervise the work of the Center, and its affairs;\n 3. submit periodic reports to the Board on the activity and work progress of the Center, the achievements in\n accordance with the set objectives, plans, and programs, and the performance obstacles may be\n encountered and the proposed solutions to avoid them;\n 4. exercise other competencies determined by the Center's regulations; and\n 5. take all necessary actions to enforce all the functions and competences of the Center mentioned in Article\n (21) of this Law.\nThe CEO shall be assisted by a sufficient number of experts, technicians, and administrative assistants in accordance\nwith the organizational structure of the Center."}, {"id": "law-pdpl-024", "ref": "Law Article 24", "text": "The Board members and employees of the Center are prohibited from disclosing any documents or data relating to\ncases monitored or examined by the Center, or which are submitted or circulated during the examination or\nissuance of decisions thereto. This obligation shall remain in force after the termination of the relationship with the\nCenter.\nIn all cases, the information, documents, and data referred to in this article shall only be disclosed to the\ninvestigating authorities and judicial authorities."}, {"id": "law-pdpl-025", "ref": "Law Article 25", "text": "The Center may, in coordination with the competent authorities, cooperate with its counterparts in foreign\ncountries, within the framework of international, regional and bilateral cooperation agreements, ratified\ncooperation protocols, or in the application of the principle of reciprocity, in order to protect Personal Data and\nverify the extent of compliance with the law by Controllers and Processors outside Egypt. The Center shall exchange\ndata and information in a manner that shall ensure the protection and non-infringement of Personal Data, as well as\nassisting in the investigation of violations and relevant crimes and tracking the perpetrators."}, {"id": "law-pdpl-026", "ref": "Law Article 26", "text": "The Center shall issue Licenses, Permits, or Certifications, as follows:\n 1. The Center shall classify and determine the types of Licenses, Permits, and Certifications, and establish\n conditions for granting each type thereof, in accordance with the provisions of the Executive Regulations.\n\n \n\n 2. Issue the License or Permit for Controller or Processor to perform data storing, handling, and Processing\n activities in accordance with this Law.\n 3. Issue Licenses or Permits for direct Electronic Marketing.\n 4. Issue Licenses or Permits for Processing of Personal Data undertaken by associations, unions, or clubs for the\n members of these entities and in the framework of their activities.\n 5. Issue Licenses or Permits for means of visual surveillance in public places.\n 6. Issue Licenses or Permits for the control and Processing of Sensitive Personal Data.\n 7. Issue Permits and Certifications for individuals and entities to allow them to provide consultancy services on\n procedures for the protection of Personal Data and compliance procedures.\n 8. Issue Licenses and Permits for the Cross-Border Personal Data Transfer.\nThe Executive Regulations shall set out the types, categories, procedures, and conditions of issuance of the Licenses,\nPermits, Certifications, and the forms used in relation thereto. Licensing fee shall not exceed EGP 2,000,000 (two\nmillion Egyptian pounds) while Permits or Certifications shall not exceed EGP 500,000 (five hundred thousand\nEgyptian pounds).\n\n Second: Procedures of Issuance of Licenses, Permits and Certifications"}, {"id": "law-pdpl-027", "ref": "Law Article 27", "text": "Applications for Licenses, Permits, and Certifications shall be submitted on the forms produced by the Center\nattaching all supporting documents and information requested to be submitted, along with proof of the applicant's\nfinancial ability and its ability to implement the stipulated requirements and technical standards. Decisions on the\napplications shall be made within a period not exceeding ninety (90) days from the date of completing all\ndocumentation and information. The lapse of the mentioned period without any decision shall be deemed rejection\nof the application.\nThe Center may request further data, papers, or documents to take a decision in relation to the application. The\nCenter also has the right to request the provision of additional guarantees for the protection of Personal Data in case\nof insufficiency of the protection mentioned in the submitted documents.\nController or Processor may obtain more than one License or Permit according to the type of Personal Data.\n\n Third: Amendments of the License and Permit Conditions"}, {"id": "law-pdpl-028", "ref": "Law Article 28", "text": "In accordance with public interest considerations, the Center may amend License or Permit conditions after its\nissuance in any of the following cases:\n 1. responding to relevant international, regional, or national laws;\n 2. upon the licensee’s request;\n 3. merger of Controller or Processor with others inside or outside the Arab Republic of Egypt; or\n 4. amendment is necessary to achieve the objectives of this Law.\n\n Fourth: Cancellation of Licenses, Permits, and Certifications"}, {"id": "law-pdpl-029", "ref": "Law Article 29", "text": "The Center may cancel License, Permit or Certification after its issuance in any of the following cases:\n 1. breach of the License, Permit or Certification;\n 2. non-payment of the License, Permit or Certification renewal fees;\n\n \n\n 3. repeated non-compliance with the Center’s decisions;\n 4. assigning the License, Permit or Certification to third party without the Center’s approval; or\n 5. Controller or Processor rendered bankrupted by virtue of judicial ruling.\n\n Fifth: Administrative Sanctions"}, {"id": "law-pdpl-030", "ref": "Law Article 30", "text": "Without prejudice to civil and criminal liability provisions under the law, the CEO of the Center shall notify the\nviolator to stop the violation and remove its causes and effects within a specific period. If such period lapses without\nabiding by the content of the notification, the Board of the Center has the right to issue a reasoned decision with the\nfollowing:\n 1. A warning of the partial or total suspension of License, Permit, or Certification for a specific period.\n 2. Suspension of License, Permit, or Certification in part or in whole.\n 3. Cancellation or revocation of License, Permit or Certification in part or in whole.\n 4. Publishing a statement of the violations which have been proven in one or more widespread media means,\n the cost of which shall be borne by the violator.\n 5. Subjecting Controller or Processor, as the case may be, to the Center’s technical supervision to ensure the\n protection of Personal Data at its own cost."}, {"id": "law-pdpl-031", "ref": "Law Article 31", "text": "The Center has a special budget that is prepared based on the model of economic authorities in accordance with the\nrules determined by the Center’s regulations and following the rules of the standardized accounting system, without\nbeing subject to governmental rules or systems. The Center's fiscal year commences and ends with the State's fiscal\nyear. The Center has its own bank account at the Central Bank of Egypt in which its resources are deposited. The\nCenter may open an account in any commercial bank upon the approval of the Minister of Finance. The Center's\nbudget surplus shall be deferred from a fiscal year to another. Disbursement of the Center's resources shall be made\nin accordance with the financial regulations and in the areas determined by the Board. The Center’s resources of\nfunding consist of the following:\n 1. its allocated share of the budget of ITIDA;\n 2. its allocated share, which shall not be less than one-third, of the proceeds of fines imposed in the application\n of the provisions of this Law;\n 3. the fees of services provided by the Center;\n 4. the fees for issuing Licenses, Permits, and Certifications and the reconciliation amounts;\n 5. the Center's investment revenues; and\n 6. grants, donations, and gifts accepted by the Board."}, {"id": "law-pdpl-032", "ref": "Law Article 32", "text": "The Data Subject and any relevant person may submit a request to any Holder, Controller or Processor to exercise\nhis/her rights stipulated under this Law and Holder, Controller or Processor is committed to reply within six (6)\nworking days from the date of submission.\n Second: Complaints"}, {"id": "law-pdpl-033", "ref": "Law Article 33", "text": "Without prejudice to the right to initiate judicial proceedings, the Data Subject and any relevant person, has the right\nto submit a complaint in any of the following cases:\n 1. Infringement or breach of the right of Personal Data protection.\n 2. Failure to enable the Data Subject to exercise his/her rights.\n 3. The decisions issued by the Data Protection Officer of Processor or Controller in relation to the requests\n submitted to him/her.\nThe complaints shall be submitted to the Center who has the right to take the necessary investigative actions. The\ndecision of the Center shall be issued within thirty (30) working days from the date of submission. The complainant\nand the respondent shall be notified with the decision.\nThe respondent shall execute the Center's decision within seven (7) working days from the notification date and\nnotify the Center of such execution."}, {"id": "law-pdpl-034", "ref": "Law Article 34", "text": "The Center's employees, who are appointed by a decision of the Minister of Justice upon the proposal of the\nCompetent Minister, shall have judicial control powers in relation to violations of this Law."}, {"id": "law-pdpl-035", "ref": "Law Article 35", "text": "Without prejudice to any severer sanctions stipulated under any other law and without prejudice to the injured\nparty's right to seek damages, the crimes set forth in the following Articles shall be penalized with the following\npenalties."}, {"id": "law-pdpl-036", "ref": "Law Article 36", "text": "Holders, Controllers and Processors who collect, process, disclose, make available, or circulate Personal Data that\nhas been electronically processed in cases that have not been authorized by the law or without the consent of the\ndata subject, shall be penalized with a fine not less than EGP 100,000 (One Hundred Thousand Egyptian Pounds) and\nnot exceeding EGP 1,000,000 (One Million Egyptian Pounds).\n\n \n\nHowever, if this is committed in exchange for a material or moral benefit or to endanger or harm the Data Subject,\nthe Penalty shall be imprisonment for a period not less than six (6) months, and/or a fine not less than EGP 200,000\n(Two Hundred Thousand Egyptian Pounds) and not exceeding EGP 2,000,000 (Two Million Egyptian Pounds)."}, {"id": "law-pdpl-037", "ref": "Law Article 37", "text": "Holders, Controllers and Processors who refrained without legal justification, from enabling the Data Subject to\nexercise his/her rights, stipulated under Article (2) of this Law, shall be penalized with a fine not less than EGP\n1,000,000 (One Hundred Thousand Egyptian Pounds) and not exceeding EGP 1,000,000 (One Million Egyptian\nPounds). Further, whoever collect Personal Data without complying with provisions stipulated under Article (3) of\nthis Law shall be penalized with a fine not less than EGP 200,000 (Two Hundred Thousand Egyptian Pounds) and not\nexceeding EGP 2,000,000 (Two Million Egyptian Pounds)."}, {"id": "law-pdpl-038", "ref": "Law Article 38", "text": "Controllers and Processors who do not perform their obligations under Articles (4), (5) and, (7) of this Law shall be\npenalized with a fine not less than EGP 300,000 (Three Hundred Thousand Egyptian Pounds) and not exceeding EGP\n3,000,000 (Three Million Egyptian Pounds)."}, {"id": "law-pdpl-039", "ref": "Law Article 39", "text": "The legal representatives of juristic persons who do not fulfill their obligations under Article (8) of this Law shall be\npenalized with a fine not less than EGP 200,000 (Two Hundred Thousand Egyptian Pounds) and not exceeding EGP\n2,000,000 (Two Million Egyptian Pounds)."}, {"id": "law-pdpl-040", "ref": "Law Article 40", "text": "Data Protection Officers who fail to carry out their duties stipulated under Article (9) of this Law shall be penalized\nwith a fine not less than EGP 200,000 (Two Hundred Thousand Egyptian Pounds) and not exceeding EGP 2,000,000\n(Two Million Egyptian Pounds).\nIf a violation occurs due to negligence of the Data Protection Officer, the penalty shall be a fine not less than EGP\n50,000 (Fifty Thousand Egyptian Pounds) and not exceeding EGP 500,000 (Five Hundred Thousand Egyptian Pounds)."}, {"id": "law-pdpl-041", "ref": "Law Article 41", "text": "Holders, Controllers and Processors who collect, make available, circulate, Process, disclose, store, transfer or save\nSensitive Personal Data without the consent of the Data Subject or in cases that have not been permitted by law,\nshall be sentenced to imprisonment for a period not less than three (3) months and/or a fine not less than EGP\n500,000 (Five Hundred Thousand Egyptian Pounds) and not exceeding EGP 5,000,000 (Five Million Egyptian Pounds)."}, {"id": "law-pdpl-042", "ref": "Law Article 42", "text": "Whoever violates the conditions of Cross-Border Personal Data Transfer stipulated under Articles (14), (15), and (16)\nshall be sentenced to imprisonment for a period not less than three (3) months and/or a fine not less than EGP\n500,000 (Five Hundred Thousand Egyptian Pounds) and not exceeding EGP 5,000,000 (Five Million Egyptian Pounds)."}, {"id": "law-pdpl-043", "ref": "Law Article 43", "text": "Whoever violates the Electronic Marketing provisions stipulated under Articles (17) and (18) of this Law shall be\npenalized by a fine not less than EGP 200,000 (Two Hundred Thousand Egyptian Pounds)and not exceeding EGP\n2,000,000 (Two Million Egyptian Pounds)."}, {"id": "law-pdpl-044", "ref": "Law Article 44", "text": "Members of the Board of the Center and its employees who violate the obligations stipulated under Article (24) of\nthis Law shall be penalized by a fine not less than EGP 300,000 (Three Hundred Thousand Egyptian pounds) and not\nexceeding 3,000,000 (Three Million Egyptian Pounds)."}, {"id": "law-pdpl-045", "ref": "Law Article 45", "text": "Whoever violates the provisions of Licenses, Permits, or Certifications stipulated under this Law shall be penalized\nwith a fine not less than EGP 500,000 (Five Hundred Thousand Egyptian Pounds) and not exceeding EGP 5,000,000\n(Five Million Egyptian Pounds)."}, {"id": "law-pdpl-046", "ref": "Law Article 46", "text": "Whoever prevents any of the Center's employees who have control powers from performing their work shall be\nsentenced to imprisonment for a period not less than six (6) months and/or a fine not less than EGP 200,000 (Two\nHundred Thousand Egyptian Pounds) and not exceeding EGP 2,000,000 (Two Million Egyptian Pounds)."}, {"id": "law-pdpl-047", "ref": "Law Article 47", "text": "The de facto manager of the violating juristic person shall be penalized with the same sanctions stipulated for\nviolations of this Law, if it is proven that the manager knew about the violation and if his breach of the duties\nimposed by the juristic person contributed to the violation.\nThe juristic person shall be jointly responsible for the payment of damages, if the violation is committed by one of its\nemployees, under the juristic person’s name and for its account and benefit."}, {"id": "law-pdpl-048", "ref": "Law Article 48", "text": "In all cases, and in addition to penalties set forth under this Law, the courts order that the sentences be published in\ntwo widespread newspapers and on the internet at the expense of the convict.\nIn case of recidivism, the sanctions stipulated in this chapter will be doubled with their minimum and maximum\nlimits.\nThe attempt to commit violations under this Law shall be sanctioned with half the prescribed penalties.\n\n Settlement and Reconciliation"}, {"id": "law-pdpl-049", "ref": "Law Article 49", "text": "At any stage of the criminal proceedings and before the issuance of a final judgment, the defendant may evidence\nthe settlement with the claimant, its representative or successor and upon the Center's approval before the Public\nProsecutor's Office or the competent court, as the case may be, in respect of the misdemeanors stipulated under\nArticles (36), (37), (38), (39), (40), (41) and (43) of this Law.\nReconciliation with relation to the misdemeanors stipulated under Articles (42), (44) and (45) of this Law may be\nreached with the Center at any stage of the proceedings.\nIn all cases, the defendant who seeks reconciliation, shall pay before the initiation of criminal proceedings, an\namount equivalent to half of minimum fine set forth for the violation.\nThe defendant who seeks settlement after the initiation of criminal proceedings and before the issuance of a final\njudgment, shall pay half of the maximum fine set forth for the violation or the adjudicated fine, whichever is higher.\nThe payment shall be made to the competent court's treasury, the Public Prosecutor's Office, or the Center, as the\ncase may be.\nReconciliation entails the lapse of criminal proceedings without any effect on the rights of the injured party from the\nviolation."}, {"id": "exec-regs-001", "ref": "Exec Regs Art 1 — Definitions", "text": "[Definitions] The Regulations use the same definitions as the Personal Data Protection Law (Law 151/2020). 'The Law' means Law 151/2020."}, {"id": "exec-regs-002", "ref": "Exec Regs Art 2 — General controls for collecting, processing, storing and securing personal data", "text": "[General controls for collecting, processing, storing and securing personal data] Any entity collecting personal data must hold a controller or processor license/permit from the Center (in addition to any sector approvals). Data may be collected only after the data subject consents and is clearly told the purpose; when a person provides their data in the course of receiving a legitimate service or transaction, that counts as consent for THAT purpose only — any other use needs fresh prior consent. The Center must approve the collection mechanisms and the consent mechanism (guardian consent for children). A retention period tied to the purpose must be set. Staff handling data owe confidentiality. Entities must inform data subjects of their Article 2 rights, apply the Center's security programs, and keep a secure electronic record logging: each consent (date and format), the categories of data collected and their scope of use, per-category retention periods tied to purpose, and the technical/organizational security procedures — kept inspectable by the Center."}, {"id": "exec-regs-003", "ref": "Exec Regs Art 3 — Controller obligations", "text": "[Controller obligations] Controllers must: hold a Center license/permit; use data only for the licensed purpose; verify accuracy of collected data against its source and purpose; delete data immediately once the purpose ends and notify the data subject (data kept for a legitimate reason afterwards must be de-identified); run a Center-approved mechanism letting data subjects access, review, withdraw consent, correct, restrict, or object; a controller outside Egypt with no branch must appoint an accredited in-country representative (a natural-person controller appoints an agent in Egypt); give the Center's inspectors — who have judicial-officer status — access to electronic records; collect only the volume/type of data its sector law permits; bind data-collection staff to confidentiality. Policies must include periodic accuracy testing, de-identification of retained data, technical confidentiality measures, recovery/access capability after incidents, and secure electronic records of data-subject requests (additions, modifications, deletions, consent withdrawals, and data withheld for legal/national-security reasons)."}, {"id": "exec-regs-004", "ref": "Exec Regs Art 4 — Processor obligations", "text": "[Processor obligations] Processors must: hold a Center license/permit; run a Center-approved mechanism defining data volume, processing purpose, consent recording, and notice of the processing period to controller and data subject; bind staff to confidentiality; enable Center inspection and keep processing within the licensed activity; a processor outside Egypt with no branch must appoint an accredited in-country representative. Processing for a purpose other than the controller's is prohibited except non-profit statistical/educational purposes with consent, relevance, and coding so the person cannot be identified. NOTABLE: when personal data is used to train AI or emerging technologies, the processor must follow locally and internationally recognized principles and ensure no harm to the data subject. Security procedures include unreadable (encrypted) storage, recovery capability, and a secure record covering processing operations, the processing contract, the controller's DPO and legal-representative details, cross-border destinations and routes, per-category processing periods, and dated proof of erasure or handover after processing ends."}, {"id": "exec-regs-005", "ref": "Exec Regs Art 5 — Controller/processor duties on breach", "text": "[Controller/processor duties o
