 exercise their rights,\n such as minors, the elderly, or individuals with disabilities (e.g., a doctor specialising\n in elderly care provides their privacy notice only through electronic means).\n ● The use of automated decision-making and profiling: whether the processing\n involves automated decisions producing legal or significant effects on the data subject\n without human oversight (e.g., an HR system automatically rejecting candidates based\n on ethnicity).\n\nExample:\n\nA car manufacturing company launches a new smart service offering drivers features such\n as intelligent navigation, roadside assistance, and insights into driving behaviour.\n\nTo provide these features, the company collected detailed driving data—including speed,\n acceleration, and hard braking patterns, and stated in their privacy notice that the purpose\n of processing was to enhance driving safety.\n\nHowever, the company sold this data to insurance providers without informing drivers,\n which led to increased insurance premiums for some data subjects.\n\nThis practice violates the fairness principle, as personal data was processed in ways that\n data subjects could not reasonably expect and that resulted in harm to their rights and\n freedoms.\n\n3. Transparency\n\nPersonal data must be processed in a manner that is transparent, clear, and honest towards\nthe data subject.\nThe information provided to the data subjects must be:\n ● Concise: The information must be precise and straightforward, using short sentences\n and organised paragraphs.\n ● Transparent: The information must be honest, not misleading or incomplete.\n ● Easily accessible: The information must be made easily available to data\n subjects without undue effort to locate.\n\n● Intelligible: The information must be provided using plain and\n understandable language, taking into consideration the characteristics of targeted\n data subjects.\n ● Provided in a timely manner: The information must be provided without undue\n delay and within the required timeframes.\n ● Accurate and up to date: The information must be accurate and regularly updated.\n The transparency principle may arise, inter alia, in the following circumstances:\n ● At the time of data collection.\n ● Upon the data subject’s request.\n ● In case of a data breach."}, {"id": "guide-privacy-principles-003", "ref": "Data Protection Principles Guidelines — DATA PROTECTION", "text": "Example:\n\nAn online platform designs their privacy notice using confusing legal language, with\n key information scattered across multiple pages. As a result, data subjects struggled to\n understand how their personal data was handled.\n\nThis practice violates the transparency principle, as information was not presented in a\n concise, transparent, and intelligible manner.\n\n4. Purpose Limitation\n\nThe purpose refers to the reason or objective for which personal data is collected and processed,\ndefining the scope and limitations of the processing activity.\n\nPersonal data must be collected and processed for specified, explicit, and legitimate purposes:\n ● Specified: The purpose must be clearly identified prior to the processing activity,\n without being vague or ambiguous.\n ● Explicit: The purpose must be clearly communicated to data subjects in a transparent\n manner, ensuring they are enabled to fully understand why their personal data will be\n processed.\n ● Legitimate: The purpose must not violate any applicable laws and regulations.\n\nFurthermore, once personal data has been collected, any further processing must be limited to\nthe originally intended purpose(s), unless another lawful basis explicitly permitting further\nprocessing supports the new processing activity.\n\nExample 1:\n An E-commerce company informs customers that the purpose of the processing activity\n is “business purposes”. This practice violates the purpose limitation principle, as such\n purpose is vague and lacks specificity, preventing customers from understanding the exact\n reasons for data collection. Instead, the company could have clearly defined and\n communicated specific purposes such as \"delivering orders” or “personalising marketing\n offers”.\n\nExample 2:\n A hospital collects and processes a patient’s personal data for the purpose of providing\n medical care and treatment. The hospital later wishes to use this data for marketing\n purposes. However, this new purpose is not compatible with the original purpose of\n providing medical care, and therefore, such processing cannot take place unless a new\n valid lawful basis is established (e.g., the patient’s explicit consent).\n\n5. Data Minimisation\n\nPersonal data must be collected and processed only to the extent that is relevant, adequate, and\nnecessary in relation to the intended purpose(s):\n ● Relevant: The personal data maintains a logical link and functional\n connection to the intended purpose.\n ● Adequate: The personal data is sufficient, in amount and nature, to\n effectively fulfil the intended purpose.\n ● Necessary: The personal data is strictly limited to the minimum required to\n achieve the purpose, with no less intrusive alternative available."}, {"id": "guide-privacy-principles-004", "ref": "Data Protection Principles Guidelines — DATA PROTECTION", "text": "Example:\n A railway company collects gender data from all passengers for the purpose of preventing\n mixing between male and female passengers in shared night-train cabins.\n\nThis generalised collection practice violates the data minimisation principle, as gender data\n is irrelevant for passengers who do not book shared night-train cabins.\n\n6. Data Accuracy\n\nAll reasonable steps must be taken to ensure that the personal data is accurate, complete, and\nkept up-to-date, in line with the purpose(s) of the processing activity.\n\nAny personal data that is considered inaccurate, incomplete, or outdated must be erased or\n rectified without undue delay, particularly where the inaccuracy of personal data could\n negatively impact data subjects’ rights and freedoms.\n\nTo uphold data accuracy, appropriate measures may include:\n ● Assessing the reliability of the data source prior to collection;\n ● Verifying the accuracy of the data through monitoring systems, periodic\n reviews, and validation mechanisms;\n ● Exercising due diligence when integrating and consolidating data from\n multiple sources or datasets;\n ● Implementing effective identity management controls to ensure\n consistency of data across systems; and\n ● Enabling the data subject’s right to rectification.\n\nExample:\n A healthcare provider operating several branches registered patients separately at each\n facility without a unified master patient index or central identity management system.\n As a result, the same patient was recorded under different identifiers across branches, with\n each profile containing partial medical information, leading to inconsistent records and\n missing clinical data during treatment.\n This practice violates the data accuracy principle, as it results in incomplete and unreliable\n patient records, creating high risks for data subjects.\n\nIt should be noted that, under the PDPL, records containing past inaccuracies may be considered\n“accurate”, having regard to the purpose of the processing activity, provided that such data is\nnot misleading and that the retention of such personal data is necessary for justifiable reasons.\n\nExample:\n A doctor retains their patient’s past misdiagnosis in their medical records for the purposes\n of understanding the necessary course of treatment and understanding any additional health\n problems that may arise in the future.\n\n7. Storage Limitation\nPersonal data must not be retained for longer than necessary to achieve the purpose(s) of the\nprocessing activity. Once the identification of data subjects is no longer required, the personal\ndata must be either securely erased or appropriately anonymised."}, {"id": "guide-privacy-principles-005", "ref": "Data Protection Principles Guidelines — DATA PROTECTION", "text": "To ensure compliance, before initiating the processing activity, personal data retention periods,\nor at least the criteria for determining them, must be clearly defined, documented, and, where\n\nnecessary, set out in a data retention policy to uphold accountability.\n\nWhen determining data retention periods, the following factors may be considered:\n ● The duration for which the personal data remains necessary to achieve the specific\n purpose(s) for which personal data is processed.\n ● Any applicable legal, regulatory, or contractual obligations that require data to be\n retained for a specified period (e.g., storing clients’ personal data for five years\n following account closure, in accordance with Article 9 of the Anti-Money Laundering\n Law, as enacted by Law No. 80 of the year 2002).\n ● The necessity of retaining certain categories of personal data for the establishment,\n exercise, or defence of legal claims, provided that the retention of such data is relevant,\n adequate, and necessary.\n ● Situations where retaining personal data is required to demonstrate the existence of a\n prior relationship with the data subject.\n ● The duration for which recipients are required to retain the shared personal data.\n\nExample:\n A company permanently stores customer service call recordings to evaluate employee\n performance and improve customer interactions.\n This practice violates the storage limitation principle, as retaining the recordings for a short,\n defined period would have been sufficient to achieve the stated purpose.\n\n8. Data Security\n\nPersonal data must be secured throughout its entire lifecycle against unlawful or unauthorised\nprocessing, access, alteration, damage, loss, or destruction.\n\nTo this end, appropriate technical and organisational measures must be implemented to ensure\nthe integrity, confidentiality, availability of both the personal data and the processing systems,\nas well as to maintain the resilience of those systems. Moreover, where processing activities\npresent a high risk to the rights and freedoms of data subjects, proportionate and, where\nnecessary, enhanced security measures must be implemented.\n\n9. Accountability\n\nAppropriate technical and organisational measures must be implemented to ensure that personal\ndata is processed in compliance with all data protection principles and obligations. Furthermore,\ncompliance must be demonstrable through appropriate documentation, in accordance with the\ndata protection regulatory framework."}, {"id": "guide-privacy-principles-006", "ref": "Data Protection Principles Guidelines — DATA PROTECTION", "text": "Key accountability measures may include, inter alia:\n ● Obtaining the necessary licences and permits.\n ● Maintaining records of processing activities (RoPA).\n ● Maintaining a record of security incidents.\n ● Maintaining a record of data subjects' requests.\n ● Conducting data protection impact assessments (DPIA) when needed, and\n maintaining the underlying documentation.\n ● Conducting legitimate interest assessments (LIA) when needed, and maintaining the\n underlying documentation.\n ● Conducting transfer impact assessment (TIA) when needed, and maintaining the\n underlying documentation.\n ● Providing regular employee training and awareness initiatives on different\n data protection obligations, and maintaining records of their completion.\n ● Implementing appropriate internal privacy policies.\n ● Performing regular privacy audits, and maintaining reports of such audits.\n ● Incorporating appropriate data protection clauses in data processing and sharing\n agreements.\n\n@pdpceg info@pdpc.gov. eg"}, {"id": "guide-data-usage-001", "ref": "Data Usage Guidelines — DATA USERS", "text": "DATA USERS\n GUIDELINES\n\nVersion 1.1. - 26 January 2026\n\nIntroduction .............................................................................................................................. 2\n1. The Concept of Data Users ............................................................................................... 3\n 1.1. The Distinction Between Controllers and Processors ........................................... 3\n 1.2. Controllers/Processors ............................................................................................. 6\n2. The Relationship Between Data Users ............................................................................. 6\n3. Legal Obligations............................................................................................................... 7\n 3.1. Appointing a Data Protection Officer (DPO) ...................................................... 7\n 3.2. Obtaining the Necessary Licenses and Permits................................................... 7\n 3.3. Maintaining a Record of Processing Activities (RoPA)...................................... 8\n 3.4. Processing Personal Data in Accordance with Data Protection Principles....... 8\n 3.5. Enabling Data Subjects’ Rights............................................................................ 9\n 3.6. Complying with Sensitive Personal Data Obligations ........................................ 9\n 3.7. Conducting the Necessary Data Protection Risk Assessments .......................... 9\n 3.8. Complying with Breach Notification Obligations ............................................. 10\n 3.9. Complying with Electronic Direct Marketing Obligations .............................. 10\n 3.10. Appointing a Representative in Egypt .............................................................. 10\n 3.11. Cross-Border Data Transfer Obligations ......................................................... 11\n 3.12. Data Protection Clauses ..................................................................................... 11\n 3.13. Following the Controller’s Instructions ............................................................ 11\n 3.14. Cooperating with the PDPC .............................................................................. 11\n\nIntroduction\n\nControllers and processors are the primary subjects of obligations under the Personal Data\nProtection Law (PDPL), with each assuming distinct roles and responsibilities in relation to\nthe processing activity in question. Accordingly, understanding these differences is crucial to\nensuring effective compliance with the data protection regulatory framework.\n\nThis guideline sets out:\n 1. The concept of data users;\n 2. The relationship between data users; and\n 3. Their respective legal obligations under the PDPL.\n\n1. The Concept of Data Users\n\nThe term “data user” is a general designation that includes controllers, processors,\nand controllers/processors.\n\nController Processor\n\nAny natural or juridical person Any natural or juridical person who\n who— by virtue of their work or by — by nature of their activity —\n nature of their activity — has the processes personal data for their\n right to obtain and control personal own interest, or for the interest of\n data, as well as to determine the the controller in accordance with\n PDPL\n Definition means, techniques, and criteria the terms agreed upon and the\n governing the retention or instructions provided by the\n processing of such data, in controller.\n accordance with the specified\n purpose or their activity."}, {"id": "guide-data-usage-002", "ref": "Data Usage Guidelines — DATA USERS", "text": "● Doctors ● IT consultants\n Examples of\n ● Lawyers ● Freelance data entry specialists\n natural\n persons ● Accountants ● Independent marketing\n specialists\n\n● Government authorities ● Cloud service providers\n Examples of ● Hospitals ● Payroll companies\n juridical ● Corporations ● Call centre service providers\n persons\n ● NGOs ● Marketing agencies\n\nNote:\n Individuals collecting or processing personal data solely for personal purposes are excluded\n from the scope of the PDPL (e.g., an individual maintaining contact details of friends and\n family on their phone).\n\n1.1. The Distinction Between Controllers and Processors\nBeing a controller or processor is not a blanket characterisation of the entity, but rather reflects\nthe role they assume in a specific processing activity, and this characterisation may even vary\nat different stages of the processing activity lifecycle.\n\nAccordingly, data users must not rely on assumptions, general titles, or contractual\ndescriptions. Instead, they must conduct a case-by-case assessment, based on their factual roles\n\nin each processing activity, to determine the appropriate legal characterisation and understand\nthe corresponding legal obligations.\n\nExample:\n Company A is a software development company that processes personal data on behalf\n of Company B and strictly in accordance with the instructions of Company B. In this\n processing activity, Company A acts as a processor.\n\nIn another context, Company A determines the purpose and means of processing their\n employees’ personal data and carries out the processing. In this processing activity,\n Company A acts as a controller.\n\na. Controllers\n\nTo identify a controller, the decisive criterion is whether an entity is exercising control\nand decision-making authority over the purpose(s) and means of the personal data processing\nactivities.\n\nThe purpose(s) of the processing: “the why”\n\nThe purpose refers to the reason or objective for which personal data is collected or processed,\ndefining the scope and limitations of the processing activity.\n\nAccordingly, an entity that determines the purpose of a processing activity is regarded as\na controller in respect of that activity, irrespective of the contractual designation attributed to\nthem.\n\nThe means of the processing: “the how”\n\nThe means refer to how the purpose of processing will be achieved by determining the\nconditions under which personal data is collected, stored, used, secured, transferred, disposed,\netc."}, {"id": "guide-data-usage-003", "ref": "Data Usage Guidelines — DATA USERS", "text": "There are essential and non-essential means. Determining the essential means is reserved for\ncontrollers, while non-essential means can be determined by either a controller or a processor,\nwithout altering the processor’s characterisation or rendering them a controller.\n ● Essential means: Related to the scope and the fundamental aspects of the\n processing activity. Examples include:\n ○ The categories of data subjects involved;\n ○ The personal data processed;\n ○ The retention periods of personal data; and\n ○ The recipient(s) of personal data.\n\n● Non-essential means: Related to the practical and technical aspects of the\n processing activity. Examples include:\n ○ The system and hardware used to carry out the processing;\n ○ The security measures implemented to protect the personal data;\n ○ Internal workflow and distributions of tasks on employees; and\n ○ Details of storage logistics.\n\nExample 1:\n A retailer company creates and maintains a fan page on a social media platform. The\n platform places cookies on visitors’ devices to track their browsing behavior and provides\n the company with anonymised statistical insights about page visitors.\n The company sets parameters defining the target audience and objectives, influencing how\n visitor statistics are generated, and which personal data categories are processed.\n Even without directly accessing personal data, the company is considered a joint controller\n because it influences the purposes and means of processing and enables the platform to\n place cookies on visitors’ devices.\n\nExample 2:\n A payroll service provider determines the software tools, and internal workflow steps used\n to calculate and issue salaries on behalf of the controller.\n Despite determining these details, the payroll service provider remains a processor, because\n these operational means are non-essential means and can be determined by the processor\n without exceeding its role.\n\nb. Processors\nTo identify a processor, the decisive criterion is whether an entity processes personal data on\nbehalf of a controller, in accordance with the agreed terms and documented instructions.\n\nExample:\n Company A—a customer support service provider—is engaged by Company B to handle\n customer inquiries on their behalf. In performing these services, Company A processes the\n personal data of Company B’s customers strictly in accordance with Company B’s\n documented instructions and the terms of their agreement. In this context, Company A acts\n as a processor."}, {"id": "guide-data-usage-004", "ref": "Data Usage Guidelines — DATA USERS", "text": "1.2. Controllers/Processors\nA controller/processor refers to any entity that both determines the purposes and means of a\nprocessing activity and directly carries out that processing activity, whether wholly or partially.\n\nIn other words, whenever an entity processes personal data for their own benefit, it acquires\nthe status of controller/processor in respect of that activity. Such an entity, therefore, assumes\nthe combined obligations of controllers and processors under the PDPL.\n\nIt should be noted that under the PDPL, the term “processing” is broadly defined to include\nactivities such as collecting personal data. Since most controllers engage in processing when\ncollecting and using personal data, almost all controllers qualify as controller/processor.\n\nExample:\n Company A collects the personal data of their own customers and processes it for delivery\n and order-fulfilment purposes. In such a case, Company A is regarded as a\n controller/processor and should assume the obligations associated with both roles.\n\n2. The Relationship Between Data Users\nRelationships between data users may give rise to complex legal and operational\nconsiderations, including potential overlapping responsibilities.\n\nTherefore, to mitigate the risk of incurring liabilities for another party’s non-compliance, data\nusers are advised to clearly define their respective data protection roles and responsibilities in\na written agreement annexed to their main agreement.\n\nSuch agreements must be consistent with the data protection regulatory framework and other\napplicable laws and regulations, and may include:\n\n● Scope and limitations, inter alia, the purpose(s) of the processing activity and the\n categories of personal data;\n ● Data protection undertakings specifying each party’s obligations;\n ● Audit and inspection rights;\n ● Assistance with data subject requests;\n ● Security measures to be implemented;\n ● Procedures for data breach notifications;\n ● Procedures of data return and disposal;\n ● Provisions governing the instructions and communications; and\n ● Approvals and notifications required for engaging a sub-processor.\n\n3. Legal Obligations\nData users must observe the following and comply with the data protection obligations\napplicable to their role and processing activities:\n 1. Appointing a data protection officer (DPO);\n 2. Obtaining the necessary licenses and permits;\n 3. Maintaining a record of processing activities (RoPA);\n 4. Processing personal data in accordance with data protection principles;\n 5. Enabling data subjects’ rights;\n 6. Complying with sensitive personal data obligations;\n 7. Conducting the necessary data protection risk assessments;\n 8. Complying with breach notification obligations;\n 9. Complying with electronic direct marketing obligations;\n 10. Appointing a representative in Egypt;\n 11. Cross-border data transfer obligations;\n 12. Data protection clauses;\n 13. Following the controller’s instructions; and\n 14. Cooperating with the PDPC."}, {"id": "guide-data-usage-005", "ref": "Data Usage Guidelines — DATA USERS", "text": "3.1. Appointing a Data Protection Officer (DPO)\nJuridical persons acting as data users must appoint a DPO irrespective of the scale of their\nprocessing activities. Natural persons acting as data users may either appoint a DPO or\npersonally assume the obligations associated with this role.\n\nFor more information on DPOs, please refer to the DPO Guideline.\n\n3.2. Obtaining the Necessary Licenses and Permits\nData users must obtain a controller, processor, or controller/processor license or permit from\nthe PDPC in order to process personal data. Additionally, depending on the nature of their\nactivities, they must obtain a supplementary license or permit for electronic direct marketing,\nvideo surveillance systems, or cross-border data transfers. In this regard, they must:\n ● Complete the license and permit compliance checklist;\n ● Submit the necessary documentation, if needed;\n ● Respond to the queries of the PDPC during the application process;\n ● Pay the applicable fees; and\n ● Comply with terms and conditions governing the issued licenses and/or permits.\nFor more information on licenses and permits, please refer to the Licenses and Permits\nGuideline.\n\n3.3. Maintaining a Record of Processing Activities (RoPA)\n\nA RoPA is a structured record capturing key information on all personal data processing\nactivities conducted by data users. RoPA must be maintained accurately, kept up to date, and\nmade available to the PDPC upon request.\n\nFor more information on the RoPA and its requirements, please refer to the RoPA Guideline.\nTo access the RoPA templates of the PDPC, please refer to the RoPA Templates.\n\n3.4. Processing Personal Data in Accordance with Data Protection\n Principles\n\nData users must adhere to the fundamental data protection principles set forth by the PDPL.\n ● Lawfulness: Processing personal data must rely on at least one lawful basis and\n must be conducted in compliance with applicable laws and regulations.\n ● Fairness: Processing personal data must align with data subjects’ reasonable\n expectations and ensure that they are not subjected to unjustified harm.\n ● Transparency: Personal data must be processed in a manner that is clear, open, and\n honest towards the data subject.\n ● Purpose limitation: Processing personal data must be for specified, explicit, and\n legitimate purposes, and any further processing must be compatible with the original\n purpose.\n ● minimisation: Processing and collection of personal data must be limited only to the\n extent that is relevant, adequate, and necessary for the intended purpose(s) of the\n processing activity.\n ● Data accuracy: All reasonable steps must be taken to ensure that personal data is\n accurate, complete, and kept up to date in accordance with the purpose(s) of the\n processing activity.\n ● Storage limitation: Processing personal data must be for specified, explicit, and\n legitimate purposes, and any further processing must be compatible with the original\n purpose.\n ● Data security: Personal data must be secured and protected throughout its entire\n lifecycle against any unlawful or unauthorised processing, access, alteration, damage,\n loss, or destruction.\n ● Accountability: Processing personal data must be for specified, explicit, and\n legitimate purposes, and any further processing must be compatible with the original\n purpose."}, {"id": "guide-data-usage-006", "ref": "Data Usage Guidelines — DATA USERS", "text": "For more information on data protection principles, please refer to the Data Protection\nPrinciples Guideline.\n\n3.5. Enabling Data Subjects’ Rights\nData users must enable the following data subject rights within the required conditions and\ntimeframes:\n ● The right to be informed: the data subject’s right to be proactively and effectively\n provided with adequate information about the processing of their personal data. For\n more information about the right to be informed, please refer to the Privacy Notice\n Guideline.\n ● The right to be notified in case of data breach: the data subject’s right to be notified,\n in a timely manner, of any data breach affecting their personal data.\n ● The right of access: the data subject’s right to obtain confirmation as to whether their\n personal data is being processed and, where applicable, to receive a copy of such data\n and/or the requested information about the processing activity.\n ● The right to withdraw consent: the data subject’s right to freely revoke their\n previous consent at any time through a clear, simple, accessible, and cost-free\n mechanism.\n ● The right to erasure “Right to be forgotten”: the data subject’s right to have their\n personal data erased from data users’ records.\n ● The right to rectification: the data subject’s right to have their personal data\n corrected or updated.\n ● The right to object: the data subject’s right to object to and require the cessation of\n the processing of their personal data.\n ● The right to restriction of processing: the data subject’s right to temporarily restrict\n the processing of their personal data solely within the storage scope.\n ● The right to data portability: the data subject’s right to have their personal data\n transferred to another controller in a structured, commonly used, and machine-\n readable format.\n\n3.6. Complying with Sensitive Personal Data Obligations\nData users must properly classify personal data to identify any categories of sensitive personal\ndata and ensure enhanced protection of such data. This includes complying with the appropriate\nconsent requirements and implementing appropriate technical and organisational measures to\nsafeguard such data.\nFor more information about consent requirements when processing sensitive data, please refer\nto the Data Subject’s Consent Guideline."}, {"id": "guide-data-usage-007", "ref": "Data Usage Guidelines — DATA USERS", "text": "3.7. Conducting the Necessary Data Protection Risk Assessments\nData protection risk assessments (e.g., DPIA and LIAs) are processes by which the data user\nidentifies, assesses, and mitigates data protection risks. Such assessments must be properly\ndocumented and made available to the PDPC upon request.\n\n3.8. Complying with Breach Notification Obligations\nData users must:\n ● Implement appropriate technical and organisational measures to detect, manage, and\n remediate personal data breaches;\n ● Notify the PDPC of any personal data breach, with all mandatory information, within\n seventy-two (72) hours of becoming aware of the breach, or immediately if the breach\n concerns a matter of national security;\n ● Notify data subjects of any personal data breach concerning their personal data, with\n all mandatory information, within three (3) working days following the notification\n to the PDPC; and\n ● Maintain a complete, accurate, and up-to-date personal data breach register.\n\n3.9. Complying with Electronic Direct Marketing Obligations\nData users engaged in electronic direct marketing (EDM) must comply with the following\nobligations, depending on their respective marketing roles:\n ● Obtain the necessary EDM license or permit before initiating any EDM\n communications (EDMCs);\n ● Obtain the data subject’s valid consent prior to sending any EDMCs;\n ● Honour opt out requests in a timely manner;\n ● Maintain an updated and accurate record of all opt-out requests;\n ● Refrain from disclosing data subjects’ contact information to any unauthorised entity;\n ● Ensure EDMCs include all information mandated by the PDPL; and\n ● Maintain electronic records evidencing the data subject’s consent, including\n any amendments or consent withdrawals. These records must be retained for a period\n of three (3) years from the date of the last EDMC sent to the data subject.\n\nFor more information about EDM obligations, please refer to the EDM Guideline.\n\n3.10. Appointing a Representative in Egypt\nData users located outside the Arab Republic of Egypt, without having a branch or\nrepresentative office within the Egyptian borders, must appoint a representative within\nEgypt. For juridical persons, the representative may be a company branch, or an office\nauthorised to act on their behalf or represent them. For natural persons, the legal representative\nmust reside in Egypt."}, {"id": "guide-data-usage-008", "ref": "Data Usage Guidelines — DATA USERS", "text": "In all cases, the appointed representative shall be officially registered by the PDPC for the\nduration of the applicable licence or permit.\n\n3.11. Cross-Border Data Transfer Obligations\nWhen engaging in a cross-border data transfer, data users must:\n ● Obtain a cross-border data transfer permit or licence, where applicable;\n ● Ensure all cross-border data transfers rely on an appropriate legal basis; and\n ● Conduct an accurate, complete and documented Transfer Impact Assessment (TIA),\n where applicable.\n\n3.12. Data Protection Clauses\nData users are advised to clearly define their respective data protection roles and\nresponsibilities in a written agreement annexed to their main agreement, to ensure compliance\nwith the data protection regulatory framework.\n\n3.13. Following the Controller’s Instructions\nProcessors must process personal data strictly in accordance with the controllers’ instructions,\nunless such instructions violate the applicable laws or regulations. In the latter case, processors\nmust promptly inform controllers accordingly.\n\n3.14. Cooperating with the PDPC\nData users must cooperate diligently, promptly and in good faith with the PDPC, inter alia:\n ● Responding to the PDPC queries;\n ● Providing the PDPC with the required documents and information; and\n ● Allowing the inspectors of the PDPC to access the electronic records to verify\n compliance with data protection regulatory framework.\n\n@pdpceg info@pdpc.gov. eg"}, {"id": "guide-ropa-001", "ref": "Record of Processing Activities (RoPA) Guidelines — RECORD", "text": "RECORD\n OF PROCESSING\n ACTIVITIES GUIDELINES\n\nVersion 1.1. - 26 January 2026\n\nIntroduction.............................................................................................................................. 2\n1. The RoPA Concept ........................................................................................................... 3\n2. Steps to Develop a RoPA .................................................................................................. 3\n a. Conduct an Asset Inventory ................................................................................... 3\n b. Consider Data Discovery Tools .............................................................................. 3\n c. Prepare the Interview Framework......................................................................... 3\n d. Conduct Interviews with Data Owners ................................................................. 4\n e. Classify Personal Data............................................................................................. 4\n f. Ensure Regular Review and Updates .................................................................... 4\n3. RoPA Structure and Content .......................................................................................... 4\n3.1 The Controller-Related-Activities RoPA ........................................................................ 4\n3.2 The Processor-Related-Activities RoPA ......................................................................... 5\n\nIntroduction\n\nPursuant to the Personal Data Protection Law (PDPL), all processing activities must be\ndocumented by data users in a record of processing activities (RoPA). The PDPL sets different\nrequirements for both controller-related-activities (Article 4.9) and processor-related-activities\n(Article 5.9).\n\nThis guideline sets out:\n 1. The RoPA concept;\n 2. Steps to develop a RoPA; and\n 3. RoPA structure and content.\n\n1. The RoPA Concept\n\nA RoPA is a structured record capturing key information on all personal data processing\nactivities.\n\nBeyond the explicit obligation on all data users to maintain a RoPA, such record constitutes\nthe first step towards achieving and demonstrating compliance with most obligations under the\nPDPL.\n\nServing as a core data governance tool, the RoPA enables data users to gain a clear\nunderstanding of their processing activities, including their context, nature, and lifecycle.\nWithout such visibility, data users cannot effectively identify or implement the appropriate\nmeasures for compliance with the PDPL requirements.\n\nThe RoPA must be accurate, complete, updated, and made available to the Personal Data\nProtection Centre (PDPC) upon request.\n\n2. Steps to Develop a RoPA\n\nThe following steps outline a structured approach recommended by the PDPC to ensure the\naccuracy, completeness, and consistency of the information recorded in the RoPA.\n\nNote:\n Data users must ensure the involvement of the data protection officer (DPO) as they are\n responsible for overseeing the preparation process and ensuring that the RoPA is\n complete and accurate.\n\na. Conduct an Asset Inventory\n\nBegin by identifying all systems, applications, databases, and repositories that process and\nstore the entity’s data, including those located on external devices or operated by third parties\n(e.g., devices used by consultants). Engage relevant departments, such as IT and finance, to\nensure effective identification of all data assets."}, {"id": "guide-ropa-002", "ref": "Record of Processing Activities (RoPA) Guidelines — RECORD", "text": "b. Consider Data Discovery Tools\n\nWhere feasible, use data discovery tools to automatically locate all data across systems. These\ntools can enhance accuracy, minimise manual effort, and ensure that no data is overlooked.\n\nc. Prepare the Interview Framework\n\nDevelop a structured questionnaire to collect relevant information from data owners and\nrelevant stakeholders, ensuring that all RoPA requirements are addressed consistently and\ncomprehensively across all departments.\n\nd. Conduct Interviews with Data Owners\n\nData owners are the individuals accountable for specific sets of data within the entity. Engage\ndirectly with them to collect all mandatory information on each processing activity and fill it\nin the RoPA template.\n\ne. Classify Personal Data\n\nThe RoPA requires the identification of non-sensitive personal data, sensitive personal data,\nand children’s personal data. Moreover, data classification is a crucial exercise that data users\nmust conduct to ensure the proper security of personal data.\n\nf. Ensure Regular Review and Updates\n\nEstablish a process for periodically reviewing and updating the RoPA, especially when new\nprocessing activities are introduced or existing ones are modified, to ensure it remains current\nand accurate.\n\n3. RoPA Structure and Content\n\nThe RoPA is best presented in a table format, where each row represents distinct processing\nactivities, while columns capture the key information describing the associated processing\nactivity. The information required in a controller-related-activities RoPA differs from that\nrequired in a processor-related-activities RoPA, meaning that data users must keep separate\nRoPAs.\n\nThe PDPC has developed two RoPA templates: one for controllers and controllers/processors,\nand another for processors. Data users shall complete the template that corresponds to their\nrole in each processing activity.\n\nEach template is accompanied by hypothetical examples to illustrate how the fields may be\ncompleted for pure guidance purposes. To download the template, please refer to RoPA\nTemplates.\n\nData users remain free to utilise any alternative template, provided it captures all information\nmandated by the data protection regulatory framework.\n\nThe following outlines the mandatory information required for each RoPA type:"}, {"id": "guide-ropa-003", "ref": "Record of Processing Activities (RoPA) Guidelines — 3.1 The Controller-Related-Activities RoPA", "text": "3.1 The Controller-Related-Activities RoPA\n • The type of the data user: controller or processor.\n • The name and contact details of the data user.\n • The name and contact details of the DPO.\n • The name and contact details of the data user’s legal representative.\n\n• The purpose(s) of processing activity.\n • The sub-purpose(s) of processing, if available.\n • The category(ies) of data subjects.\n • The data owner.\n • The categories of personal data, including its classification as non-sensitive data,\n sensitive data, and children’s data.\n • The data collection source.\n • The lawful basis.\n • Legitimate interest assessment (LIA) link, if applicable.\n • The data hosting environment: on-premises or on cloud.\n • The data hosting location: inside or outside the Arab Republic of Egypt.\n • The retention period or the criteria of determining it.\n • The data disposal measure(s).\n • The organisational roles with access to the data.\n • The implemented technical security measures.\n • The implemented organisational security measures.\n • Data protection impact assessment (DPIA) link, if applicable.\n • The recipient(s) or category(ies) of recipient(s).\n • The legal characterisation of the recipient(s).\n • Data protection agreement link (e.g., data processing agreement, data sharing\n agreement).\n • The foreign country(ies) data is transferred to.\n • The basis of cross-border transfer.\n • The implemented security measures for cross-border transfer.\n • Transfer impact assessment (TIA) link, if applicable."}, {"id": "guide-ropa-004", "ref": "Record of Processing Activities (RoPA) Guidelines — 3.2 The Processor-Related-Activities RoPA", "text": "3.2 The Processor-Related-Activities RoPA\n • The type of the data user: controller or processor.\n • The name and contact details of the data user.\n • The name and contact details of the DPO.\n • The name and contact details of the data user’s legal representative.\n • The category(ies) of processing activity.\n\n• The contact details of the controller and the controller’s legal representative and DPO.\n\n• Data processing agreement link.\n• The retention period and instructions specified by the controller.\n• The data disposal measure(s).\n• The implemented technical security measures.\n• The implemented organisational security measures.\n• The sub-processor or category(ies) of sub-processor(s).\n• Sub-processor agreement link.\n• The foreign country(ies) data is transferred to.\n• The legal basis of cross-border transfer.\n• The implemented security measures for cross-border transfer.\n\n@pdpceg info@pdpc.gov. eg"}, {"id": "guide-privacy-notice-001", "ref": "Privacy Notice Guidelines — PRIVACY NOTICE", "text": "PRIVACY NOTICE\n GUIDELINES\n\nVersion 1.1. - 26 January 2026\n\nIntroduction ....................................................................................................................................2\n1. Privacy Notice Content ..........................................................................................................3\n2. Structural Requirements of the Privacy Notice ..................................................................3\n3. Methods of Providing the Privacy Notice ............................................................................4\n4. Timing to Provide the Privacy Notice ..................................................................................5\n\nIntroduction\n\nA privacy notice is a key transparency tool that enables data subjects to obtain information on the\nprocessing activity, including why and how their personal data is collected and processed. All data\nusers must provide data subjects with a proper privacy notice when collecting and processing\npersonal data (Article 2 of the PDPL), and may consider preparing different privacy notices for\nvarious categories of data subjects—such as customers, vendors, and job applicants—to ensure\nthat the information provided is relevant and appropriate for the intended audience.\n\nA privacy notice does not constitute a consent request. The privacy notice serves as a transparency\ntool, informing data subjects about the processing of their personal data regardless of the lawful\nbasis relied upon. The consent request, by contrast, is the mechanism through which data users\nseek and obtain the data subject’s acceptance to the processing of their personal data. For more\ninformation about consent as a lawful basis, please refer to the Data Subject’s Consent Guideline.\n\nIt is also important to distinguish a privacy notice from a privacy policy. A privacy notice is\ndirected to data subjects and explains how their data will be handled, whereas a privacy policy is\nan internal governance document addressed to employees and relevant stakeholders, setting out\nthe data protection practices of the entity.\n\nThis guideline sets out:\n 1. Privacy notice content;\n 2. Structural requirements of a privacy notice;\n 3. Methods of providing the privacy notice; and\n 4. Timing to provide the privacy notice.\n\n1. Privacy Notice Content\n\nThe privacy notice must include at minimum the following:\n ● The identity and contact details of the data user;\n ● The contact details of the data protection officer (DPO);\n ● The categories of personal data collected;\n ● The lawful basis of processing;\n ● The purpose(s) of processing;\n ● The recipients or categories of recipients of the personal data, if applicable;\n ● Legal basis for cross border transfers, and the countries to which the data is transferred, if\n applicable;\n ● The retention period of processing, or criteria of determining such retention period, or a\n cross-reference to the retention policy;\n ● Data subjects’ rights and how to exercise them;\n ● Where the data is collected indirectly, the source from which the personal data was\n collected, or, if not possible, a general description of the categories of sources, where\n multiple sources are used (e.g., social media platforms); and\n ● The right to lodge complaints with the Personal Data Protection Center."}, {"id": "guide-privacy-notice-002", "ref": "Privacy Notice Guidelines — PRIVACY NOTICE", "text": "2. Structural Requirements of the Privacy Notice\n\nA privacy notice must be:\n ● In Arabic: The information must be provided in Arabic as the primary language. Data\n users remain free to add other languages depending on the intended audience.\n ● Intelligible: The information must be communicated in simple language that enables data\n subjects to clearly understand the privacy notice. Moreover, the language should be tailored\n to the characteristics of the intended audience, particularly when addressing children.\n ● Transparent: The information must be honest, not misleading or incomplete.\n ● Concise: The information must be precise and straightforward, using short sentences and\n organised paragraphs.\n ● Visible and prominent: The information must be visually apparent to the data subject,\n either online or in print.\n ● Easily accessible: The information must be provided to data subjects, in a way that does\n\nnot require them to search for the information. Data users should consider the context in\n which the personal data is collected to ensure the accessibility of the information to the\n data subject.\n ● Accurate and up to date: The information must be regularly reviewed to ensure its\n accuracy.\n\n3. Methods of Providing the Privacy Notice\n\nThe methods of providing the privacy notice may differ depending on the channel through which\npersonal data is collected:\n ● Online collection: The privacy notice must be provided on the website or through a direct\n link included in communications sent to the data subject (e.g., a link in a registration\n confirmation email).\n ● Telephone collection: The salient elements of the privacy notice must be communicated\n audibly, together with clear guidance on how the data subject may access the full notice\n (e.g., when a customer service agent collects personal data to follow up on a complaint, the\n agent must explain the purpose of collection, inform the data subject of their rights, and\n guide them on how to find the full notice online).\n ● In-person collection: The privacy notice must be made available in a clearly visible and\n accessible manner, whether through printed materials displayed in prominent locations\n (e.g., on the sales counter), or through digital access (e.g., a clearly labelled QR code titled\n “Privacy Notice” placed on registration forms or other documents)."}, {"id": "guide-privacy-notice-003", "ref": "Privacy Notice Guidelines — PRIVACY NOTICE", "text": "In addition, data users may adopt user-friendly design methods, provided that structural\ncompliance is maintained and that easy access to the full notice is always ensured. Such methods\ninclude:\n\n● Layered privacy notice: Instead of presenting a long and tedious text, key information\n may be provided upfront (e.g., data user identity, processing purposes, and data subject\n rights) in a concise and appropriate manner. Additional details may then be made available\n through expandable sections or links, allowing data subjects to access further information\n as needed (e.g., collapsible headings that can be expanded by clicking the “+” symbol to\n reveal additional information).\n\n● Just-in-time notices: Providing information relevant to the specific interaction, rather than\n presenting all information at once.\n\n● Use of video or animation: Deploying visual formats to simplify information, particularly\n when addressing children.\n\nIn all cases, irrespective of the method used, data users must ensure compliance with all\napplicable structural requirements of the privacy notice and must clearly inform data subjects\nhow to access the full privacy notice.\n\n4. Timing to Provide the Privacy Notice\n\nThe required timeframes for providing a privacy notice vary with each case.\n ● If the personal data is collected directly from the data subject, the privacy notice must be\n provided at the moment of collection (e.g., creating an online account).\n ● If the personal data is collected from other sources, the privacy notice must be provided as\n promptly as possible, within a maximum of thirty (30) days from the date of collection.\n However, while still adhering to the 30-day limit, where the personal data is processed for\n communication or disclosure purposes, the notice must be provided at the time of the first\n communication (e.g., in the first marketing communication), or prior to the first disclosure.\n\n@pdpceg info@pdpc.gov. eg"}, {"id": "guide-edm-001", "ref": "Electronic Direct Marketing Guidelines — ELECTRONIC DIRECT", "text": "ELECTRONIC DIRECT\n MARKETING\n GUIDELINES\n\nVersion 1.1. - 26 January 2026\n\nIntroduction ....................................................................................................................... 2\n1. EDM Key Concepts .................................................................................................... 3\n 1.1. Electronic Direct Marketing ............................................................................... 3\n 1.2. Creator and Sender ............................................................................................. 4\n 1.3. Opt In and Opt Out Mechanisms ........................................................................ 4\n2. EDM Obligations Under the PDPL ........................................................................... 4\n 2.1. Creators Obligations............................................................................................ 5\n 2.2. Senders Obligations ............................................................................................. 5\n 2.3. Electronic Direct Marketing Communications Content Obligations ............. 6\n3. Key Compliance Considerations ............................................................................... 7\n 3.1. Effective Opt Out Mechanisms ........................................................................... 7\n 3.2. Alignment Across All Systems ............................................................................ 7\n 3.3. Use of Third-Party Data ...................................................................................... 7\n 3.4. Use of Cookies and Tracking Technologies ....................................................... 7\n 3.5. Transparency and Consent Validity .................................................................. 8\n\nIntroduction\n\nElectronic direct marketing (EDM) has become a widely used tool for individuals and\norganisations seeking to promote their products, services, or initiatives, as they enable efficient\nand large-scale outreach. To do so, EDM relies extensively on personal data, including contact\ndetails, interests, and online behaviour, to tailor messages and reach target audiences\neffectively. They also frequently involve third parties, including email service providers and\nsocial media platforms, which facilitate delivery and audience targeting.\n\nGiven their nature, EDM gives rise to privacy concerns regarding the lawful parameters of data\ncollection, data sharing, and data security, and entails broader considerations concerning the\npotential impact of marketing activities on data subjects’ rights and freedoms. In this regard,\nthe Personal Data Protection Law (PDPL) introduces and regulates the concept of EDM in a\ndedicated chapter to ensure respect for data subjects’ rights and freedoms (Chapter 8).\n\nThis guideline sets out:\n\n1. EDM key concepts;\n 2. EDM obligations under the PDPL; and\n 3. Key compliance considerations.\n\n1. EDM Key Concepts\n\nThe following concepts are key to understanding EDM obligations under the PDPL:\n\n1.1. Electronic Direct Marketing\n\nFor Chapter 8 of the PDPL to apply, marketing communications must be both (a) electronic\nand (b) direct.\n\na. Electronic\nElectronic marketing definition (Article 1 of the PDPL):\n\n“Sending any message, statement, advertisement, or marketing content—by any technological\nmeans—which directly or indirectly aims to promote goods, services, or commercial, political,\nsocial, or charitable requests, targeted at specific individuals.”\n\nAccordingly, the means through which EDM is carried out—referred to as electronic direct\nmarketing communications (EDMCs)—encompass all forms of electronic communications,\nincluding emails, text messages (SMS or instant messaging), live telephone calls, and\nautomated calls."}, {"id": "guide-edm-002", "ref": "Electronic Direct Marketing Guidelines — ELECTRONIC DIRECT", "text": "In addition to the requirement of being electronic, the key element in any communication is\ntheir objective. Communications promoting a product, service or a cause fall under the scope\nof the PDPL, regardless of whether the objective of the communication is commercial or not.\nIn other words, the PDPL applies to communications regarding political or charitable matters,\nas well as communications promoting free offers.\n\nNote:\n Purely customer-service-related communications do not constitute EDM. This is so long\n as the communication does not mix customer-service-related information with\n promotional content. For instance, a communication with the sole purpose of informing\n the data subject of the expected delivery date of a product does not fall within the scope\n of EDM under the PDPL.\n\nb. Direct\nThe marketing communication must be direct, i.e., addressed to a specific individual or a\ndefined category of individuals, relying on personal data such as names, contact details, or\nonline identifiers.\n\nBy contrast, indirect communication refers to general or mass marketing activities that are not\ndirected at specific individuals or identifiable groups that do not involve the use of personal\ndata (such as billboards on public roads, television or radio commercials, or print\nadvertisements). Given the lack of a personal element, indirect marketing falls outside the\nscope of the PDPL.\n\nNote:\n General marketing content displayed on a website, such as promotional banners or bars\n that are shown uniformly to all visitors and are not targeted at specific individuals using\n their personal data, does not constitute EDM under the PDPL.\n However, where website marketing banners or bars are personalised, targeted, or\n triggered based on the processing of personal data (such as user profiles, behavioural data,\n or online identifiers), they may constitute EDM and remain subject to the applicable\n provisions of the PDPL.\n\n1.2. Creator and Sender\n\nCreators and senders can be either natural or juridical persons. While the creator determines\nthe purposes and means of the EDM, the sender is responsible for delivering the EDMC to the\ndata subject on behalf of the creator. The creator and the sender can be the same entity or\nseparate entities.\n\nExample:\n Company A determines the purposes and means of a marketing campaign to promote\n their latest products. Company A engages Company B to send promotional emails to\n their customers on their behalf."}, {"id": "guide-edm-003", "ref": "Electronic Direct Marketing Guidelines — ELECTRONIC DIRECT", "text": "Company A is the creator Company B is the sender\n\nIf Company A sends the EDMC directly using their internal mailing system, it will be\n considered both the creator and the sender.\n\n1.3. Opt In and Opt Out Mechanisms\n\nAn opt in mechanism refers to the means by which the data subject provides their consent to\nreceiving EDMCs. In other words, once a data subject has opted in, they are eligible to receive\nEDMCs.\n\nConversely, an opt-out mechanism refers to the means by which the data subject withdraws\ntheir given consent or object to receiving EDMCs. The data subject uses such a mechanism to\nopt out from receiving EDMCs. Subsequently, honouring opt out requests requires the\nsuppression of any personal data that was processed for EDM purposes.\n\n2. EDM Obligations Under the PDPL\n\nThe following obligations set out the key requirements for creators, senders and EDMC\ncontent.\n\n2.1. Creators Obligations\n\nCreators must:\n ● Obtain an EDM license or permit titled “EDM for Self” prior to initiating any EDMC\n (for more information on how to apply for permits and licenses, please refer to the\n Licenses and Permits Guideline);\n ● Obtain the data subject’s valid consent prior to the sending of any EDMCs (for more\n information on valid consent, please refer to the Data Subject’s Consent Guideline);\n ● Honour opt out requests without undue delay; and\n ● Maintain an updated and accurate record of all opt out requests (referred to as\n “suppression list”).\n\nTransitional Provisions for Existing Customers: the “soft opt in” mechanism\n To ease the compliance burden during the one-year compliance grace period of the PDPL,\n creators may rely on the “soft opt in” mechanism to lawfully continue sending EDMCs\n to existing customers. This approach is an exemption to obtaining valid consent in\n situations where there is an existing customer relationship established through a prior sale\n of a product or payment for a service, and when the marketing activity relates to similar\n products or services offered by the same creator.\n However, the “soft opt in” mechanism does not exempt creators nor senders from their\n EDM obligations, including the requirement to provide a valid opt out mechanism."}, {"id": "guide-edm-004", "ref": "Electronic Direct Marketing Guidelines — ELECTRONIC DIRECT", "text": "For more information on valid consent, please refer to the Data Subject’s Consent Guideline.\nFor more information on how to apply for permits and licenses, please refer to the Licenses\nand Permits Guideline.\n\n2.2. Senders Obligations\n\nSenders must:\n ● Obtain an EDM license or permit titled “EDM for others” prior to initiating any\n EDMCs, unless the creator is also the sender (for more information on how to apply\n for permits and licenses, please refer to the Licenses and Permits Guideline);\n ● Ensure the data subject’s valid consent is obtained;\n ● Refrain from disclosing the data subject’s contact details to any unauthorized\n entity; and\n ● Maintain electronic records evidencing the data subject’s consent, including any\n amendments or consent withdrawals. These records must be retained for a period of\n three (3) years from the date of the last EDMC sent to the data subject. For more\n information on consent records, please refer to the Consent Guideline.\n\n2.3. Electronic Direct Marketing Communications Content Obligations\n\nAll EDMCs must include the following elements:\n ● The identity of both the creator and the sender;\n ● The contact details of the sender;\n ● The purpose of the EDM; meaning the message must explicitly state its objective,\n such as promoting products, services, or offers (e.g., “the purpose of this message is\n to promote our latest product range and exclusive offers”); and\n ● A valid opt out mechanism.\n\nNote:\n Legally, both creators and senders are responsible for ensuring EDMC content obligations\n are met. To mitigate the risk of incurring liabilities for another party’s non-compliance,\n both creators and senders are advised to clearly define and allocate roles and\n responsibilities in written agreement, to ensure EDMCs contain all information mandated\n by the PDPL.\n\nWhat does a valid opt out mechanism look like?\n Opt out mechanisms must be:\n 1) CLEAR\n Presented in a visible and accessible format.\n • Consider: Display the “Unsubscribe” option clearly within the message in a\n prominent and easily readable format.\n • Avoid: Hide the “Unsubscribe” option within unrelated content or place it in a\n location that is difficult to find, such as in general website text or footer\n disclaimers.\n 2) SIMPLE\n The withdrawal process must not require more than two steps.\n • Consider: Provide a direct link that allows the user to confirm their opt out\n immediately.\n • Avoid: Require the user to log in, complete lengthy forms, or give reasons for\n unsubscribing."}, {"id": "guide-edm-005", "ref": "Electronic Direct Marketing Guidelines — 3) FREE OF CHARGE", "text": "3) FREE OF CHARGE\n No fees or costs may be imposed on the data subject for exercising this right.\n • Consider: Offer a free opt out option through a link or email.\n • Avoid: Require the user to call a premium-rate number or use any paid service to\n unsubscribe.\n\n3. Key Compliance Considerations\n\nBelow is a list of practice tips for creators and senders to avoid commonly encountered pitfalls.\n\n3.1. Effective Opt Out Mechanisms\n\nIt is important to regularly monitor the effectiveness of opt out mechanisms, for instance, by\nensuring that unsubscribe links function correctly and that keywords used for opt out requests\nare accurate.\n\nExample:\n Company A sends marketing messages that instruct individuals to reply “STOP” to\n unsubscribe. However, their system only recognises the keyword “FISTOP”, which\n renders the opt out requests ineffective as they are not reflected in the company’s\n suppression list. This renders the EDMCs unlawful, as every promotional communication\n must include a clear and effective opt out mechanism.\n\n3.2. Alignment Across All Systems\n\nLack of synchronisation of suppression records prevents opt out requests from being properly\nenforced when the data is processed across different systems. Therefore, it is important to:\n ● Map all systems across which the data is being processed to ensure the prompt and\n consistent reflection of opt out requests across all relevant systems, including\n marketing databases, contact lists, suppression records, and any tools used for\n EDMCs.\n ● Ensure that adequate internal governance and staff training are in place to honour opt\n out requests promptly and effectively.\n\n3.3. Use of Third-Party Data\n\nWhen obtaining personal data from brokers or partners, creators are legally liable to ascertain\nthe existence of a valid lawful basis prior to using or re-using third party data. Such measures\ninclude:\n ● Carrying out due diligence on the chain of collection;\n ● Verifying the lawful basis on which data is collected; and\n ● Ensuring that data subjects were informed that their data could be used by third\n parties.\n\n3.4. Use of Cookies and Tracking Technologies\n\nThe use of cookies or similar tracking technologies for EDM purposes is subject to EDM\nobligations, including obtaining the data subject’s prior valid consent."}, {"id": "guide-edm-006", "ref": "Electronic Direct Marketing Guidelines — 3) FREE OF CHARGE", "text": "3.5. Transparency and Consent Validity\n\nData users must avoid:\n ● Deceptive consent interfaces (“dark patterns”): Senders must avoid interfaces that\n visually emphasise the “accept” option while obscuring the “refusal” option, or those\n that bundle multiple choices into a single action. These practices create a false sense\n of choice, and lack transparency. Consent obtained through such interfaces is invalid\n as they are neither explicit, informed, nor freely given.\n ● Deceptive messaging formatting: Marketing communications must be explicitly\n identifiable as such. EDMCs cannot be disguised or formatted to resemble personal\n messages (e.g., mimicking the format and placement of emails within an inbox), since\n this presents a high risk of misleading the user. Acceptable alternative formats, such\n as “sticky banners”, must be clearly separated from a user’s content and remain\n visually distinct from the list of emails.\n\n@pdpceg info@pdpc.gov. eg"}, {"id": "guide-licenses-001", "ref": "Licenses and Permits Guidelines — LICENSES AND", "text": "LICENSES AND\n PERMITS\n GUIDELINES\n\nVersion 1.1. - 26 January 2026\n\nIntroduction ................................................................................................................................... 2\n1. The Distinction Between Licenses and Permits...................................................................... 3\n2. Categories of Licenses and Permits......................................................................................... 3\n 2.1. Types of General Licenses and Permits ...................................................................... 4\n a. Controller/Processor License or Permit................................................................. 4\n b. Controller License or Permit .................................................................................. 4\n c. Processor License or Permit.................................................................................... 4\n 2.2. Types of Supplementary Licenses and Permits .......................................................... 5\n a. Cross-Border Data Transfer License or Permit.................................................... 5\n b. Video Surveillance Systems License or Permit ..................................................... 5\n c. Direct Electronic Marketing License or Permit .................................................... 5\n3. The Application Process for Licenses and Permits ................................................................ 5\n 3.1. Pre-Submission via the Electronic Portal ................................................................... 5\n 3.2. Application Review and Decision Issuance ................................................................. 6\n 3.3. Prescribed Fees ............................................................................................................. 6\n4. Provisions Governing the Renewal of Licenses and Permits ................................................ 6\n 4.1. Licenses .......................................................................................................................... 6\n 4.2. Permits ........................................................................................................................... 7\n5. Amendments to the Terms of Licenses and Permits .............................................................. 7\n 5.1. Responding to the Requirements of Relevant International or Regional\n Agreements, or National Laws ............................................................................................. 7\n 5.2. At the Request of the Licensee or Permit Holder....................................................... 7\n 5.3. In the Case of Mergers Where the Data User Merges With Another Entity,\n Whether Within or Outside Egypt ....................................................................................... 7\n 5.4. Whenever the Amendment is Deemed Essential by the PDPC to Fulfil the\n Objectives of the PDPL and Safeguard the Rights of Data Subjects................................. 8\n6. Penalties for Violating the Provisions of the Data Protection Regulations .......................... 8\n7. Transitional Provisions: The One-Year Compliance Grace Period ..................................... 9\n\nIntroduction\n\nThe Personal Data Protection Center (PDPC) is responsible for issuing the required licenses and\npermits necessary for carrying out personal data processing activities, as established by Article 19\nof the Personal Data Protection Law (PDPL). Accordingly, data users may only process personal\ndata provided that they first obtain a license or permit from the PDPC.\n\nThis guideline sets out:\n 1. The distinction between licenses and permits;\n 2. The different types of licenses and permits;\n 3. The application procedures for obtaining the necessary licenses or permits;\n 4. The renewal of licenses and permits;\n 5. The amendment of the terms of the license or permit;\n 6. The applicable penalties in case of non-compliance; and\n 7. The transitional provisions related to the one-year compliance grace period."}, {"id": "guide-licenses-002", "ref": "Licenses and Permits Guidelines — LICENSES AND", "text": "1. The Distinction Between Licenses and Permits\n\nThe PDPL distinguishes between licenses and permits for personal data processing. The table\nbelow outlines their definition, eligibility, and the period of validity:\n\nLicense Permits\n\nA formal document issued by the A formal document issued by the\n PDPC to a juridical person, PDPC to a natural or juridical person,\n authorising the collection, storage, authorising the temporary processing\n transfer, or processing of personal of personal data, all in accordance\n data, as well as direct electronic with the rules, conditions, procedures,\n Definition marketing activities, all in accordance and technical standards specified in\n with the rules, conditions, procedures, the ER.\n and technical standards specified in\n the Executive Regulations (ER).\n\nJuridical persons, including Natural or juridical persons,\n government agencies, corporations, depending on the nature of the\n Eligibility non-profit organisations, and other processing activity.\n similar entities.\n\nA period of three (3) years, subject to A period that ranges between three\n Validity renewal. (3), six (6), nine (9), or twelve (12)\n Timeframe months, as determined by the PDPC,\n and subject to renewal.\n\n2. Categories of Licenses and Permits\n\nLicenses and permits are divided into categories that are each necessary for conducting either\ngeneral or specific processing activities. Such categorisation clearly determines the scope of the\nprocessing activities data users are allowed to engage in, as well as the scope of their respective\nroles within the processing activities themselves.\n\nThere are two different categories of licenses and permits:\n\nGeneral Supplementary\n\nGeneral licenses and permits are granted to Supplementary licenses and permits are issued\n data users before engaging in any personal to data users after obtaining a valid general\n data processing activity, all in accordance license or permit, enabling them to carry out\n with the purpose or activity specified in the certain processing activities that require\n application. additional approvals from the PDPC, all in\n accordance with the nature of the activity and\n General licenses and permits serve as a basis\n the volume of the processed personal data.\n for data users to undertake collection and/or\n processing of personal data, regardless of the\n nature or scope of their activities.\n\nNote:\n Supplementary licenses and permits may not be issued or remain valid without a valid general\n license or permit."}, {"id": "guide-licenses-003", "ref": "Licenses and Permits Guidelines — LICENSES AND", "text": "2.1. Types of General Licenses and Permits\n\nAmong their various types, the required license or permit is determined by the role the data user\noccupies in the processing activity.\n\nThere are three different types of general licenses and permits:\n\na. Controller/Processor License or Permit\n\nThis license or permit is granted to a natural or juridical person who engages in personal data\nprocessing activities in the capacity of both controller and processor simultaneously.\n\nb. Controller License or Permit\n\nThis license or permit is granted to a natural or juridical person who engages in personal data\nprocessing activities solely in the capacity of a controller—i.e., the entity that determines the\npurposes and means of such processing.\n\nc. Processor License or Permit\n\nThis license or permit is granted to a natural or juridical person who engages in personal data\nprocessing activities solely in the capacity of a processor—i.e., the entity that processes personal\ndata on behalf of and under the instructions of the controller, without having the authority to\ndetermine the purposes or means of the processing.\n\nPlease refer to the Data Users Guideline to appropriately identify the relevant role in the processing\nactivity.\n\n2.2. Types of Supplementary Licenses and Permits\n\nAdditionally, to the requirement of obtaining general licenses and permits, there are certain\nspecific processing activities that require supplementary approval.\n\nThere are three different types of supplementary licenses and permits:\n\na. Cross-Border Data Transfer License or Permit\nThis license or permit is granted to a natural or juridical person who transfers, or intends to transfer,\npersonal data to a recipient outside the Arab Republic of Egypt. This includes engaging with cloud\nservice providers where personal data is processed or stored on servers located outside Egypt\n\nb. Video Surveillance Systems License or Permit\nThis license or permit is granted to a natural or juridical person who uses, or intends to use, video\nsurveillance systems—including Closed-Circuit Television (CCTV)—through which images or\nvideos of individuals may be captured in public areas and can identify them. The use of video\nsurveillance systems for purely household monitoring purposes is exempt from prior approval.\n\nc. Direct Electronic Marketing License or Permit\nThis license or permit is granted to a natural or juridical person who sends, or intends to send,\nelectronic direct communications for the purpose of marketing products or services, whether such\ncommunications are carried out directly by the license applicant or through any third party acting\non their behalf."}, {"id": "guide-licenses-004", "ref": "Licenses and Permits Guidelines — LICENSES AND", "text": "3. The Application Process for Licenses and Permits\nLicenses and permits are obtained through a two-stage process:\n ● Obtaining a general license or permit; followed by\n ● Obtaining supplementary licenses or permits, if applicable.\n\nThe application process for licenses or permits differs according to the data user’s legal status.\nJuridical persons can apply for both licenses and permits, while natural persons can only apply for\npermits.\n 3.1. Pre-Submission via the Electronic Portal\nBefore applying for the required license or permit, data users must first answer a set of questions\nthrough the electronic portal of the PDPC, under the “Company Journey” section. Based on the\napplicant’s responses, the type of license or permit required to carry out their activity is determined.\n\nThe data user may then submit their application through the licenses and permits section available\non the electronic portal. Applicants must provide all required information and supporting\ndocuments, including a checklist and compliance declaration, as appropriate to the nature of the\nprocessing activities specified in the application.\n\n3.2. Application Review and Decision Issuance\n\nThe PDPC shall review the application and issue a decision thereon within a period not exceeding\nninety (90) days from the date of receipt of the application; failing which, the application shall be\ndeemed rejected.\n\nWhere necessary, the PDPC may request additional documents and may also require the data user\nto provide additional safeguards for the protection of personal data in the case they are deemed\ninsufficient.\n\nNote:\n Obtaining all necessary approvals, documents, and fulfilling any conditions required from\n other competent official authorities, depending on the nature of the processing activity, is a\n prerequisite for obtaining any license or permit issued by the PDPC. Licenses and permits\n issued by the PDPC for personal data processing activities do not replace or exempt the\n obligation to obtain the necessary approvals from other competent authorities.\n\n3.3. Prescribed Fees\n\nThe financial tables included in the ER specify the fees and types of general licenses and permits,\nbased on the size or number of personal data records, depending on the circumstances and the\nnature of such activities.\n\nA unified table of fees for entities of a special nature—namely associations, unions, and clubs—is\nalso attached to the financial tables."}, {"id": "guide-licenses-005", "ref": "Licenses and Permits Guidelines — LICENSES AND", "text": "Fees for supplementary licenses and permits are determined by percentage rates based on the value\nof the general license or permit, as well as the nature and volume of the personal data being\nprocessed. All fees may be amended by a decision issued by the PDPC’s Board of Directors\n\n4. Provisions Governing the Renewal of Licenses and Permits\n\n4.1. Licenses\nLicenses shall be granted for a period of three (3) years. Accordingly, the licensee must submit—\nthrough the electronic portal of the PDPC—an application for renewal at least three (3) months\n\nprior to the expiration date; this ensures the continuity of the license. Failure to submit such\napplication within the specified timeframe shall result in the automatic expiration of the license,\nand the data user shall no longer be licensed to process personal data.\n\n4.2. Permits\nPermits for specific activities shall be granted for a maximum period of one (1) year. Accordingly,\nthe permit holder must submit—through the electronic portal of the PDPC—an application for\nrenewal no later than one (1) month prior to the expiration date. Failure to submit such application\nwithin the specified timeframe shall result in the automatic expiration of the permit, and the data\nuser shall no longer be permitted to process personal data.\n\n5. Amendments to the Terms of Licenses and Permits\n\nUnder Article 28 of the PDPL, the PDPC may amend the terms of the licenses and permits after\ntheir issuance, where such amendments are justified on grounds of public interest in any of the\nfollowing cases:\n\n5.1. Responding to the Requirements of Relevant International or Regional\n Agreements, or National Laws\n\nThe PDPC may amend the license or permit whenever necessary to ensure compliance with\nobligations arising from international or regional agreements ratified by the Arab Republic of\nEgypt or from n
